<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Survival Knight — 22C</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0f0a}
  body{color:#e0e8e0;font-family:-apple-system,"Segoe UI",Roboto,Consolas,monospace;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;position:fixed;inset:0}
  #app{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;
    touch-action:none;background:#1a2a1a}

  /* ===== Rotate overlay ===== */
  #rotate{position:fixed;inset:0;background:linear-gradient(180deg,#0a0f0a,#050805);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;z-index:9999;padding:30px;text-align:center}
  #rotate.show{display:flex}
  #rotate .ph{width:64px;height:110px;border:4px solid #7fff7f;border-radius:12px;
    position:relative;box-shadow:0 0 32px rgba(127,255,127,.6);
    animation:rot 2.4s ease-in-out infinite}
  #rotate .ph::before{content:'';position:absolute;top:5px;left:50%;
    transform:translateX(-50%);width:24px;height:3px;background:#7fff7f;border-radius:2px}
  #rotate .ph::after{content:'';position:absolute;bottom:5px;left:50%;
    transform:translateX(-50%);width:14px;height:14px;
    border:2px solid #7fff7f;border-radius:50%}
  @keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
  #rotate h2{font-size:16px;letter-spacing:4px;color:#7fff7f;
    text-shadow:0 0 14px #7fff7f}
  #rotate p{font-size:12px;color:#6a7a6a;line-height:1.7}

  /* ===== Overlay menu ===== */
  #menu{position:absolute;inset:0;background:rgba(5,8,5,.92);
    display:flex;align-items:center;justify-content:center;
    z-index:10;padding:16px;backdrop-filter:blur(4px)}
  #menu.hide{display:none}
  .panel{max-width:480px;text-align:center;
    border:2px solid #2a4a2a;background:linear-gradient(180deg,#0f1a0f,#081208);
    border-radius:14px;padding:26px 22px;
    box-shadow:0 0 60px rgba(60,200,60,.25)}
  .panel h1{font-size:28px;letter-spacing:6px;color:#fff;
    text-shadow:0 0 18px #7fff7f,0 0 40px #7fff7f;margin-bottom:6px}
  .panel h1 span{color:#ffd54a;text-shadow:0 0 18px #ffd54a}
  .panel .sub{font-size:11px;letter-spacing:2px;color:#6a7a6a;margin-bottom:14px}
  .panel p{font-size:12px;line-height:1.7;color:#a8b8a8;margin-bottom:10px}
  .panel .stats{display:flex;gap:8px;justify-content:center;margin:14px 0;
    flex-wrap:wrap;font-size:11px}
  .panel .stat{padding:6px 10px;background:#0a150a;border-radius:6px;
    border:1px solid #2a4a2a}
  .panel .stat b{color:#ffd54a;display:block;font-size:14px;margin-top:2px}
  .panel button{margin-top:12px;padding:13px 34px;border-radius:8px;
    font-size:14px;letter-spacing:2px;font-weight:bold;color:#041a04;
    background:linear-gradient(180deg,#a4ffa4,#3fb85c);
    box-shadow:0 0 24px rgba(127,255,127,.5);
    border:none;cursor:pointer;font-family:inherit}
  .panel button:active{transform:scale(.97)}
  .legend{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0}
  .lg{font-size:9px;padding:3px 7px;border-radius:12px;
    border:1px solid #2a4a2a;background:#0a150a}

  /* ===== Loading ===== */
  #loading{position:fixed;inset:0;background:#0a0f0a;
    display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;z-index:100}
  #loading.show{display:flex}
  #loading .spin{width:36px;height:36px;border:3px solid #2a4a2a;
    border-top-color:#7fff7f;border-radius:50%;animation:spin .8s linear infinite}
  #loading .txt{font-size:11px;color:#6a7a6a;letter-spacing:1px;text-align:center}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Badge device */
  #badge{position:fixed;bottom:6px;right:6px;font-size:9px;color:#2a3a2a;
    background:#081208;padding:2px 6px;border-radius:8px;
    border:1px solid #1a2a1a;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
</div>

<div id="menu">
  <div class="panel">
    <h1>SURVIVAL <span>KNIGHT</span></h1>
    <p class="sub">ĐẤU TRƯỜNG ĐỊA NGỤC · 22C</p>
    <p id="menu-text">
      Bạn là hiệp sĩ cuối cùng.<br>
      Quái từ địa ngục tràn vào từ mọi phía.<br>
      <b>Sống sót càng lâu càng tốt.</b>
    </p>
    <div class="stats" id="menu-stats" style="display:none">
      <div class="stat">THỜI GIAN <b id="s-time">0s</b></div>
      <div class="stat">GIẾT <b id="s-kills">0</b></div>
      <div class="stat">ĐIỂM <b id="s-score">0</b></div>
    </div>
    <div class="legend">
      <span class="lg" style="color:#7fff7f">🕹 Joystick trái = Đi</span>
      <span class="lg" style="color:#ffd54a">⚔ Nút phải = Chém</span>
      <span class="lg" style="color:#7ff0ff">PC: WASD + Space</span>
    </div>
    <button id="playBtn">BẮT ĐẦU</button>
  </div>
</div>

<div id="rotate">
  <div class="ph"></div>
  <h2>XOAY NGANG</h2>
  <p>Vui lòng xoay ngang điện thoại<br>để chơi game</p>
</div>

<div id="loading">
  <div class="spin"></div>
  <div class="txt" id="loading-txt">Đang chuẩn bị...</div>
</div>

<div id="badge">—</div>

<script>
"use strict";
/* ============================================================
   SURVIVAL KNIGHT — 2D top-down survival
   Map taming.io style + Joystick + Combat
   ============================================================ */

/* ========== DEVICE DETECTION ========== */
const DEVICE = (function(){
  const ua = navigator.userAgent || '';
  const uaMobile = /Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(ua);
  let pc = false, pf = false;
  try {
    pc = matchMedia('(pointer:coarse)').matches;
    pf = matchMedia('(pointer:fine)').matches;
  } catch(e){}
  const hasTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const isMobile = uaMobile || (pc && !pf) || (hasTouch && !pf);
  return { isMobile, hasTouch };
})();

function isPortrait(){ return innerHeight > innerWidth; }
function updateBadge(){
  const b = document.getElementById('badge');
  if (!b) return;
  b.textContent = `${DEVICE.isMobile ? '📱' : '💻'} ${isPortrait() ? 'Dọc' : 'Ngang'} · ${innerWidth}×${innerHeight}`;
}
function checkOrientation(){
  const r = document.getElementById('rotate');
  if (DEVICE.isMobile && isPortrait()){
    r.classList.add('show');
    if (G.state === 'playing') G.state = 'paused-rot';
  } else {
    r.classList.remove('show');
    if (G.state === 'paused-rot') G.state = 'playing';
  }
  updateBadge();
}
addEventListener('resize', () => setTimeout(checkOrientation, 100));
addEventListener('orientationchange', () => setTimeout(checkOrientation, 250));

/* ========== CANVAS ========== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Kích thước canvas cố định — CSS scale
const VW = 960, VH = 600;
cv.width = VW; cv.height = VH;

function resizeCanvas(){
  // Vừa viewport, giữ aspect 960:600
  const availW = innerWidth;
  const availH = innerHeight;
  const aspect = VW / VH;
  let w = availW, h = availW / aspect;
  if (h > availH){ h = availH; w = availH * aspect; }
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
}
addEventListener('resize', resizeCanvas);

/* ========== WORLD ========== */
const WORLD_W = 2400, WORLD_H = 2400;
const TILE = 40;

const G = {
  state: 'menu',
  time: 0,
  kills: 0,
  spawnTimer: 0,
  bossTimer: 60,
  player: null,
  enemies: [],
  obstacles: [],
  decorations: [],
  particles: [],
  texts: [],
  cam: { x: 0, y: 0 }
};

const rand = (a,b) => a + Math.random()*(b-a);
const dist = (a,b,c,d) => Math.hypot(a-c, b-d);
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);

/* ========== INPUT STATE ========== */
const input = {
  joyId: null,
  joyCenter: { x: 0, y: 0 },
  joyVec: { x: 0, y: 0 },
  atkId: null,
  atkHeld: false,
  keys: {}
};
// UI vị trí (screen coords trong canvas)
const UI = {
  joy: { x: 120, y: VH - 120, r: 70, knobR: 34 },
  atk: { x: VW - 110, y: VH - 110, r: 58 }
};

/* ========== KNIGHT SPRITES (pixel art) ========== */
const PAL_KNIGHT = {

  b: '#4a7ab8',   // armor blue

  w: '#ffffff',   // white (visor)

const KNIGHT = {

};

/* ========== ENEMY SPRITES (tái sử dụng từ bản cũ) ========== */
const PAL = {
  imp:    { k:'#1a0505', b:'#8b2a2a', d:'#5a1414', w:'#6a1a1a', e:'#ffd24a', f:'#3a0a0a', m:'#3a0a0a', g:'#c44545' },
  hound:  { k:'#1a0a05', b:'#2a1505', d:'#0a0505', w:'#3a1a05', e:'#ffaa20', '1':'#ff6a20', '2':'#ffaa20', '3':'#ff2020' },
  wraith: { k:'#0a0515', b:'#3a1a5a', d:'#1a0a2a', w:'#5a2a8a', e:'#e8c8ff', g:'#c890ff' },
  brute:  { k:'#1a0a05', b:'#a05a3a', d:'#6a3a20', w:'#3a2010', e:'#ff3020', a:'#8a8a9a', m:'#5a5a6a' },
  boss:   { k:'#1a0510', b:'#6a1a3a', d:'#3a0a1a', w:'#2a0a1a', e:'#ffd24a', '1':'#ff6a20', '2':'#ffaa20' }
};

// Sprite quái: chỉ cần 2-3 frame mỗi con — vẽ đơn giản hơn
function makeEnemySprite(type){
  // Trả về grid string đơn giản cho mỗi con
  const grid = {
    imp: [
      "  k  k  ",
      " kbbbbk ",
      " kbebbk ",

      "kkbbbbkk",

      " kd  dk ",
      " kh  hk "
    ],
    hound: [
      "  kkk   ",
      " kbbbkk ",
      " kbebbbk",
      "kbkbbbkk",
      "kbbbbbkk",
      "kbk kbk ",
      "kk  kk  "
    ],
    wraith: [
      "  kkkk  ",
      " kbbbbk ",
      " kbeeek ",
      " kbbbbk ",
      " kbbbbk ",
      " kbbbbk ",
      "kbkbkbk ",
      " k k k  "
    ],
    brute: [
      "  kk kk   ",
      " kbbbbbk  ",
      " kbebebk  ",
      " kbbbbbk  ",
      "kkkbbbbkkk",
      "kbbbbbbbbbk",
      "kbbkbbkbbk",
      "kbk  bk bk",
      "kk    k  k"
    ],
    boss: [
      "   k  k     ",
      "  kbbbbk    ",
      "  kbebbk    ",
      "  kbbbbk    ",
      " kkkbbkkk   ",
      "kbbbbbbbbbk ",
      "kbbbbbbbbbk ",
      "kbbkbbbkbbk ",
      "kbk  bk  bk ",
      "kk    k   k "
    ]
  };
  return grid[type] || grid.imp;
}

/* ========== OBSTACLES / DECORATIONS ========== */
function genWorld(){
  G.obstacles = [];
  G.decorations = [];
  // Cây rải rác (không gần spawn player)
  for (let i = 0; i < 120; i++){
    const x = rand(150, WORLD_W - 150);
    const y = rand(150, WORLD_H - 150);
    if (dist(x, y, WORLD_W/2, WORLD_H/2) < 350) continue;
    G.obstacles.push({ type: 'tree', x, y, r: 26 });
  }
  // Đá
  for (let i = 0; i < 60; i++){
    const x = rand(120, WORLD_W - 120);
    const y = rand(120, WORLD_H - 120);
    if (dist(x, y, WORLD_W/2, WORLD_H/2) < 250) continue;
    G.obstacles.push({ type: 'rock', x, y, r: 22 });
  }
  // Bụi cỏ trang trí
  for (let i = 0; i < 500; i++){
    G.decorations.push({
      x: rand(0, WORLD_W),
      y: rand(0, WORLD_H),
      r: rand(5, 12),
      tone: rand(0, 1)
    });
  }
}

/* ========== PLAYER ========== */
function createPlayer(){
  return {
    x: WORLD_W/2,
    y: WORLD_H/2,
    vx: 0, vy: 0,
    hp: 100, maxHp: 100,
    speed: 220,
    radius: 18,
    facing: 1,           // 1 = phải, -1 = trái
    aimX: 1, aimY: 0,     // Hướng chém cuối
    state: 'idle',       // idle | walk | attack | hurt | dead
    stateT: 0,
    attackCd: 0,
    invuln: 0,
    hitFlash: 0
  };
}

/* ========== ENEMY ========== */
const ENEMY_DATA = {
  imp:    { hp: 30,   speed: 90,  damage: 8,  radius: 14, color: '#e8574a', size: 11 },
  hound:  { hp: 55,   speed: 140, damage: 12, radius: 16, color: '#e8963a', size: 13 },
  wraith: { hp: 85,   speed: 110, damage: 10, radius: 15, color: '#a95ce8', size: 12 },
  brute:  { hp: 220,  speed: 55,  damage: 22, radius: 22, color: '#b02b2b', size: 17 },
  boss:   { hp: 900,  speed: 45,  damage: 35, radius: 32, color: '#ff3040', size: 26 }
};

function spawnEnemy(type){
  const d = ENEMY_DATA[type];
  // Spawn xa player 500-800px
  const angle = Math.random() * Math.PI * 2;
  const range = rand(550, 850);
  let x = G.player.x + Math.cos(angle) * range;
  let y = G.player.y + Math.sin(angle) * range;
  x = clamp(x, 60, WORLD_W - 60);
  y = clamp(y, 60, WORLD_H - 60);

  G.enemies.push({
    type, x, y,
    hp: d.hp, maxHp: d.hp,
    speed: d.speed,
    damage: d.damage,
    radius: d.radius,
    color: d.color,
    size: d.size,
    facing: 1,
    state: 'walk',
    stateT: 0,
    attackCd: 0,
    hitFlash: 0,
    dead: false,
    deathTimer: 0,
    animPhase: rand(0, Math.PI*2),
    hitThisSwing: false
  });
}

/* ========== UPDATE ========== */
function update(dt){
  if (G.state === 'paused-rot') return;
  if (G.state !== 'playing') return;

  G.time += dt;
  const p = G.player;

  /* ----- Player input ----- */
  let dx = 0, dy = 0;
  if (input.joyId !== null){
    dx = input.joyVec.x;
    dy = input.joyVec.y;
  } else {
    if (input.keys['a'] || input.keys['arrowleft'])  dx -= 1;
    if (input.keys['d'] || input.keys['arrowright']) dx += 1;
    if (input.keys['w'] || input.keys['arrowup'])    dy -= 1;
    if (input.keys['s'] || input.keys['arrowdown'])  dy += 1;
  }
  const mag = Math.hypot(dx, dy);
  if (mag > 1){ dx /= mag; dy /= mag; }

  // Attack input (space or touch button)
  const wantAttack = input.keys[' '] || input.atkHeld;

  /* ----- Player state machine ----- */
  p.stateT += dt;
  if (p.invuln > 0) p.invuln -= dt;
  if (p.hitFlash > 0) p.hitFlash -= dt;
  if (p.attackCd > 0) p.attackCd -= dt;

  // Death
  if (p.hp <= 0 && p.state !== 'dead'){
    p.state = 'dead'; p.stateT = 0;
    gameOver();
    return;
  }
  if (p.state === 'dead'){ /* vẫn vẽ */ }

  // Attack
  if (wantAttack && p.attackCd <= 0 && p.state !== 'dead'){
    p.state = 'attack'; p.stateT = 0;
    p.attackCd = 0.5;
    // Aim theo hướng di chuyển cuối
    if (mag > 0.15){ p.aimX = dx; p.aimY = dy; }
    else { p.aimX = p.facing; p.aimY = 0; }
    // Reset hit flag cho enemies
    for (const e of G.enemies) e.hitThisSwing = false;
    // VFX
    burstVFX(p.x + p.aimX * 30, p.y + p.aimY * 30, '#ffd54a', 6, 120, 0.35);
  }
  if (p.state === 'attack' && p.stateT > 0.25){
    p.state = mag > 0.15 ? 'walk' : 'idle'; p.stateT = 0;
  }

  // Move
  if (p.state !== 'attack' && p.state !== 'hurt' && p.state !== 'dead'){
    const vx = dx * p.speed;
    const vy = dy * p.speed;
    moveWithCollision(p, vx * dt, vy * dt);

    if (mag > 0.15){
      p.state = 'walk';
      if (Math.abs(dx) > 0.1) p.facing = dx > 0 ? 1 : -1;
    } else {
      p.state = 'idle';
    }
  } else if (p.state === 'hurt' && p.stateT > 0.25){
    p.state = 'idle';
  }

  // Attack hit detection
  if (p.state === 'attack' && p.stateT < 0.25){
    const reach = 65;
    const halfAngle = Math.PI / 2.6; // ~69°
    const aimAngle = Math.atan2(p.aimY, p.aimX);
    for (const e of G.enemies){
      if (e.dead || e.hitThisSwing) continue;
      const d = dist(e.x, e.y, p.x, p.y);
      if (d > reach + e.radius) continue;
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      let diff = a - aimAngle;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      if (Math.abs(diff) < halfAngle){
        // Hit!
        const dmg = 25;
        e.hp -= dmg;
        e.hitFlash = 0.2;
        e.hitThisSwing = true;
        burstVFX(e.x, e.y, '#ffd54a', 8, 150, 0.4);
        addText(e.x, e.y - e.size - 8, '-' + dmg, '#ffd54a');
        // Knockback
        const kb = 90;
        e.x += Math.cos(a) * kb * dt * 8;
        e.y += Math.sin(a) * kb * dt * 8;
        if (e.hp <= 0 && !e.dead){
          e.dead = true;
          e.state = 'dead';
          e.deathTimer = 0.6;
          G.kills++;
          burstVFX(e.x, e.y, e.color, e.type === 'boss' ? 40 : 14,
                   e.type === 'boss' ? 260 : 150, 0.6);
          addText(e.x, e.y - 20, '+1', '#7fff7f');
        }
      }
    }
  }

  /* ----- Spawn enemies ----- */
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0){
    const t = G.time;
    let types = ['imp'];
    if (t > 15) types.push('hound');
    if (t > 30) types.push('hound','wraith');
    if (t > 50) types.push('wraith','brute');
    if (t > 80) types.push('brute');
    const type = types[Math.floor(Math.random() * types.length)];
    spawnEnemy(type);
    // Spawn rate tăng dần
    const baseRate = Math.max(0.35, 1.4 - t * 0.012);
    G.spawnTimer = baseRate * rand(0.7, 1.3);
  }

  /* ----- Boss spawn ----- */
  G.bossTimer -= dt;
  if (G.bossTimer <= 0){
    spawnEnemy('boss');
    addText(G.player.x, G.player.y - 80, '⚠ ĐẠI QUỶ XUẤT HIỆN', '#ff3040');
    G.bossTimer = 60;
  }

  /* ----- Enemies update ----- */
  for (const e of G.enemies){
    if (e.dead){
      e.deathTimer -= dt;
      continue;
    }
    if (e.hitFlash > 0) e.hitFlash -= dt;
    e.stateT += dt;
    if (e.attackCd > 0) e.attackCd -= dt;

    // Chase player
    const ex = p.x - e.x;
    const ey = p.y - e.y;
    const ed = Math.hypot(ex, ey) || 1;
    if (ed > 4){
      const sp = e.speed;
      const step = sp * dt;
      // Collision với obstacles
      moveEnemyWithCollision(e, ex / ed * step, ey / ed * step);
      if (Math.abs(ex) > 0.5) e.facing = ex > 0 ? 1 : -1;
    }

    // Attack player
    if (ed < e.radius + p.radius + 6 && e.attackCd <= 0){
      e.attackCd = 1.0;
      if (p.invuln <= 0 && p.state !== 'dead'){
        const dmg = e.damage;
        p.hp -= dmg;
        p.hitFlash = 0.2;
        p.invuln = 0.4;
        p.state = 'hurt'; p.stateT = 0;
        addText(p.x, p.y - 30, '-' + dmg, '#ff5a5a');
        burstVFX(p.x, p.y, '#ff3050', 10, 160, 0.4);
      }
    }
  }

  /* ----- Cleanup ----- */
  G.enemies = G.enemies.filter(e => !(e.dead && e.deathTimer <= 0));

  /* ----- Camera follow ----- */
  const targetCamX = p.x - VW/2;
  const targetCamY = p.y - VH/2;
  G.cam.x += (targetCamX - G.cam.x) * Math.min(1, dt * 8);
  G.cam.y += (targetCamY - G.cam.y) * Math.min(1, dt * 8);
  G.cam.x = clamp(G.cam.x, 0, WORLD_W - VW);
  G.cam.y = clamp(G.cam.y, 0, WORLD_H - VH);

  /* ----- Particles / texts ----- */
  for (const pa of G.particles){
    pa.life -= dt;
    pa.x += pa.vx * dt;
    pa.y += pa.vy * dt;
    pa.vx *= 0.92; pa.vy *= 0.92;
  }
  for (const t of G.texts){
    t.life -= dt; t.y -= 30 * dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);
  G.texts = G.texts.filter(t => t.life > 0);
}

/* ========== COLLISION ========== */
function moveWithCollision(obj, dx, dy){
  // X axis
  obj.x += dx;
  for (const o of G.obstacles){
    const d = dist(obj.x, obj.y, o.x, o.y);
    if (d < o.r + obj.radius){
      const a = Math.atan2(obj.y - o.y, obj.x - o.x);
      const push = o.r + obj.radius - d;
      obj.x += Math.cos(a) * push;
      obj.y += Math.sin(a) * push;
    }
  }
  // Y axis
  obj.y += dy;
  for (const o of G.obstacles){
    const d = dist(obj.x, obj.y, o.x, o.y);
    if (d < o.r + obj.radius){
      const a = Math.atan2(obj.y - o.y, obj.x - o.x);
      const push = o.r + obj.radius - d;
      obj.x += Math.cos(a) * push;
      obj.y += Math.sin(a) * push;
    }
  }
  // World bounds
  obj.x = clamp(obj.x, obj.radius, WORLD_W - obj.radius);
  obj.y = clamp(obj.y, obj.radius, WORLD_H - obj.radius);
}
function moveEnemyWithCollision(e, dx, dy){
  e.x = clamp(e.x + dx, e.radius, WORLD_W - e.radius);
  e.y = clamp(e.y + dy, e.radius, WORLD_H - e.radius);
  // Không check obstacles cho enemy — đơn giản, để chúng đi xuyên cây
}

/* ========== VFX ========== */
function burstVFX(x, y, color, n, spd, life){
  if (G.particles.length > 400) return;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = rand(spd * 0.3, spd);
    G.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life, maxLife: life, color, size: rand(2, 4)
    });
  }
}
function addText(x, y, text, color){
  G.texts.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
}

/* ========== SPRITE RENDER ========== */
function drawGridSprite(grid, pal, px, ox, oy){
  for (let r = 0; r < grid.length; r++){
    const row = grid[r];
    for (let c = 0; c < row.length; c++){
      const ch = row[c];
      if (ch === ' ') continue;
      const col = pal[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(ox + c*px), Math.round(oy + r*px),
                   Math.ceil(px), Math.ceil(px));
    }
  }
}

function getKnightGrid(state){
  switch (state){
    case 'attack': return KNIGHT.attack;
    case 'hurt':   return KNIGHT.hurt;
    case 'dead':   return KNIGHT.dead;
    case 'walk':   return KNIGHT.walk;
    default:       return KNIGHT.idle;
  }
}

function drawKnight(p){
  const grid = getKnightGrid(p.state);
  const rows = grid.length;
  const cols = grid[0].length;
  const px = 3.2;               // pixel size
  const totalW = cols * px;
  const totalH = rows * px;

  ctx.save();
  ctx.translate(p.x - G.cam.x, p.y - G.cam.y);

  // Shadow
  if (p.state !== 'dead'){
    ctx.beginPath();
    ctx.ellipse(0, 14, 16, 6, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fill();
  }

  // Flip
  if (p.facing < 0) ctx.scale(-1, 1);

  // Bob khi walk
  let bobY = 0;
  if (p.state === 'walk') bobY = Math.sin(G.time * 12) * 1.5;
  if (p.state === 'idle') bobY = Math.sin(G.time * 3) * 0.8;

  // Death fade
  let alpha = 1;
  if (p.state === 'dead'){
    alpha = Math.max(0.3, 1 - p.stateT * 0.3);
  }
  ctx.globalAlpha = alpha;

  // Hit flash
  const pal = { ...PAL_KNIGHT };
  if (p.hitFlash > 0){
    pal.b = '#ffffff'; pal.d = '#ffdddd';
  }

  // Draw
  drawGridSprite(grid, pal, px, -totalW/2, -totalH + 12 + bobY);
  ctx.globalAlpha = 1;

  ctx.restore();

  // Aim line khi đang attack
  if (p.state === 'attack'){
    const reach = 65;
    const a = Math.atan2(p.aimY, p.aimX);
    const x1 = p.x - G.cam.x, y1 = p.y - G.cam.y;
    const x2 = x1 + Math.cos(a) * reach;
    const y2 = y1 + Math.sin(a) * reach;

    ctx.save();
    const prog = p.stateT / 0.25;
    ctx.globalAlpha = 0.8 * (1 - prog);
    ctx.strokeStyle = '#ffd54a';
    ctx.lineWidth = 4;
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#ffd54a';
    ctx.beginPath();
    ctx.arc(x1, y1, reach, a - Math.PI/2.6, a + Math.PI/2.6);
    ctx.stroke();
    ctx.restore();
  }
}

function drawEnemy(e){
  const sx = e.x - G.cam.x;
  const sy = e.y - G.cam.y;
  if (sx < -80 || sx > VW + 80 || sy < -80 || sy > VH + 80) return;

  ctx.save();
  ctx.translate(sx, sy);

  if (e.state !== 'dead'){
    // Shadow
    ctx.beginPath();
    ctx.ellipse(0, e.size * 0.6, e.size * 0.9, e.size * 0.3, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
  }

  if (e.facing < 0) ctx.scale(-1, 1);

  // Death
  let alpha = 1;
  if (e.dead){
    alpha = Math.max(0, e.deathTimer / 0.6);
    ctx.globalAlpha = alpha;
    ctx.scale(0.6 + alpha * 0.4, 0.6 + alpha * 0.4);
  }

  const grid = makeEnemySprite(e.type);
  const rows = grid.length;
  const cols = grid[0].length;
  const px = (e.size * 2.0) / cols;

  const pal = { ...PAL[e.type] };
  if (e.hitFlash > 0){
    pal.b = '#ffffff'; pal.d = '#ffdddd';
  }

  let bob = 0;
  if (!e.dead) bob = Math.sin(G.time * 8 + e.animPhase) * 1.2;

  drawGridSprite(grid, pal, px, -cols*px/2, -rows*px + e.size*0.4 + bob);

  ctx.restore();

  // HP bar
  if (!e.dead && e.hp < e.maxHp){
    const w = e.type === 'boss' ? 60 : 30;
    const h = e.type === 'boss' ? 5 : 3;
    const bx = sx - w/2, by = sy - e.size - (e.type === 'boss' ? 22 : 16);
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(bx-1, by-1, w+2, h+2);
    const pct = Math.max(0, e.hp/e.maxHp);
    ctx.fillStyle = pct > 0.5 ? '#5ce07a' : pct > 0.25 ? '#e8c23a' : '#e8503a';
    ctx.fillRect(bx, by, w*pct, h);
  }
}

/* ========== WORLD RENDER ========== */
function drawWorldBackground(){
  // Grass base
  ctx.fillStyle = '#1a2e1a';
  ctx.fillRect(0, 0, VW, VH);

  // Grass tiles có tone khác nhau
  const startCol = Math.floor(G.cam.x / TILE);
  const startRow = Math.floor(G.cam.y / TILE);
  const endCol = startCol + Math.ceil(VW / TILE) + 1;
  const endRow = startRow + Math.ceil(VH / TILE) + 1;

  for (let c = startCol; c < endCol; c++){
    for (let r = startRow; r < endRow; r++){
      // Deterministic tone từ vị trí
      const h = (c * 73856093 ^ r * 19349663) >>> 0;
      const tone = (h % 100) / 100;
      if (tone < 0.3) ctx.fillStyle = '#1a2e1a';
      else if (tone < 0.6) ctx.fillStyle = '#1d321d';
      else if (tone < 0.85) ctx.fillStyle = '#183018';
      else ctx.fillStyle = '#203520';
      const x = c * TILE - G.cam.x;
      const y = r * TILE - G.cam.y;
      ctx.fillRect(x, y, TILE, TILE);
    }
  }
}

function drawDecorations(){
  for (const d of G.decorations){
    const x = d.x - G.cam.x;
    const y = d.y - G.cam.y;
    if (x < -30 || x > VW + 30 || y < -30 || y > VH + 30) continue;
    // Bụi cỏ
    ctx.fillStyle = d.tone > 0.5 ? '#2a4a2a' : '#2d5230';
    ctx.beginPath();
    ctx.ellipse(x, y, d.r, d.r * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    // Vài cọng cỏ
    ctx.strokeStyle = d.tone > 0.5 ? '#3a6a3a' : '#3d7240';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.moveTo(x + (i-1)*3, y + 2);
      ctx.lineTo(x + (i-1)*3 - 1, y - d.r * 0.7);
      ctx.stroke();
    }
  }
}

function drawObstacles(){
  // Sort theo y để fake depth
  const visible = G.obstacles.filter(o => {
    const x = o.x - G.cam.x, y = o.y - G.cam.y;
    return x > -80 && x < VW + 80 && y > -100 && y < VH + 80;
  }).sort((a, b) => a.y - b.y);

  for (const o of visible){
    const x = o.x - G.cam.x;
    const y = o.y - G.cam.y;

    // Shadow
    ctx.beginPath();
    ctx.ellipse(x, y + o.r * 0.5, o.r * 1.1, o.r * 0.4, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();

    if (o.type === 'tree'){
      // Thân cây
      ctx.fillStyle = '#3a2410';
      ctx.fillRect(x - 5, y - 4, 10, o.r + 4);
      // Tán cây (3 lớp)
      ctx.fillStyle = '#1e4a1e';
      ctx.beginPath();
      ctx.arc(x, y - o.r * 0.7, o.r * 1.1, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#2a5a2a';
      ctx.beginPath();
      ctx.arc(x - 6, y - o.r * 0.9, o.r * 0.75, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#3a7a3a';
      ctx.beginPath();
      ctx.arc(x + 5, y - o.r * 0.5, o.r * 0.6, 0, Math.PI*2);
      ctx.fill();
      // Highlight
      ctx.fillStyle = '#4a8a4a';
      ctx.beginPath();
      ctx.arc(x - 8, y - o.r * 1.0, o.r * 0.35, 0, Math.PI*2);
      ctx.fill();
    } else if (o.type === 'rock'){
      // Đá
      ctx.fillStyle = '#4a4a52';
      ctx.beginPath();
      ctx.moveTo(x - o.r, y + o.r * 0.3);
      ctx.lineTo(x - o.r * 0.7, y - o.r * 0.6);
      ctx.lineTo(x, y - o.r);
      ctx.lineTo(x + o.r * 0.8, y - o.r * 0.5);
      ctx.lineTo(x + o.r, y + o.r * 0.4);
      ctx.closePath();
      ctx.fill();
      // Highlight
      ctx.fillStyle = '#6a6a72';
      ctx.beginPath();
      ctx.moveTo(x - o.r * 0.5, y - o.r * 0.5);
      ctx.lineTo(x, y - o.r * 0.85);
      ctx.lineTo(x + o.r * 0.4, y - o.r * 0.35);
      ctx.closePath();
      ctx.fill();
    }
  }
}

function drawParticles(){
  for (const p of G.particles){
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - G.cam.x, p.y - G.cam.y, p.size * a, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTexts(){
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px monospace';
  for (const t of G.texts){
    const a = Math.max(0, t.life / t.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = t.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(t.text, t.x - G.cam.x, t.y - G.cam.y);
    ctx.fillText(t.text, t.x - G.cam.x, t.y - G.cam.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

/* ========== UI RENDER (screen space) ========== */
function drawUI(){
  const p = G.player;

  // ---- HP bar ----
  const hpW = 240, hpH = 20;
  const hpX = 20, hpY = 20;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(hpX - 2, hpY - 2, hpW + 4, hpH + 4);
  ctx.fillStyle = '#2a0a0a';
  ctx.fillRect(hpX, hpY, hpW, hpH);

  const pct = Math.max(0, p.hp / p.maxHp);
  const grad = ctx.createLinearGradient(hpX, 0, hpX + hpW, 0);
  grad.addColorStop(0, '#ff3a3a');
  grad.addColorStop(1, '#ff7a3a');
  ctx.fillStyle = grad;
  ctx.fillRect(hpX, hpY, hpW * pct, hpH);

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(hpX, hpY, hpW, hpH);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, hpX + hpW/2, hpY + 14);
  ctx.textAlign = 'left';

  // ---- Time + Kills + Score ----
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;

  const tStr = `⏱ ${G.time.toFixed(1)}s`;
  const kStr = `☠ ${G.kills}`;
  const score = Math.floor(G.time * 10 + G.kills * 25);

  ctx.strokeText(tStr, VW - 200, 32); ctx.fillText(tStr, VW - 200, 32);
  ctx.strokeText(kStr, VW - 200, 56); ctx.fillText(kStr, VW - 200, 56);
  ctx.fillStyle = '#ffd54a';
  ctx.strokeText(`★ ${score}`, VW - 200, 80);
  ctx.fillText(`★ ${score}`, VW - 200, 80);

  // ---- Joystick (chỉ mobile) ----
  if (DEVICE.isMobile){
    // Base ring
    ctx.beginPath();
    ctx.arc(UI.joy.x, UI.joy.y, UI.joy.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Knob
    const kx = UI.joy.x + input.joyVec.x * (UI.joy.r - UI.joy.knobR);
    const ky = UI.joy.y + input.joyVec.y * (UI.joy.r - UI.joy.knobR);
    ctx.beginPath();
    ctx.arc(kx, ky, UI.joy.knobR, 0, Math.PI*2);
    ctx.fillStyle = input.joyId !== null ? 'rgba(127,255,127,0.7)' : 'rgba(255,255,255,0.4)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('DI CHUYỂN', UI.joy.x, UI.joy.y + UI.joy.r + 18);
    ctx.textAlign = 'left';

    // ---- Attack button ----
    const atkPressed = input.atkId !== null;
    ctx.beginPath();
    ctx.arc(UI.atk.x, UI.atk.y, UI.atk.r, 0, Math.PI*2);
    ctx.fillStyle = atkPressed ? 'rgba(255,213,74,0.85)' : 'rgba(255,213,74,0.35)';
    ctx.fill();
    ctx.strokeStyle = atkPressed ? '#fff' : '#ffd54a';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Sword icon
    ctx.save();
    ctx.translate(UI.atk.x, UI.atk.y);
    ctx.rotate(-Math.PI / 4);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-14, 0); ctx.lineTo(14, 0);
    ctx.moveTo(-10, -6); ctx.lineTo(-10, 6);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CHÉM', UI.atk.x, UI.atk.y + UI.atk.r + 18);
    ctx.textAlign = 'left';
  }

  // Red flash khi HP thấp
  if (p.hp / p.maxHp < 0.3 && p.state !== 'dead'){
    const t = G.time * 4;
    const a = 0.15 + Math.abs(Math.sin(t)) * 0.15;
    ctx.fillStyle = `rgba(255,0,0,${a})`;
    ctx.fillRect(0, 0, VW, VH);
  }
}

/* ========== MAIN RENDER ========== */
function render(){
  drawWorldBackground();
  drawDecorations();
  drawObstacles();

  // Enemies sort theo y
  const sortedEnemies = [...G.enemies].sort((a, b) => a.y - b.y);
  // Vẽ enemy + player theo thứ tự y
  const allActors = [
    ...sortedEnemies.map(e => ({ y: e.y, draw: () => drawEnemy(e) })),
    { y: G.player.y, draw: () => drawKnight(G.player) }
  ];
  allActors.sort((a, b) => a.y - b.y);
  for (const a of allActors) a.draw();

  drawParticles();
  drawTexts();
  drawUI();
}

/* ========== LOOP ========== */
let last = performance.now();
function loop(now){
  try {
    let dt = (now - last) / 1000;
    last = now;
    dt = Math.min(dt, 0.05);
    update(dt);
    render();
  } catch(err){ console.error(err); }
  requestAnimationFrame(loop);
}

/* ========== INPUT HANDLERS ========== */
function toCanvasXY(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (VW / r.width),
    y: (clientY - r.top) * (VH / r.height)
  };
}

function isInJoystick(x, y){
  return dist(x, y, UI.joy.x, UI.joy.y) < UI.joy.r + 30;
}
function isInAttackBtn(x, y){
  return dist(x, y, UI.atk.x, UI.atk.y) < UI.atk.r + 20;
}

function handleTouchStart(e){
  if (G.state !== 'playing'){
    // Không chặn nếu đang menu
    return;
  }
  e.preventDefault();
  for (const t of e.changedTouches){
    const p = toCanvasXY(t.clientX, t.clientY);
    if (DEVICE.isMobile && input.joyId === null && isInJoystick(p.x, p.y)){
      input.joyId = t.identifier;
      input.joyCenter = { x: p.x, y: p.y };
      input.joyVec = { x: 0, y: 0 };
    } else if (DEVICE.isMobile && input.atkId === null && isInAttackBtn(p.x, p.y)){
      input.atkId = t.identifier;
      input.atkHeld = true;
    } else if (!DEVICE.isMobile){
      // PC: touch = click attack
      input.atkHeld = true;
    }
  }
}

function handleTouchMove(e){
  if (G.state !== 'playing') return;
  e.preventDefault();
  for (const t of e.changedTouches){
    if (t.identifier === input.joyId){
      const p = toCanvasXY(t.clientX, t.clientY);
      const dx = p.x - UI.joy.x;
      const dy = p.y - UI.joy.y;
      const d = Math.hypot(dx, dy);
      const maxR = UI.joy.r - UI.joy.knobR * 0.3;
      if (d > maxR){
        input.joyVec = { x: dx/d * 1, y: dy/d * 1 };
      } else {
        input.joyVec = { x: dx / maxR, y: dy / maxR };
      }
    }
  }
}

function handleTouchEnd(e){
  for (const t of e.changedTouches){
    if (t.identifier === input.joyId){
      input.joyId = null;
      input.joyVec = { x: 0, y: 0 };
    }
    if (t.identifier === input.atkId){
      input.atkId = null;
      input.atkHeld = false;
    }
  }
  // PC: reset attack
  if (!DEVICE.isMobile) input.atkHeld = false;
}

cv.addEventListener('touchstart', handleTouchStart, { passive: false });
cv.addEventListener('touchmove', handleTouchMove, { passive: false });
cv.addEventListener('touchend', handleTouchEnd, { passive: false });
cv.addEventListener('touchcancel', handleTouchEnd, { passive: false });

// PC mouse
cv.addEventListener('mousedown', (e) => {
  if (G.state !== 'playing') return;
  if (!DEVICE.isMobile){
    // Check nếu click vào attack button
    const p = toCanvasXY(e.clientX, e.clientY);
    if (isInAttackBtn(p.x, p.y)) input.atkHeld = true;
    else input.atkHeld = true; // Bất kỳ click nào cũng attack
  }
});
cv.addEventListener('mouseup', () => {
  if (!DEVICE.isMobile) input.atkHeld = false;
});

// PC keyboard
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  input.keys[k] = true;
  if (k === ' '){ e.preventDefault(); }
});
addEventListener('keyup', (e) => {
  input.keys[e.key.toLowerCase()] = false;
});

/* ========== GAME FLOW ========== */
const menu = document.getElementById('menu');
const menuText = document.getElementById('menu-text');
const menuStats = document.getElementById('menu-stats');
const playBtn = document.getElementById('playBtn');
const stTime = document.getElementById('s-time');
const stKills = document.getElementById('s-kills');
const stScore = document.getElementById('s-score');

function startGame(){
  G.time = 0;
  G.kills = 0;
  G.spawnTimer = 1.0;
  G.bossTimer = 60;
  G.enemies = [];
  G.particles = [];
  G.texts = [];
  G.player = createPlayer();
  G.cam.x = G.player.x - VW/2;
  G.cam.y = G.player.y - VH/2;
  genWorld();
  G.state = 'playing';
  menu.classList.add('hide');
  checkOrientation();
}

function gameOver(){
  const score = Math.floor(G.time * 10 + G.kills * 25);
  menuText.innerHTML = 'Bạn đã chiến đấu đến hơi thở cuối cùng.';
  stTime.textContent = G.time.toFixed(1) + 's';
  stKills.textContent = G.kills;
  stScore.textContent = score;
  menuStats.style.display = 'flex';
  playBtn.textContent = 'CHƠI LẠI';
  menu.classList.remove('hide');
}

playBtn.addEventListener('click', () => {
  startGame();
});

/* ========== INIT ========== */
function init(){
  resizeCanvas();
  updateBadge();
  checkOrientation();
  // Khởi tạo player để vẽ menu background (không dùng)
  G.player = createPlayer();
  genWorld();
  G.cam.x = G.player.x - VW/2;
  G.cam.y = G.player.y - VH/2;
  requestAnimationFrame(loop);
}

// Chờ DOM sẵn sàng
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
