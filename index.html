<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dragon Hunter</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--text:#e8f0d8;--text-dim:#a8b498;--accent:#6fbf4a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#14180f;
  font-family:'Segoe UI',Arial,sans-serif;color:var(--text);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;position:fixed;inset:0}
canvas{display:block;image-rendering:pixelated;touch-action:none}
button{cursor:pointer;font-family:inherit;touch-action:manipulation}
#coords{position:fixed;top:8px;left:8px;color:#fff;font-size:11px;font-family:Consolas,monospace;
  background:rgba(0,0,0,.5);padding:4px 8px;border-radius:4px;z-index:5;pointer-events:none}
#time{position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#ffd54a;font-size:12px;
  font-weight:bold;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:10px;z-index:5;pointer-events:none}
#netInfo{position:fixed;top:44px;right:8px;color:#a8ffd8;font-size:11px;font-family:Consolas,monospace;
  background:rgba(20,40,30,.85);padding:5px 10px;border-radius:6px;z-index:5;pointer-events:none;
  border:1px solid #3a5a4a;display:none;line-height:1.5}
#netInfo.show{display:block}
#netInfo b{color:#e8ff80}
#hpBar{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
  gap:8px;padding:6px 14px;background:rgba(0,0,0,.7);border:2px solid #000;border-radius:8px;
  z-index:5;pointer-events:none;font-family:Consolas,monospace;box-shadow:0 2px 0 rgba(0,0,0,.5);
  transition:box-shadow .2s}
#hpBar .heartIcon{font-size:16px}
#hpFill{width:180px;height:12px;background:#3a1010;border:1px solid #000;position:relative;overflow:hidden;border-radius:2px}
#hpFillInner{height:100%;width:100%;background:linear-gradient(180deg,#ff6b6b,#c02020);transition:width .2s}
#hpText{font-size:11px;color:#ffd0d0;font-weight:bold;min-width:44px;text-align:right}
#hotbar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:2px;
  padding:3px;background:rgba(20,24,16,.9);border:2px solid #000;border-radius:4px;z-index:6;
  box-shadow:0 2px 0 rgba(0,0,0,.6)}
.hslot{width:48px;height:48px;background:#586048;border:2px solid #2a3020;position:relative;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .1s}
.hslot:hover{background:#687658}
.hslot.active{border-color:#fff;background:#78886a;box-shadow:0 0 0 1px #000 inset}
.hslot .ic{width:40px;height:40px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated}
.hslot .lbl{position:absolute;top:2px;left:4px;font-size:9px;color:#c8d8b8;font-weight:bold}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:14px}
.modal.hidden{display:none!important}
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);
  color:#fff;padding:8px 16px;border-radius:4px;font-size:12px;z-index:30;opacity:0;
  transition:opacity .25s;pointer-events:none;border:1px solid #333}
#toast.show{opacity:1}
.menu-panel{background:linear-gradient(180deg,#3a4438 0%,#2a3328 100%);border:3px solid #0a0d08;
  box-shadow:inset 0 0 0 2px #5a6850,inset 0 0 0 4px #8a9878,0 8px 0 #000,0 12px 30px rgba(0,0,0,.7);
  padding:24px 28px;text-align:center;max-width:520px;width:100%;max-height:92vh;overflow-y:auto;
  border-radius:6px;position:relative;z-index:1}
.logo{font-size:30px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(180deg,#ffe888 0%,#ff6020 55%,#8a1a00 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 2px 0 rgba(0,0,0,.4);margin-bottom:4px;font-family:Consolas,monospace;line-height:1.1}
.logo-sub{font-size:10px;color:#8a9878;letter-spacing:3px;margin-bottom:20px;
  font-family:Consolas,monospace;text-transform:uppercase}
.menu-page{display:flex;flex-direction:column;gap:10px}
.menu-page.hidden{display:none}
.menu-page h3{font-size:13px;color:#a8b498;letter-spacing:2px;margin:6px 0 10px;font-family:Consolas,monospace}
.mbtn{background:linear-gradient(180deg,#6a7860 0%,#4a5440 100%);color:#e8f0d8;border:2px solid #0a0d08;
  box-shadow:inset 0 1px 0 #98a888,0 4px 0 #1a1f14;padding:13px 18px;font-size:14px;font-weight:bold;
  cursor:pointer;letter-spacing:1px;border-radius:3px;font-family:inherit;transition:all .08s;
  display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:2;
  user-select:none;-webkit-user-select:none;width:100%}
.mbtn:hover{background:linear-gradient(180deg,#7a8870 0%,#5a6450 100%)}
.mbtn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #98a888,0 2px 0 #1a1f14}
.mbtn.primary{background:linear-gradient(180deg,#88d858 0%,#4a8a30 100%);
  box-shadow:inset 0 1px 0 #b8ff88,0 4px 0 #1a3a10;color:#0a1a06;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.mbtn.primary:hover{background:linear-gradient(180deg,#98e868 0%,#5a9a40 100%)}
.mbtn.danger{background:linear-gradient(180deg,#d05848 0%,#8a2a20 100%);
  box-shadow:inset 0 1px 0 #ff9888,0 4px 0 #3a0a06;color:#fff}
.mbtn.back{background:linear-gradient(180deg,#5a5850 0%,#3a3830 100%);font-size:12px;padding:10px;
  margin-top:8px;box-shadow:inset 0 1px 0 #888878,0 4px 0 #1a1810}
.menu-page label{font-size:11px;color:#a8b498;text-align:left;display:block;margin:8px 0 4px;letter-spacing:1px}
.menu-page input[type=text]{width:100%;padding:10px 12px;background:#1a2018;color:#e8f0d8;
  border:2px solid #0a0d08;border-radius:3px;font-family:inherit;font-size:14px;letter-spacing:2px;
  text-align:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.5);position:relative;z-index:2}
.menu-page input:focus{outline:none;border-color:#6fbf4a}
.code-display{margin:14px 0;padding:14px;background:#0a0d08;border:2px dashed #4a8a30;border-radius:6px;
  font-size:26px;font-weight:900;letter-spacing:6px;color:#88ff60;font-family:Consolas,monospace;
  text-shadow:0 0 12px rgba(136,255,96,.6);text-align:center}
.status-text{font-size:11px;color:#a8b498;margin-top:10px;min-height:16px;font-family:Consolas,monospace}
.setting-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.setting-row label{flex:0 0 140px;font-size:11px;color:#a8b498;text-align:left;margin:0}
.setting-row input[type=range]{flex:1;-webkit-appearance:none;height:14px;background:#1a2018;
  border:2px solid #0a0d08;border-radius:8px;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.setting-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  background:linear-gradient(180deg,#a8b898 0%,#68765a 100%);border:2px solid #0a0d08;border-radius:50%;
  cursor:pointer;box-shadow:0 2px 0 #1a1f14}
.setting-row .val{font-size:11px;color:#88ff60;font-family:Consolas,monospace;min-width:44px;text-align:right}
.pause-panel{background:linear-gradient(180deg,#3a4438 0%,#2a3328 100%);border:3px solid #0a0d08;
  box-shadow:inset 0 0 0 2px #5a6850,inset 0 0 0 4px #8a9878,0 8px 0 #000,0 12px 30px rgba(0,0,0,.7);
  padding:24px 28px;text-align:center;max-width:360px;width:100%;border-radius:6px;
  display:flex;flex-direction:column;gap:10px}
.pause-panel h2{font-family:Consolas,monospace;font-size:22px;letter-spacing:4px;color:#e8f0d8;
  margin-bottom:10px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#touchUI{display:none;position:fixed;inset:0;pointer-events:none;z-index:8}
@media (pointer:coarse){
  #touchUI{display:block}
  #hotbar{transform:translateX(-50%) scale(.72);bottom:4px}
  #hpBar{bottom:62px;transform:translateX(-50%) scale(.85)}
}
#joyZone{position:absolute;left:16px;bottom:80px;width:130px;height:130px;pointer-events:auto;touch-action:none}
#joyBase{width:100%;height:100%;border-radius:50%;background:rgba(0,0,0,.3);
  border:3px solid rgba(255,255,255,.4);position:relative}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin-left:-27px;margin-top:-27px;
  background:#889878;border:3px solid #1a1f14;border-radius:50%;
  box-shadow:inset 0 0 0 2px #c8d8b8,3px 3px 0 rgba(0,0,0,.6)}
.tb{position:absolute;border-radius:50%;background:rgba(180,80,60,.9);border:3px solid #1a1f14;
  box-shadow:inset 0 0 0 2px #e89888,3px 3px 0 rgba(0,0,0,.6);color:#fff;font-size:24px;font-weight:900;
  text-shadow:2px 2px 0 #1a1f14;pointer-events:auto;touch-action:none;padding:0;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.tb.jump{background:rgba(80,140,200,.9);box-shadow:inset 0 0 0 2px #88c8e8,3px 3px 0 rgba(0,0,0,.6)}
.tb.pressed{background:#d8a898;border-color:#fff;box-shadow:none;transform:translate(2px,2px)}
.tb.jump.pressed{background:#88c8e8}
#btnAttack{right:16px;bottom:16px;width:72px;height:72px;font-size:30px}
#btnJump{right:96px;bottom:16px;width:64px;height:64px;font-size:28px}
#settingsBtn{position:fixed;top:8px;right:8px;z-index:13;width:36px;height:36px;
  background:rgba(20,24,16,.9);border:2px solid #0a0d08;border-radius:6px;color:#e8f0d8;font-size:16px;
  display:none;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.5);touch-action:manipulation}
#settingsBtn.show{display:flex}
#settingsBtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
#rotate{display:none;position:fixed;inset:0;background:#0a0d08;color:#e8f0d8;z-index:200;
  align-items:center;justify-content:center;text-align:center;padding:30px;font-size:16px;letter-spacing:2px}
@media (orientation:portrait) and (max-width:900px){ #rotate{display:flex} }

/* Frame Tuner */
#tuner{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:200;
  display:none;align-items:center;justify-content:center;padding:14px;overflow:auto}
#tuner.show{display:flex}
.tuner-box{background:#2a3328;border:3px solid #0a0d08;padding:16px;border-radius:6px;
  max-width:96vw;max-height:96vh;overflow:auto;
  box-shadow:inset 0 0 0 2px #5a6850,0 8px 0 #000;display:flex;flex-direction:column;gap:10px}
.tuner-box h3{font-family:Consolas,monospace;color:#88ff60;font-size:13px;
  letter-spacing:2px;margin:0}
.tuner-box .info{font-family:Consolas,monospace;font-size:11px;color:#a8b498;line-height:1.6}
#tunerCanvas{border:2px solid #0a0d08;background:#1a1a1a;image-rendering:pixelated;
  display:block;max-width:100%;cursor:crosshair}
.tuner-controls{display:flex;flex-direction:column;gap:6px}
.tuner-controls .setting-row{margin:2px 0}
.tuner-controls label{flex:0 0 110px;font-size:11px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="coords">XYZ: <b>0 0</b></div>
<div id="time">☀ 06:00 · Ngày 1</div>
<div id="netInfo">
  <div>🏠 <b id="netCode">-----</b></div>
  <div>👥 <span id="netCount">1</span> người chơi</div>
</div>
<div id="hpBar">
  <span class="heartIcon">❤️</span>
  <div id="hpFill"><div id="hpFillInner"></div></div>
  <span id="hpText">20/20</span>
</div>
<div id="hotbar"></div>
<div id="touchUI">
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <button class="tb" id="btnAttack">⚔</button>
  <button class="tb jump" id="btnJump">⤒</button>
</div>
<button id="settingsBtn" onclick="Game.showSettings()" title="Cài đặt (M)">⚙</button>

<!-- Frame Tuner -->
<div id="tuner">
  <div class="tuner-box">
    <h3>🔧 TINH CHỈNH FRAME SPRITE</h3>
    <div class="info" id="tunerInfo">Đang tải...</div>
    <canvas id="tunerCanvas" width="900" height="500"></canvas>
    <div class="tuner-controls">
      <div class="setting-row">
        <label>Frame W</label>
        <input type="range" id="tuneFW" min="60" max="400" value="192">
        <span class="val" id="valFW">192</span>
      </div>
      <div class="setting-row">
        <label>Frame H</label>
        <input type="range" id="tuneFH" min="60" max="400" value="205">
        <span class="val" id="valFH">205</span>
      </div>
      <div class="setting-row">
        <label>Offset X</label>
        <input type="range" id="tuneOX" min="-100" max="100" value="0">
        <span class="val" id="valOX">0</span>
      </div>
      <div class="setting-row">
        <label>Offset Y</label>
        <input type="range" id="tuneOY" min="-100" max="100" value="0">
        <span class="val" id="valOY">0</span>
      </div>
    </div>
    <button class="mbtn primary" onclick="FrameTuner.save()">💾 Lưu cấu hình</button>
    <button class="mbtn" onclick="FrameTuner.reset()">↺ Reset về mặc định</button>
    <button class="mbtn back" onclick="FrameTuner.close()">Đóng</button>
  </div>
</div>

<div id="toast"></div>
<div id="pause" class="modal hidden">
  <div class="pause-panel">
    <h2>TẠM DỪNG</h2>
    <button class="mbtn primary" onclick="Game.resumeGame()">▶ Tiếp tục</button>
    <button class="mbtn" onclick="Game.pauseSettings()">⚙ Cài đặt</button>
    <button class="mbtn danger" onclick="Game.quitToMenu()">🏠 Về menu chính</button>
  </div>
</div>
<div id="menu" class="modal">
  <div class="menu-panel">
    <div class="logo">DRAGON HUNTER</div>
    <div class="logo-sub">Thợ Săn Rồng · PvP</div>
    <div id="menuMain" class="menu-page">
      <button class="mbtn primary" onclick="Game.startSingleplayer()">🎮 Chơi đơn</button>
      <button class="mbtn primary" onclick="Game.showMP()">🌐 Chơi mạng (PvP)</button>
      <button class="mbtn" onclick="Game.showSettings()">⚙ Cài đặt</button>
      <button class="mbtn" onclick="FrameTuner.open()">🔧 Tinh chỉnh frame sprite</button>
      <div style="font-size:10px;color:#586850;margin-top:14px;font-family:Consolas,monospace;line-height:1.6">
        <b style="color:#88ff60">WASD</b> di chuyển · <b style="color:#88ff60">Space</b> nhảy<br>
        <b style="color:#88ff60">Chuột trái</b> tấn công · <b style="color:#88ff60">1-4</b> chọn kiếm
      </div>
    </div>
    <div id="menuMP" class="menu-page hidden">
      <h3>CHIẾN TRƯỜNG PvP</h3>
      <button class="mbtn" onclick="Game.hostRoom()">🏠 Tạo phòng</button>
      <button class="mbtn" onclick="Game.showJoin()">🔗 Vào phòng</button>
      <div id="hostPanel" class="hidden" style="margin-top:10px">
        <label>TÊN CỦA BẠN</label>
        <input type="text" id="hostName" maxlength="12" placeholder="Hunter" value="Hunter">
        <div id="roomCodeDisplay" class="code-display hidden"></div>
        <div class="status-text" id="hostStatus"></div>
      </div>
      <div id="joinPanel" class="hidden" style="margin-top:10px">
        <label>TÊN CỦA BẠN</label>
        <input type="text" id="joinName" maxlength="12" placeholder="Hunter" value="Hunter">
        <label>MÃ PHÒNG</label>
        <input type="text" id="joinCode" maxlength="6" placeholder="ABC123"
          style="text-transform:uppercase;font-size:18px;letter-spacing:4px">
        <button class="mbtn primary" onclick="Game.joinRoom()" style="margin-top:10px">Kết nối</button>
        <div class="status-text" id="joinStatus"></div>
      </div>
      <button class="mbtn back" onclick="Game.backMain()">← Quay lại</button>
    </div>
    <div id="menuSettings" class="menu-page hidden">
      <h3>CÀI ĐẶT</h3>
      <div class="setting-row"><label>🔊 Tổng</label>
        <input type="range" id="setMaster" min="0" max="100" value="70"><span class="val" id="valMaster">70</span></div>
      <div class="setting-row"><label>🎵 Nhạc</label>
        <input type="range" id="setMusic" min="0" max="100" value="35"><span class="val" id="valMusic">35</span></div>
      <div class="setting-row"><label>🔔 SFX</label>
        <input type="range" id="setSfx" min="0" max="100" value="80"><span class="val" id="valSfx">80</span></div>
      <button class="mbtn back" onclick="Game.backMain()">← Quay lại</button>
    </div>
  </div>
</div>
<div id="rotate"><div>↔<br><br><b>Xoay ngang điện thoại</b><br>để chơi game</div></div>

<script>
"use strict";
window.addEventListener('error', e => console.error('[ERROR]', e.error || e.message));
window.addEventListener('unhandledrejection', e => console.error('[PROMISE]', e.reason));

const BACKEND = {
  host: 'game-sinhton.onrender.com', port: 443,
  peerPath: '/peerjs/myapp', secure: true
};
const buzz = ms => { if (navigator.vibrate) try{ navigator.vibrate(ms||6); }catch(e){} };

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random, SEED = 0;
function initRNG(seed){ SEED = seed>>>0; rng = mulberry32(SEED); }

/* ============================================================
   SPRITE CONFIG — có thể chỉnh qua FrameTuner
   ============================================================ */
const DEFAULT_SPRITE = {
  src: 'assets/player.png',
  frameW: 192,
  frameH: 205,
  offsetX: 0,
  offsetY: 0,
  animations: {
    idle:   { row: 0, frames: 7, fps: 5,  loop: true  },
    run:    { row: 1, frames: 8, fps: 10, loop: true  },
    jump:   { row: 2, frames: 8, fps: 12, loop: false },
    attack: { row: 3, frames: 8, fps: 14, loop: false },
    hurt:   { row: 4, frames: 8, fps: 12, loop: false }
  }
};

/* Load config từ localStorage (nếu user đã lưu) */
let SPRITE = JSON.parse(JSON.stringify(DEFAULT_SPRITE));
try {
  const saved = localStorage.getItem('spriteConfig_v1');
  if (saved) {
    const cfg = JSON.parse(saved);
    SPRITE.frameW = cfg.frameW || SPRITE.frameW;
    SPRITE.frameH = cfg.frameH || SPRITE.frameH;
    SPRITE.offsetX = cfg.offsetX || 0;
    SPRITE.offsetY = cfg.offsetY || 0;
    console.log('✓ Loaded custom sprite config from localStorage');
  }
} catch(e){}

const ATTACK_DURATION = 8 / 14;
const HURT_DURATION   = 8 / 12;
const JUMP_DURATION   = 8 / 12;

const DEST_HEIGHT = 100;
const FOOT_OFFSET = 14;

const playerSprite = new Image();
let spriteLoaded = false;

playerSprite.onload = () => {
  spriteLoaded = true;
  console.log('══════════════════════════════════════');
  console.log('✓ SPRITE LOADED');
  console.log('  Image   :', playerSprite.width + '×' + playerSprite.height);
  console.log('  FrameW  :', SPRITE.frameW);
  console.log('  FrameH  :', SPRITE.frameH);
  console.log('  Offset  :', SPRITE.offsetX + ', ' + SPRITE.offsetY);
  console.log('  Cols fit:', Math.floor(playerSprite.width / SPRITE.frameW));
  console.log('  Rows fit:', Math.floor(playerSprite.height / SPRITE.frameH));
  console.log('══════════════════════════════════════');

  /* Cảnh báo nếu frame không khớp */
  const colsFit = playerSprite.width / SPRITE.frameW;
  const rowsFit = playerSprite.height / SPRITE.frameH;
  if (Math.abs(colsFit - Math.round(colsFit)) > 0.01){
    console.warn('⚠ Ảnh width không chia hết cho FrameW —', colsFit.toFixed(2), 'cột');
  }
  if (Math.abs(rowsFit - Math.round(rowsFit)) > 0.01){
    console.warn('⚠ Ảnh height không chia hết cho FrameH —', rowsFit.toFixed(2), 'hàng');
  }
};
playerSprite.onerror = () => {
  spriteLoaded = false;
  console.error('✗ Không tải được sprite:', SPRITE.src);
};
playerSprite.src = SPRITE.src;

/* ============================================================
   FRAME TUNER — UI chỉnh frame
   ============================================================ */
const FrameTuner = {
  open(){
    document.getElementById('tuner').classList.add('show');
    document.getElementById('tuneFW').value = SPRITE.frameW;
    document.getElementById('tuneFH').value = SPRITE.frameH;
    document.getElementById('tuneOX').value = SPRITE.offsetX;
    document.getElementById('tuneOY').value = SPRITE.offsetY;
    this.update();
  },
  close(){
    document.getElementById('tuner').classList.remove('show');
  },
  update(){
    const fw = +document.getElementById('tuneFW').value;
    const fh = +document.getElementById('tuneFH').value;
    const ox = +document.getElementById('tuneOX').value;
    const oy = +document.getElementById('tuneOY').value;
    document.getElementById('valFW').textContent = fw;
    document.getElementById('valFH').textContent = fh;
    document.getElementById('valOX').textContent = ox;
    document.getElementById('valOY').textContent = oy;

    /* Live preview */
    SPRITE.frameW = fw;
    SPRITE.frameH = fh;
    SPRITE.offsetX = ox;
    SPRITE.offsetY = oy;

    this.render();
  },
  render(){
    if (!spriteLoaded) return;
    const cnv = document.getElementById('tunerCanvas');
    const tctx = cnv.getContext('2d');

    /* Fit ảnh vào canvas */
    const maxW = 880, maxH = 480;
    const scale = Math.min(maxW / playerSprite.width, maxH / playerSprite.height);
    const w = Math.round(playerSprite.width * scale);
    const h = Math.round(playerSprite.height * scale);

    cnv.width = w;
    cnv.height = h;
    tctx.imageSmoothingEnabled = false;
    tctx.clearRect(0, 0, w, h);
    tctx.drawImage(playerSprite, 0, 0, w, h);

    /* Vẽ lưới frame */
    const cols = SPRITE.animations.idle.frames > 0
      ? Math.ceil(playerSprite.width / SPRITE.frameW)
      : 8;
    const rows = Math.ceil(playerSprite.height / SPRITE.frameH);

    tctx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
    tctx.lineWidth = 1;
    for (let c = 0; c <= cols; c++){
      const x = Math.round((c * SPRITE.frameW + SPRITE.offsetX) * scale) + 0.5;
      if (x < 0 || x > w) continue;
      tctx.beginPath(); tctx.moveTo(x, 0); tctx.lineTo(x, h); tctx.stroke();
    }
    for (let r = 0; r <= rows; r++){
      const y = Math.round((r * SPRITE.frameH + SPRITE.offsetY) * scale) + 0.5;
      if (y < 0 || y > h) continue;
      tctx.beginPath(); tctx.moveTo(0, y); tctx.lineTo(w, y); tctx.stroke();
    }

    /* Highlight frame đầu của mỗi animation */
    const anims = SPRITE.animations;
    const colors = {
      idle:'#88ff60', run:'#40c0ff', jump:'#ffcc40',
      attack:'#ff4060', hurt:'#c040ff'
    };
    for (const name in anims){
      const a = anims[name];
      const cx = Math.round((0 + SPRITE.offsetX + SPRITE.frameW/2) * scale);
      const cy = Math.round((a.row * SPRITE.frameH + SPRITE.offsetY + SPRITE.frameH/2) * scale);
      tctx.fillStyle = colors[name];
      tctx.beginPath(); tctx.arc(cx, cy, 6, 0, Math.PI*2); tctx.fill();
      tctx.fillStyle = '#fff';
      tctx.font = 'bold 11px Consolas, monospace';
      tctx.textAlign = 'center';
      tctx.fillText(name, cx + 30, cy + 4);
      tctx.textAlign = 'left';
    }

    /* Info */
    const colsFit = (playerSprite.width / SPRITE.frameW).toFixed(2);
    const rowsFit = (playerSprite.height / SPRITE.frameH).toFixed(2);
    const info = document.getElementById('tunerInfo');
    info.innerHTML =
      `Ảnh: <b>${playerSprite.width}×${playerSprite.height}px</b><br>` +
      `FrameW=<b>${SPRITE.frameW}</b> → ${colsFit} cột (cần nguyên)<br>` +
      `FrameH=<b>${SPRITE.frameH}</b> → ${rowsFit} hàng (cần nguyên)<br>` +
      `<span style="color:#ffcc40">⚠ Kéo slider cho tới khi "cột" và "hàng" đều là số nguyên (8.00, 5.00).</span><br>` +
      `<span style="color:#88ff60">✓ Ảnh đúng: FrameW=${Math.round(playerSprite.width/8)}, FrameH=${Math.round(playerSprite.height/5)}</span>`;
  },
  save(){
    localStorage.setItem('spriteConfig_v1', JSON.stringify({
      frameW: SPRITE.frameW,
      frameH: SPRITE.frameH,
      offsetX: SPRITE.offsetX,
      offsetY: SPRITE.offsetY
    }));
    toast('💾 Đã lưu cấu hình frame');
    this.close();
  },
  reset(){
    SPRITE.frameW = DEFAULT_SPRITE.frameW;
    SPRITE.frameH = DEFAULT_SPRITE.frameH;
    SPRITE.offsetX = 0;
    SPRITE.offsetY = 0;
    localStorage.removeItem('spriteConfig_v1');
    this.open();
    toast('↺ Reset về mặc định');
  }
};

/* ============================================================
   AUDIO
   ============================================================ */
const Audio2D = (() => {
  let ctx = null, enabled = true;
  let masterGain, musicGain, sfxGain, noiseBuf = null;
  let musicPlaying = false, currentDayPhase = -1;
  function init(){
    if (ctx){ if (ctx.state==='suspended') ctx.resume(); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain(); musicGain = ctx.createGain(); sfxGain = ctx.createGain();
      musicGain.connect(masterGain); sfxGain.connect(masterGain);
      masterGain.connect(ctx.destination);
      masterGain.gain.value = 0.7; musicGain.gain.value = 0.35; sfxGain.gain.value = 0.8;
      const len = Math.floor(ctx.sampleRate * 2);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    } catch(e){ enabled = false; }
  }
  function noise(dur, ftype, freq, gain, q){
    if (!enabled) return; init(); if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = ftype||'lowpass';
    f.frequency.value = freq||1000; if (q) f.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain||0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start(t); src.stop(t+dur+0.02);
  }
  function tone(freq, dur, gain, type, freqEnd){
    if (!enabled) return; init(); if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type||'sine';
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd!==undefined) o.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd), t+dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain||0.3, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(sfxGain);
    o.start(t); o.stop(t+dur+0.02);
  }
  function startMusic(){
    if (!enabled) return; init(); if (!ctx || musicPlaying) return;
    musicPlaying = true; playMusicNotes();
  }
  function playMusicNotes(){
    if (!musicPlaying || !enabled || !ctx) return;
    const isNight = currentDayPhase === 1;
    const dayScale = [261.63,293.66,329.63,392.00,440.00,523.25];
    const nightScale = [220.00,261.63,293.66,329.63,392.00,440.00];
    const scale = isNight ? nightScale : dayScale;
    const root = isNight ? 110 : 130.81;
    const t = ctx.currentTime;
    const o1 = ctx.createOscillator(); o1.type='triangle'; o1.frequency.value = root;
    const g1 = ctx.createGain();
    g1.gain.setValueAtTime(0.0, t);
    g1.gain.linearRampToValueAtTime(0.06, t+1.5);
    g1.gain.linearRampToValueAtTime(0.0, t+5);
    o1.connect(g1); g1.connect(musicGain);
    o1.start(t); o1.stop(t+5.2);
    const n = 2 + Math.floor(Math.random()*3);
    for (let i=0;i<n;i++){
      const delay = Math.random()*3;
      const freq = scale[Math.floor(Math.random()*scale.length)];
      const dur = 1.2 + Math.random()*1.8;
      setTimeout(() => {
        if (!musicPlaying || !enabled || !ctx) return;
        const tt = ctx.currentTime;
        const o = ctx.createOscillator();
        o.type = currentDayPhase === 1 ? 'sine' : 'triangle';
        o.frequency.value = freq;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0, tt);
        g.gain.linearRampToValueAtTime(0.045, tt+0.15);
        g.gain.exponentialRampToValueAtTime(0.0001, tt+dur);
        o.connect(g); g.connect(musicGain);
        o.start(tt); o.stop(tt+dur+0.05);
      }, delay*1000);
    }
    setTimeout(() => playMusicNotes(), 4500 + Math.random()*2000);
  }
  function setNight(isNight){
    const phase = isNight ? 1 : 0;
    if (phase === currentDayPhase) return;
    currentDayPhase = phase;
  }
  const sfx = {
    step(){ noise(0.05,'bandpass',400+Math.random()*200,0.08,1.5); },
    swordHit(){ noise(0.08,'bandpass',1800,0.20,3); tone(900,0.08,0.15,'square',400); },
    swordSwing(){ noise(0.10,'highpass',2400,0.10,2); },
    jump(){ tone(440,0.10,0.10,'sine',800); },
    hurt(){ tone(280,0.14,0.22,'sawtooth',140); noise(0.10,'lowpass',500,0.12); },
    kill(){ tone(180,0.4,0.3,'sawtooth',60); setTimeout(()=>tone(140,0.3,0.2,'square',50),100); },
    click(){ tone(1200,0.02,0.08,'square'); }
  };
  return {
    init, setNight, startMusic,
    setMasterVolume: v => { init(); if (masterGain) masterGain.gain.value = Math.max(0,Math.min(1,v)); },
    setMusicVolume: v => { init(); if (musicGain) musicGain.gain.value = Math.max(0,Math.min(1,v)); },
    setSfxVolume: v => { init(); if (sfxGain) sfxGain.gain.value = Math.max(0,Math.min(1,v)); },
    sfx
  };
})();

const joy = { id:null, x:0, y:0, cx:0, cy:0 };

  joy.id = e.pointerId;
  const r = joyZone.getBoundingClientRect();
  joy.cx = r.left + r.width/2; joy.cy = r.top + r.height/2;
  moveJoy(e.clientX, e.clientY);
  try { joyZone.setPointerCapture(e.pointerId); } catch(err){}
});
function moveJoy(cx, cy){
  let dx = cx - joy.cx, dy = cy - joy.cy;
  const d = Math.hypot(dx,dy), max = 52;
  if (d > max){ dx = dx/d*max; dy = dy/d*max; }
  joy.x = dx/max; joy.y = dy/max;
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
}
function endJoy(e){
  if (e.pointerId !== joy.id) return;
  joy.id = null; joy.x = 0; joy.y = 0;
  joyKnob.style.transform = 'translate(0,0)';
}
addEventListener('pointermove', e => {
  if (e.pointerId === joy.id){ e.preventDefault(); moveJoy(e.clientX, e.clientY); }
}, { passive:false });

function tryJump(){
  if (!gameStarted || paused) return;
  if (player.jumpT > 0) return;
  player.jumpT = JUMP_DURATION;
  Audio2D.sfx.jump();
}

let lastAttackT = 0;
function tryAttack(){
  if (!gameStarted || paused) return;
  const now = performance.now();
  if (now - lastAttackT < ATTACK_DURATION * 1000) return;
  lastAttackT = now;
  player.attackT = ATTACK_DURATION;
  Audio2D.sfx.swordSwing();

  if (!net.active) return;
  const wx = mouse.x + cam.x, wy = mouse.y + cam.y;
  const range = 72;
  let target = null, minD = range;
  for (const [id, p] of net.players){
    const d = Math.hypot(p.x - wx, p.y - wy);
    if (d < minD){ minD = d; target = { id, p }; }
  }
  if (target){
    const held = inv.hotbar[player.selected];
    const heldDef = held ? defOf(held.id) : null;
    const dmg = (heldDef && heldDef.tool === 'sword') ? (heldDef.dmg || 1) : 1;
    net.send({ t:'hit', target: target.id, from: net.myId, fromName: net.name, dmg });
    burstHitVisual(target.p.x, target.p.y);
    Audio2D.sfx.swordHit();
    toast(`⚔️ Đánh ${target.p.name} -${dmg} HP`);
  }
}
function burstHitVisual(x, y){
  for (let i=0;i<10;i++){
    const a = Math.random()*Math.PI*2;
    const s = 60 + Math.random()*100;
    G.particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 0.3 + Math.random()*0.2, maxLife: 0.5,
      color: Math.random() < 0.6 ? '#ff4040' : '#ffcc40',
      size: 2 + Math.random()*3
    });
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function updatePlayer(dt){
  let dx = 0, dy = 0;
  if (joy.id !== null && Math.hypot(joy.x, joy.y) > 0.15){ dx = joy.x; dy = joy.y; }
  else {
    if (keys['KeyA']||keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD']||keys['ArrowRight']) dx += 1;
    if (keys['KeyW']||keys['ArrowUp']) dy -= 1;
    if (keys['KeyS']||keys['ArrowDown']) dy += 1;
  }
  const mag = Math.hypot(dx, dy);
  if (mag > 1){ dx /= mag; dy /= mag; }
  /* Chỉ đổi facing khi có input thực sự, tránh lật qua lật lại */
  if (Math.abs(dx) > 0.3) player.facing = dx > 0 ? 1 : -1;

  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  const nr = player.radius;
  player.x = Math.max(nr, Math.min(WORLD_W*TILE - nr, player.x));
  player.y = Math.max(nr, Math.min(WORLD_H*TILE - nr, player.y));

  player.animT += dt;
  if (player.attackT > 0) player.attackT -= dt;
  if (player.hurtT > 0) player.hurtT -= dt;

  if (player.jumpT > 0){
    player.jumpT = Math.max(0, player.jumpT - dt);
    const prog = 1 - player.jumpT / JUMP_DURATION;
    player.jumpY = -Math.sin(prog * Math.PI) * 26;
  } else player.jumpY = 0;

  if (attackTouch && player.attackT <= 0) tryAttack();

  let target = 'idle';
  if (player.attackT > 0)     target = 'attack';
  else if (player.hurtT > 0)  target = 'hurt';
  else if (player.jumpT > 0)  target = 'jump';
  else if (mag > 0.1)         target = 'run';

  if (target !== player.currentAnim){
    player.currentAnim = target;
    player.animTime = 0;
  }
  player.animTime += dt;

  if (mag > 0.1){
    player._stepAcc += player.speed*dt;
    if (player._stepAcc > 26){ player._stepAcc = 0; Audio2D.sfx.step(); }
  } else player._stepAcc = 0;
}

function respawnPlayer(){
  player.hp = player.maxHp;
  toast('💀 Bạn đã bị hạ. Hồi sinh!');
  player.x = WORLD_W*TILE/2;
  player.y = WORLD_H*TILE/2;
  player.jumpT = 0; player.jumpY = 0;

  cam.x = player.x - VW/2; cam.y = player.y - VH/2;
  if (net.active) net.broadcastPos();
  updateHpBar();
}

const PEER_OPTS = {
  host: BACKEND.host, port: BACKEND.port, path: BACKEND.peerPath,
  secure: BACKEND.secure, debug: 0,
  config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]}
};
const net = {
  active: false, mode: null, peer: null, hostConn: null,
  clients: new Map(), myId: null, name: 'Hunter', roomCode: null,
  players: new Map(), onWorldReady: null,

  startHost(name){
    this.name = name || 'Host';
    this.mode = 'host';
    this.players.clear();
    const code = genRoomCode();
    this.roomCode = code;
    return new Promise((resolve, reject) => {
      try { this.peer = new Peer('dragonhunter-' + code, PEER_OPTS); }
      catch(e){ reject(e); return; }
      const timer = setTimeout(() => reject(new Error('Hết thời gian kết nối')), 20000);
      this.peer.on('open', id => {
        clearTimeout(timer);
        this.myId = id; this.active = true;
        this.peer.on('connection', conn => this._acceptClient(conn));
        resolve(code);
      });
      this.peer.on('error', e => { clearTimeout(timer); reject(e); });
    });
  },
  startClient(name, code){
    this.name = name || 'Hunter';
    this.mode = 'client';
    this.players.clear();
    this.roomCode = code;
    return new Promise((resolve, reject) => {
      try { this.peer = new Peer(PEER_OPTS); }
      catch(e){ reject(e); return; }
      const timer = setTimeout(() => reject(new Error('Hết thời gian kết nối')), 20000);
      this.peer.on('open', id => {
        this.myId = id;
        const conn = this.peer.connect('dragonhunter-' + code, { reliable: true });
        this.hostConn = conn;
        conn.on('open', () => { clearTimeout(timer); this.active = true; resolve(); });
        conn.on('data', d => this._onData(d, conn));
        conn.on('close', () => { toast('❌ Mất kết nối tới host'); this.disconnect(); if (gameStarted) backToMenu(); });
        conn.on('error', e => { clearTimeout(timer); reject(e); });
      });
      this.peer.on('error', e => {
        clearTimeout(timer);
        if (String(e).includes('is taken')) reject(new Error('Không tìm thấy phòng'));
        else reject(e);
      });
    });
  },
  _acceptClient(conn){
    conn.on('open', () => {
      this.clients.set(conn.peer, conn);
      try {
        conn.send({ t:'world', seed: SEED, data: u8ToB64(world) });
        for (const [id, p] of this.players){
          conn.send({ t:'pos', id, name: p.name, x: p.x, y: p.y, facing: p.facing, hp: p.hp });
        }
        conn.send({ t:'pos', id: this.myId, name: this.name,
                    x: player.x, y: player.y, facing: player.facing, hp: player.hp });
      } catch(e){}
      toast('⚔️ Đối thủ mới vào phòng!');
      updateNetHud();
    });
    conn.on('data', d => this._onData(d, conn));
    conn.on('close', () => {
      this.clients.delete(conn.peer); this.players.delete(conn.peer);
      toast('👋 Đối thủ rời đi'); updateNetHud();
    });
  },
  _onData(d, conn){
    if (d.t === 'world'){
      initRNG(d.seed);
      world.set(b64ToU8(d.data));
      resetPlayerPosition();
      if (this.onWorldReady) this.onWorldReady();
    } else if (d.t === 'pos'){
      this.players.set(d.id, {
        name: d.name, x: d.x, y: d.y, facing: d.facing, hp: d.hp,
        lastSeen: performance.now(), animT: 0
      });
      if (this.mode === 'host' && conn){
        for (const [id, c] of this.clients){
          if (c === conn) continue;
          try { c.send(d); } catch(e){}
        }
      }
      updateNetHud();
    } else if (d.t === 'hit'){
      if (d.target === this.myId){
        player.hp = Math.max(0, player.hp - d.dmg);
        player.hurtT = HURT_DURATION;
        flashDamage(); Audio2D.sfx.hurt(); updateHpBar();
        toast(`⚔️ ${d.fromName} gây ${d.dmg} sát thương!`);
        if (player.hp <= 0){ Audio2D.sfx.kill(); respawnPlayer(); }
        else this.broadcastPos();
      }
      if (this.mode === 'host' && conn){
        for (const [id, c] of this.clients){
          if (c === conn) continue;
          try { c.send(d); } catch(e){}
        }
      }
    }
  },
  broadcastPos(){
    if (!this.active) return;
    this.send({ t:'pos', id: this.myId, name: this.name,
                x: player.x, y: player.y, facing: player.facing, hp: player.hp });
  },
  send(msg){
    if (!this.active) return;
    try {
      if (this.mode === 'host'){ for (const c of this.clients.values()) c.send(msg); }
      else if (this.hostConn){ this.hostConn.send(msg); }
    } catch(e){}
  },
  disconnect(){
    this.active = false;
    this.players.clear();
    this.clients.clear();
    this.hostConn = null;
    if (this.peer){ try { this.peer.destroy(); } catch(e){} }
    this.peer = null; this.myId = null;
    updateNetHud();
  }
};
function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function u8ToB64(u8){
  let s = '';
  const chunk = 0x8000;
  for (let i=0;i<u8.length;i+=chunk) s += String.fromCharCode.apply(null, u8.subarray(i, i+chunk));
  return btoa(s);
}
function b64ToU8(s){
  const bin = atob(s);
  const u8 = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
let netSyncTimer = null;
function startNetSync(){
  if (netSyncTimer) return;
  netSyncTimer = setInterval(() => {
    if (net.active && gameStarted && !paused) net.broadcastPos();
    const now = performance.now();
    for (const [id, p] of net.players) if (now - p.lastSeen > 5000) net.players.delete(id);
    updateNetHud();
  }, 100);
}
function updateNetHud(){
  const el = document.getElementById('netInfo');
  if (!net.active){ el.classList.remove('show'); return; }
  el.classList.add('show');
  document.getElementById('netCode').textContent = net.roomCode || '-----';
  document.getElementById('netCount').textContent = 1 + net.players.size;
}

/* ============================================================
   RENDER
   ============================================================ */
function drawTile(x, y, id, sx, sy){
  const def = TILES[id];
  if (!def) return;
  ctx.fillStyle = def.colors[0]; ctx.fillRect(sx, sy, TILE, TILE);
  const h = (x*73856093 ^ y*19349663) >>> 0;
  ctx.fillStyle = def.colors[2];
  for (let i=0;i<3;i++){
    const hh = (h >> (i*5)) & 0xFF;
    ctx.fillRect(sx + 3 + (hh % (TILE-8)), sy + 4 + ((hh >> 4) % (TILE-10)), 3, 3);
  }
}
function getNightFactor(){
  const t = worldTime * Math.PI * 2;
  return (1 - Math.cos(t)) / 2;
}

function drawPlayer(){
  const sx = player.x - cam.x;
  const syGround = player.y - cam.y;
  const sySprite = syGround + player.jumpY;

  if (!spriteLoaded){
    drawFallbackBody(sx, sySprite, player.animT, player.currentAnim, player.facing, LOCAL_COLORS);
    return;
  }

  /* Shadow */
  const shadowScale = 1 - Math.abs(player.jumpY) / 60;
  ctx.fillStyle = `rgba(0,0,0,${0.35 * shadowScale})`;
  ctx.beginPath();
  ctx.ellipse(sx, syGround + FOOT_OFFSET, 14 * shadowScale, 4 * shadowScale, 0, 0, Math.PI*2);
  ctx.fill();

  drawSpriteFrame(player.currentAnim, player.animTime, sx, sySprite, player.facing);
}

function drawSpriteFrame(animName, animTime, sx, sy, facing){
  const anim = SPRITE.animations[animName];
  if (!anim) return;

  const rawIdx = Math.floor(animTime * anim.fps);
  let localIdx;
  if (anim.loop){
    localIdx = ((rawIdx % anim.frames) + anim.frames) % anim.frames;
  } else {
    localIdx = Math.max(0, Math.min(anim.frames - 1, rawIdx));
  }

  /* Cắt frame với offset tinh chỉnh */
  const srcX = Math.round(localIdx * SPRITE.frameW + SPRITE.offsetX);
  const srcY = Math.round(anim.row * SPRITE.frameH + SPRITE.offsetY);
  const srcW = Math.round(SPRITE.frameW);
  const srcH = Math.round(SPRITE.frameH);

  const DEST_H = DEST_HEIGHT;
  const DEST_W = Math.round(DEST_H * (SPRITE.frameW / SPRITE.frameH));
  const drawX = Math.round(sx - DEST_W / 2);
  const drawY = Math.round(sy + FOOT_OFFSET - DEST_H);

  ctx.save();
  if (facing < 0){
    ctx.translate(sx, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(playerSprite, srcX, srcY, srcW, srcH, -DEST_W/2, drawY, DEST_W, DEST_H);
  } else {
    ctx.drawImage(playerSprite, srcX, srcY, srcW, srcH, drawX, drawY, DEST_W, DEST_H);
  }
  ctx.restore();
}

const LOCAL_COLORS = { legs:'#2a3a5a', shoes:'#1a1a1a', body:'#3a5a9a', bodyShade:'#2a4a7a', skin:'#f0c8a0', hair:'#3a2010' };
function drawFallbackBody(sx, sy, animT, animName, facing, colors){
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(sx, sy+14, 12, 4, 0, 0, Math.PI*2); ctx.fill();
  const isRun = animName === 'run';
  const bounce = isRun ? Math.sin(animT*12)*1.5 : Math.sin(animT*3)*0.6;
  const legSwing = isRun ? Math.sin(animT*12)*3 : 0;
  ctx.fillStyle = colors.legs;
  ctx.fillRect(sx-6+legSwing, sy+2, 4, 10-bounce);
  ctx.fillRect(sx+2-legSwing, sy+2, 4, 10-bounce);
  ctx.fillStyle = colors.shoes;
  ctx.fillRect(sx-6+legSwing, sy+11, 4, 3);
  ctx.fillRect(sx+2-legSwing, sy+11, 4, 3);
  ctx.fillStyle = colors.body;
  ctx.fillRect(sx-8, sy-14+bounce, 16, 18);
  ctx.fillStyle = colors.bodyShade;
  ctx.fillRect(sx-8, sy-4+bounce, 16, 3);
  ctx.fillStyle = colors.body;
  const armSwing = isRun ? Math.sin(animT*12+Math.PI)*3 : 0;
  ctx.fillRect(sx-11, sy-12+bounce+armSwing, 3, 12);
  ctx.fillRect(sx+8, sy-12+bounce-armSwing, 3, 12);
  ctx.fillStyle = colors.skin;
  ctx.fillRect(sx-11, sy+armSwing+bounce, 3, 3);
  ctx.fillRect(sx+8, sy-armSwing+bounce, 3, 3);
  ctx.fillRect(sx-7, sy-26+bounce, 14, 12);
  ctx.fillStyle = colors.hair;
  ctx.fillRect(sx-7, sy-26+bounce, 14, 4);
  ctx.fillRect(sx-7, sy-26+bounce, 3, 8);
  ctx.fillRect(sx+4, sy-26+bounce, 3, 8);
  ctx.fillStyle = '#1a1a1a';
  if (facing > 0){
    ctx.fillRect(sx+2, sy-22+bounce, 2, 2);
    ctx.fillRect(sx+5, sy-22+bounce, 2, 2);
  } else {
    ctx.fillRect(sx-4, sy-22+bounce, 2, 2);
    ctx.fillRect(sx-7, sy-22+bounce, 2, 2);
  }
}

const REMOTE_PALETTE = [
  { legs:'#5a2a3a', shoes:'#2a1020', body:'#d04a5a', bodyShade:'#a02a3a', skin:'#f0c8a0', hair:'#2a1010' },
  { legs:'#2a3a5a', shoes:'#1a1a3a', body:'#4a6ad0', bodyShade:'#2a4aa0', skin:'#f0c8a0', hair:'#202010' },
  { legs:'#3a5a2a', shoes:'#1a3a10', body:'#6ad04a', bodyShade:'#4aa02a', skin:'#f0c8a0', hair:'#302010' },
  { legs:'#5a4a2a', shoes:'#3a2a10', body:'#d0b04a', bodyShade:'#a0902a', skin:'#f0c8a0', hair:'#101010' },
  { legs:'#4a2a5a', shoes:'#2a103a', body:'#b04ad0', bodyShade:'#802aa0', skin:'#f0c8a0', hair:'#202020' }
];
function hashCode(s){ let h = 0; for (let i=0;i<s.length;i++) h = ((h<<5) - h) + s.charCodeAt(i) | 0; return h; }
function drawRemotePlayer(p){
  const sx = p.x - cam.x, sy = p.y - cam.y;
  if (sx < -80 || sx > VW+80 || sy < -80 || sy > VH+80) return;
  const pal = REMOTE_PALETTE[Math.abs(hashCode(p.name)) % REMOTE_PALETTE.length];
  p.animT = (p.animT || 0) + 0.016;
  drawFallbackBody(sx, sy, p.animT, 'idle', p.facing, pal);
  ctx.font = 'bold 10px Consolas, monospace';
  ctx.textAlign = 'center';
  const text = p.name;
  const w = ctx.measureText(text).width + 8;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(sx - w/2, sy - 44, w, 13);
  ctx.fillStyle = '#88ffd8';
  ctx.fillText(text, sx, sy - 34);
  const hpPct = Math.max(0, Math.min(1, (p.hp ?? 20) / 20));
  const bw = 26;
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(sx - bw/2 - 1, sy - 30, bw + 2, 5);
  ctx.fillStyle = hpPct > 0.5 ? '#4ade4a' : hpPct > 0.25 ? '#ffcc40' : '#e8503a';
  ctx.fillRect(sx - bw/2, sy - 29, bw * hpPct, 3);
  ctx.textAlign = 'left';
}

function render(){
  const nightFactor = getNightFactor();
  const cx0 = Math.max(0, Math.floor(cam.x / TILE));
  const cy0 = Math.max(0, Math.floor(cam.y / TILE));
  const cx1 = Math.min(WORLD_W, Math.ceil((cam.x + VW) / TILE));
  const cy1 = Math.min(WORLD_H, Math.ceil((cam.y + VH) / TILE));
  ctx.fillStyle = nightFactor > 0.6 ? '#0a0a14' : '#0f180f';
  ctx.fillRect(0, 0, VW, VH);
  for (let y=cy0; y<cy1; y++) for (let x=cx0; x<cx1; x++){
    drawTile(x, y, wGet(x, y), x*TILE - cam.x, y*TILE - cam.y);
  }

  const ents = [];
  for (const [id, p] of net.players) ents.push({ y: p.y, draw: () => drawRemotePlayer(p) });
  ents.push({ y: player.y, draw: () => drawPlayer() });
  ents.sort((a,b) => a.y - b.y);
  for (const e of ents) e.draw();

  for (const p of G.particles){
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - cam.x - p.size/2, p.y - cam.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  if (nightFactor > 0.05){
    ctx.fillStyle = `rgba(5, 8, 25, ${nightFactor * 0.75})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  document.getElementById('time').textContent =
    `${nightFactor > 0.6 ? '🌙' : '☀'} ${getClockString()} · Ngày ${dayCount}`;
  document.getElementById('coords').innerHTML =
    `XYZ: <b>${(player.x/TILE).toFixed(1)} ${(player.y/TILE).toFixed(1)}</b>`;
}

function updateCam(){
  const targetX = player.x - VW/2;
  const targetY = player.y - VH/2;
  cam.x += (targetX - cam.x) * 0.15;
  cam.y += (targetY - cam.y) * 0.15;
  cam.x = Math.max(0, Math.min(WORLD_W*TILE - VW, cam.x));
  cam.y = Math.max(0, Math.min(WORLD_H*TILE - VH, cam.y));
}

let worldTime = 0.25;
const DAY_DURATION = 300;
let dayCount = 1;
function updateDayNight(dt){
  worldTime += dt / DAY_DURATION;
  if (worldTime >= 1){ worldTime -= 1; dayCount++; }
  Audio2D.setNight(getNightFactor() > 0.6);
}
function getClockString(){
  const h = Math.floor(worldTime * 24);
  const m = Math.floor((worldTime * 24 - h) * 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

/* ============================================================
   HUD
   ============================================================ */
const hotbarEl = document.getElementById('hotbar');
function renderHotbar(){
  hotbarEl.innerHTML = '';
  for (let i=0;i<9;i++){
    const slot = document.createElement('div');
    slot.className = 'hslot' + (i === player.selected ? ' active' : '');
    const item = inv.hotbar[i];
    if (item){
      const def = defOf(item.id);
      const ic = document.createElement('div');
      ic.className = 'ic';
      ic.style.background = `linear-gradient(180deg, transparent 20%, ${def.color} 20%, ${def.color} 80%, transparent 80%)`;
      slot.appendChild(ic);
      const lbl = document.createElement('span');
      lbl.className = 'lbl'; lbl.textContent = (i+1);
      slot.appendChild(lbl);
    }
    slot.addEventListener('click', () => { player.selected = i; renderHotbar(); Audio2D.sfx.click(); });
    hotbarEl.appendChild(slot);
  }
}
function updateHpBar(){
  const pct = Math.max(0, player.hp / player.maxHp * 100);
  document.getElementById('hpFillInner').style.width = pct + '%';
  document.getElementById('hpText').textContent = Math.max(0, player.hp) + '/' + player.maxHp;
}
function flashDamage(){
  const bar = document.getElementById('hpBar');
  bar.style.boxShadow = '0 0 20px 4px #ff3030';
  setTimeout(() => { bar.style.boxShadow = '0 2px 0 rgba(0,0,0,.5)'; }, 200);
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ============================================================
   MENU
   ============================================================ */
window.Game = {
  startSingleplayer: () => startSingleplayer(),
  showMP: () => showMenuPage('mp'),
  showSettings: () => {
    if (gameStarted){ paused = true; document.getElementById('pause').classList.add('hidden'); }
    document.getElementById('menu').classList.remove('hidden');
    showMenuPage('settings');
  },
  backMain: () => {
    showMenuPage('main');
    if (gameStarted){ document.getElementById('menu').classList.add('hidden'); paused = false; }
  },
  hostRoom: () => hostRoom(),
  showJoin: () => showJoin(),
  joinRoom: () => joinRoom(),
  resumeGame: () => togglePause(),
  pauseSettings: () => {
    paused = false;
    document.getElementById('pause').classList.add('hidden');
    backToMenu();
    showMenuPage('settings');
  },
  quitToMenu: () => backToMenu(),
};

const menuPages = {
  main: document.getElementById('menuMain'),
  mp: document.getElementById('menuMP'),
  settings: document.getElementById('menuSettings')
};
function showMenuPage(name){
  if (!menuPages[name]) return;
  for (const k in menuPages) menuPages[k].classList.toggle('hidden', k !== name);
}

async function hostRoom(){
  document.getElementById('hostPanel').classList.remove('hidden');
  document.getElementById('joinPanel').classList.add('hidden');
  const name = document.getElementById('hostName').value.trim() || 'Host';
  const status = document.getElementById('hostStatus');
  const codeEl = document.getElementById('roomCodeDisplay');
  status.textContent = 'Đang kết nối...';
  try {
    const code = await net.startHost(name);
    codeEl.textContent = code;
    codeEl.classList.remove('hidden');
    status.textContent = '✓ Đang chờ đối thủ...';
    initRNG(Date.now() & 0x7fffffff);
    world.fill(0);
    generateWorld();
    resetPlayerPosition();
    initInv();
    setTimeout(() => startGame('host'), 800);
  } catch(e){
    status.textContent = '❌ Lỗi: ' + (e.message || e);
  }
}
function showJoin(){
  document.getElementById('hostPanel').classList.add('hidden');
  document.getElementById('joinPanel').classList.remove('hidden');
  setTimeout(() => document.getElementById('joinCode').focus(), 100);
}
async function joinRoom(){
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const name = document.getElementById('joinName').value.trim() || 'Hunter';
  const status = document.getElementById('joinStatus');
  if (code.length < 4){ status.textContent = '❌ Mã phòng không hợp lệ'; return; }
  status.textContent = 'Đang kết nối...';
  try {
    net.onWorldReady = () => { initInv(); startGame('client'); };
    await net.startClient(name, code);
    status.textContent = '✓ Đã kết nối, đang tải thế giới...';
  } catch(e){
    status.textContent = '❌ ' + (e.message || e);
  }
}

function bindSlider(id, valId, cb){
  const s = document.getElementById(id), v = document.getElementById(valId);
  if (!s) return;
  s.addEventListener('input', e => { v.textContent = e.target.value; cb(+e.target.value/100); });
  v.textContent = s.value;
  cb(+s.value/100);
}
bindSlider('setMaster', 'valMaster', v => Audio2D.setMasterVolume(v));
bindSlider('setMusic', 'valMusic', v => Audio2D.setMusicVolume(v));
bindSlider('setSfx', 'valSfx', v => Audio2D.setSfxVolume(v));

function toggleSettings(){
  if (gameStarted){
    paused = true;
    document.getElementById('pause').classList.add('hidden');
    document.getElementById('menu').classList.remove('hidden');
    showMenuPage('settings');
  } else showMenuPage('settings');
}

/* ============================================================
   GAME LIFECYCLE
   ============================================================ */
function startSingleplayer(){
  net.disconnect();
  initRNG(Date.now() & 0x7fffffff);
  world.fill(0);
  generateWorld();
  resetPlayerPosition();
  initInv();
  startGame('sp');
}
function startGame(mode){
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('settingsBtn').classList.add('show');
  gameStarted = true;
  paused = false;
  Audio2D.init();
  Audio2D.startMusic();
  renderHotbar();
  updateHpBar();
  startNetSync();
  updateNetHud();
  toast(mode === 'sp' ? '🎮 Chơi đơn' :
        mode === 'host' ? '🏠 Phòng: ' + net.roomCode :
        '⚔️ Đã vào phòng');
}
function togglePause(){
  if (!gameStarted) return;
  paused = !paused;
  document.getElementById('pause').classList.toggle('hidden', !paused);
  document.getElementById('settingsBtn').classList.toggle('show', !paused);
}
function backToMenu(){
  gameStarted = false; paused = false;
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('settingsBtn').classList.remove('show');
  net.disconnect();
  document.getElementById('menu').classList.remove('hidden');
  showMenuPage('main');
  if (netSyncTimer){ clearInterval(netSyncTimer); netSyncTimer = null; }
}
function resetPlayerPosition(){
  player.hp = player.maxHp;
  player.x = WORLD_W*TILE/2;
  player.y = WORLD_H*TILE/2;
  player.jumpT = 0; player.jumpY = 0;
  player.attackT = 0; player.hurtT = 0;
  player.currentAnim = 'idle'; player.animTime = 0;
  cam.x = player.x - VW/2; cam.y = player.y - VH/2;
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const G = { particles: [] };
let lastT = performance.now();
function loop(now){
  try {
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    if (gameStarted && !paused){
      updatePlayer(dt);
      updateDayNight(dt);
    }
    for (const p of G.particles){
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
    }
    G.particles = G.particles.filter(p => p.life > 0);
    if (gameStarted){
      updateCam();
      render();
      updateHpBar();
    }
  } catch(e){ console.error(e); }
  requestAnimationFrame(loop);
}

mouse.x = VW/2; mouse.y = VH/2;
showMenuPage('main');
requestAnimationFrame(loop);
