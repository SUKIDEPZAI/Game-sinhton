<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2D Craft — 22C</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#3a5a3a;font-family:Arial,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;position:fixed;inset:0}
  canvas{display:block;image-rendering:pixelated}
  #coords{position:fixed;top:8px;left:8px;color:#fff;font-size:11px;font-family:Consolas,monospace;
    background:rgba(0,0,0,.5);padding:4px 8px;border-radius:4px;z-index:5;pointer-events:none}
  #time{position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#ffd54a;font-size:12px;
    font-weight:bold;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:10px;z-index:5;pointer-events:none}
  #hearts{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);display:flex;gap:1px;
    filter:drop-shadow(1px 1px 0 #000);z-index:5}
  .heart{width:16px;height:16px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated}
  #hotbar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:2px;
    padding:3px;background:rgba(20,20,20,.85);border:2px solid #000;border-radius:4px;z-index:6}
  .hslot{width:48px;height:48px;background:#8b8b8b;border:2px solid #333;position:relative;
    display:flex;align-items:center;justify-content:center}
  .hslot.active{border-color:#fff;background:#a9a9a9}
  .hslot .ic{width:40px;height:40px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated}
  .hslot .cnt{position:absolute;right:2px;bottom:0;color:#fff;font-size:12px;font-weight:bold;
    text-shadow:1px 1px 0 #000;pointer-events:none}
  .hslot .dur{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:#000;overflow:hidden}
  .hslot .dur-fill{height:100%}
  #mineBar{position:fixed;left:50%;top:50%;transform:translate(-50%,22px);width:60px;height:6px;
    background:rgba(0,0,0,.7);border:1px solid #000;border-radius:2px;display:none;z-index:5;overflow:hidden}
  #mineBar.show{display:block}
  #mineFill{height:100%;width:0%;background:linear-gradient(90deg,#7dd6ff,#3aa9ff)}
  #gui{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;
    align-items:center;justify-content:center;padding:12px}
  #gui.open{display:flex}
  .window{background:#c6c6c6;border:2px solid #111;box-shadow:inset 0 0 0 2px #777,inset 0 0 0 4px #eee,0 6px 0 rgba(0,0,0,.5);
    padding:14px;max-width:96vw;max-height:96vh;overflow-y:auto;color:#222;font-family:Arial,sans-serif}
  .window h2{font-size:15px;margin-bottom:10px}
  .section-title{font-size:10px;color:#555;margin:8px 0 4px;font-weight:bold}
  .grid{display:grid;gap:2px}
  .grid.g9{grid-template-columns:repeat(9,42px)}
  .grid.g3{grid-template-columns:repeat(3,42px)}
  .grid.g2{grid-template-columns:repeat(2,42px)}
  .grid.g1{grid-template-columns:repeat(1,42px)}
  .slot{width:42px;height:42px;background:#8b8b8b;border:2px solid #333;position:relative;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .slot:hover{background:#a9a9a9}
  .slot .ic{width:34px;height:34px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated}
  .slot .cnt{position:absolute;right:2px;bottom:0;color:#fff;font-size:11px;font-weight:bold;
    text-shadow:1px 1px 0 #000;font-family:Arial}
  .slot .dur{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:#000;overflow:hidden}
  .slot .dur-fill{height:100%}
  .slot.result{background:#b8a878}
  #cursor{position:fixed;width:42px;height:42px;pointer-events:none;z-index:999;display:none;
    background-size:contain;background-repeat:no-repeat;image-rendering:pixelated;transform:translate(-50%,-50%)}
  #cursor .cnt{position:absolute;right:2px;bottom:0;color:#fff;font-size:12px;font-weight:bold;
    text-shadow:1px 1px 0 #000}
  #toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);
    color:#fff;padding:8px 16px;border-radius:4px;font-size:12px;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.show{opacity:1}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;
    align-items:center;justify-content:center;padding:16px;cursor:pointer}
  #overlay.hidden{display:none}
  .panel{background:#c6c6c6;border:3px solid #111;box-shadow:inset 0 0 0 2px #777,inset 0 0 0 4px #eee,0 8px 0 #000;
    padding:26px 32px;color:#222;text-align:center;max-width:520px}
  .panel h1{font-size:34px;letter-spacing:2px;text-shadow:2px 2px 0 #eee;margin-bottom:10px}
  .panel p{font-size:14px;color:#333;margin-bottom:12px}
  .panel kbd{background:#555;color:#fff;border:1px solid #222;padding:2px 6px;border-radius:3px;font-size:11px;margin:0 2px}
  /* Touch */
  #touchUI{display:none;position:fixed;inset:0;pointer-events:none;z-index:8}
  body.is-touch #touchUI{display:block}
  #joyZone{position:absolute;left:16px;bottom:80px;width:130px;height:130px;pointer-events:auto}
  #joyBase{width:100%;height:100%;border-radius:50%;background:rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.4);position:relative}
  #joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin-left:-27px;margin-top:-27px;
    background:#8b8b8b;border:3px solid #222;box-shadow:inset 0 0 0 2px #ddd,3px 3px 0 rgba(0,0,0,.6)}
  .tb{position:absolute;border-radius:50%;background:rgba(139,139,139,.85);border:3px solid #222;
    box-shadow:inset 0 0 0 2px #ddd,3px 3px 0 rgba(0,0,0,.6);
    color:#fff;font-size:22px;font-weight:900;text-shadow:2px 2px 0 #333;
    pointer-events:auto;touch-action:none;padding:0;line-height:1;
    display:flex;align-items:center;justify-content:center}
  .tb.pressed{background:#aaa;border-color:#fff;box-shadow:none}
  #btnUse{right:16px;bottom:16px;width:68px;height:68px;font-size:26px}
  #btnPlace{right:96px;bottom:16px;width:56px;height:56px;font-size:22px}
  #btnInv{right:96px;bottom:84px;width:56px;height:56px;font-size:20px}
  #btnFly{right:16px;bottom:92px;width:52px;height:52px;font-size:18px}
  body.is-touch #hotbar{transform:translateX(-50%) scale(.72);bottom:4px}
  body.is-touch #hearts{bottom:62px;transform:translateX(-50%) scale(.85)}
  #rotate{display:none;position:fixed;inset:0;background:#111;color:#fff;z-index:200;
    align-items:center;justify-content:center;text-align:center;padding:30px}
  @media (orientation:portrait) and (max-width:900px){ #rotate{display:flex} }
  @media (min-width:901px){ body:not(.is-touch) #touchUI{display:none !important} }
</style>

<body>
<canvas id="cv"></canvas>
<div id="coords">XYZ: <b>0 0</b></div>
<div id="time">☀ 06:00 · Ngày 1</div>
<div id="hearts"></div>
<div id="hotbar"></div>
<div id="mineBar"><div id="mineFill"></div></div>

  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <button class="tb" id="btnUse">⚔</button>
  <button class="tb" id="btnPlace">▣</button>

  <div class="panel">
    <h1>2D CRAFT</h1>
    <p id="ovtext">Đang tạo thế giới...</p>
    <p style="font-size:12px;color:#555" id="keys">
      <kbd>WASD</kbd> đi · <kbd>Space</kbd> nhảy · <kbd>F</kbd> bay<br>
      <kbd>Chuột trái</kbd> đào · <kbd>Chuột phải</kbd> đặt/tương tác<br>
      <kbd>1-9</kbd> hotbar · <kbd>E</kbd> túi · <kbd>M</kbd> âm thanh
    </p>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   2D CRAFT — Top-down Minecraft-style
   Kết hợp inventory/crafting/chest/furnace/audio/day-night từ code 3D
   ============================================================ */

/* ============ DEVICE ============ */
const isTouch = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 1 || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('is-touch');
const buzz = ms => { if (isTouch && navigator.vibrate) try { navigator.vibrate(ms||6); } catch(e){} };

/* ============ AUDIO ENGINE ============ */
const Audio2D = (() => {
  let ctx = null, master = null, enabled = true, noiseBuf = null;
  function init(){
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.35; master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    } catch(e){ enabled = false; }
  }
  function noise(dur, ftype, freq, gain, q){
    if (!enabled) return; init(); if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = ftype||'lowpass'; f.frequency.value = freq||1000;
    if (q) f.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain||0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t+dur+0.02);
  }
  function tone(freq, dur, gain, type, freqEnd){
    if (!enabled) return; init(); if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type||'sine';
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd !== undefined) o.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd), t+dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain||0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.02);
  }
  return {
    init,
    toggle(){ enabled = !enabled; if (master) master.gain.value = enabled ? 0.35 : 0; return enabled; },
    get enabled(){ return enabled; },
    step(mat){ noise(0.06, 'bandpass', mat==='grass'?450:mat==='sand'?900:mat==='wood'?500:220, 0.10, 1.5); },
    dig(mat){ noise(0.05, 'bandpass', mat==='stone'?250:mat==='wood'?550:mat==='sand'?700:400, 0.15, 2.5); },
    breakBlock(mat){
      const f = mat==='stone'?220:mat==='wood'?420:mat==='sand'?650:320;
      noise(0.16, 'lowpass', f+400, 0.28, 1);
      noise(0.12, 'bandpass', f, 0.20, 2);
      tone(f*0.5, 0.06, 0.05, 'triangle', f*0.3);
    },
    place(mat){ noise(0.06, 'lowpass', mat==='stone'?300:mat==='wood'?400:380, 0.18, 1); tone(180, 0.05, 0.06, 'triangle', 120); },
    jump(){ noise(0.05, 'highpass', 900, 0.06); },
    hurt(){ tone(280, 0.14, 0.22, 'sawtooth', 140); noise(0.10, 'lowpass', 500, 0.12); },
    pickup(){ tone(880, 0.06, 0.12, 'sine', 1320); setTimeout(()=>tone(1320,0.06,0.09,'sine'), 30); },
    click(){ tone(1200, 0.02, 0.08, 'square'); },
    craft(){ tone(660, 0.07, 0.15, 'square', 990); setTimeout(()=>tone(990,0.08,0.13,'square',1320), 60); },
    openChest(){ noise(0.10, 'bandpass', 600, 0.12, 4); setTimeout(()=>noise(0.09,'bandpass',800,0.09,4), 50); },
    closeChest(){ noise(0.08, 'bandpass', 500, 0.11, 3); }
  };
})();

/* ============ TILE REGISTRY ============ */
const TILE = 32;
// Tile IDs
const T = {
  AIR:0, GRASS:1, DIRT:2, STONE:3, COBBLE:4, LOG:5, LEAVES:6, PLANK:7,
  SAND:8, SANDSTONE:9, WATER:10, GLASS:11, COAL_ORE:12, IRON_ORE:13,
  GOLD_ORE:14, DIAMOND_ORE:15, BRICK:16, BEDROCK:17, OBSIDIAN:18,
  SNOW:19, ICE:20, GRAVEL:21, CRAFTING:22, FURNACE:23, CHEST:24, TORCH:25
};

const TILES = {};
const reg = (id, def) => TILES[id] = { id, ...def };
reg(T.GRASS, { name:'Cỏ', colors:['#6fbf4a','#5a9a48','#4a7a3a'], hardness:0.6, tool:'shovel', drop:T.DIRT, mat:'grass' });
reg(T.DIRT, { name:'Đất', colors:['#9a6a3e','#8b5f37','#7a5230'], hardness:0.5, tool:'shovel', drop:T.DIRT, mat:'grass' });
reg(T.STONE, { name:'Đá', colors:['#a8a8a8','#9a9a9a','#8a8a8a'], hardness:1.5, tool:'pickaxe', minTier:1, drop:T.COBBLE, mat:'stone' });
reg(T.COBBLE, { name:'Đá cuội', colors:['#8a8a8a','#7a7a7a','#6a6a6a'], hardness:2.0, tool:'pickaxe', minTier:1, drop:T.COBBLE, mat:'stone' });
reg(T.LOG, { name:'Gỗ sồi', colors:['#a06a3a','#8a5a2e','#7a4e28'], hardness:2.0, tool:'axe', drop:T.LOG, mat:'wood' });
reg(T.LEAVES, { name:'Lá sồi', colors:['#4a9a3a','#3d8030','#2d6020'], hardness:0.2, drop:T.LEAVES, mat:'grass' });
reg(T.PLANK, { name:'Ván gỗ', colors:['#c9905a','#a87848','#8a5a2e'], hardness:2.0, tool:'axe', drop:T.PLANK, mat:'wood' });
reg(T.SAND, { name:'Cát', colors:['#e8d596','#dcc88a','#c8b478'], hardness:0.5, tool:'shovel', drop:T.SAND, mat:'sand' });
reg(T.SANDSTONE, { name:'Đá sa thạch', colors:['#dcc88a','#c8b478','#b8a468'], hardness:0.8, tool:'pickaxe', minTier:1, drop:T.SANDSTONE, mat:'stone' });
reg(T.WATER, { name:'Nước', colors:['#4a90e2','#3a7ac8','#2a5aa0'], solid:false, liquid:true, transparent:true, mat:'water' });
reg(T.GLASS, { name:'Thủy tinh', colors:['#a8d4e8','#88b4c8','#6a94a8'], hardness:0.3, drop:T.GLASS, transparent:true, mat:'stone' });
reg(T.COAL_ORE, { name:'Quặng than', colors:['#5a5a5a','#3a3a3a','#1a1a1a'], hardness:3.0, tool:'pickaxe', minTier:1, drop:'coal', mat:'stone' });
reg(T.IRON_ORE, { name:'Quặng sắt', colors:['#a8a8a8','#d0906a','#8a5030'], hardness:3.0, tool:'pickaxe', minTier:2, drop:'iron_ore', mat:'stone' });
reg(T.GOLD_ORE, { name:'Quặng vàng', colors:['#a8a8a8','#f4c830','#c8a020'], hardness:3.0, tool:'pickaxe', minTier:3, drop:'gold_ore', mat:'stone' });
reg(T.DIAMOND_ORE, { name:'Quặng KC', colors:['#a8a8a8','#4aede0','#20b0a0'], hardness:3.0, tool:'pickaxe', minTier:3, drop:'diamond', mat:'stone' });
reg(T.BRICK, { name:'Gạch', colors:['#b04038','#8a3028','#6a2018'], hardness:2.0, tool:'pickaxe', minTier:1, drop:T.BRICK, mat:'stone' });
reg(T.BEDROCK, { name:'Bedrock', colors:['#3a3a3a','#2a2a2a','#1a1a1a'], hardness:Infinity, mat:'stone' });
reg(T.OBSIDIAN, { name:'Obsidian', colors:['#201030','#301848','#4a2868'], hardness:50, tool:'pickaxe', minTier:4, drop:T.OBSIDIAN, mat:'stone' });
reg(T.SNOW, { name:'Tuyết', colors:['#f4f8fc','#e8eef4','#d8e0e8'], hardness:0.3, tool:'shovel', drop:T.SNOW, mat:'sand' });
reg(T.ICE, { name:'Băng', colors:['#88c8e8','#78b8d8','#6898b8'], hardness:0.5, tool:'pickaxe', minTier:1, drop:T.ICE, transparent:true, mat:'water' });
reg(T.GRAVEL, { name:'Sỏi', colors:['#8a8a8a','#6a6a6a','#5a5a5a'], hardness:0.6, tool:'shovel', drop:T.GRAVEL, mat:'grass' });
reg(T.CRAFTING, { name:'Bàn chế tạo', colors:['#c9905a','#8a5a2e','#6a4a20'], hardness:2.5, tool:'axe', drop:T.CRAFTING, use:'crafting', mat:'wood' });
reg(T.FURNACE, { name:'Lò nung', colors:['#8a8a8a','#5a5a5a','#3a3a3a'], hardness:3.5, tool:'pickaxe', minTier:1, drop:T.FURNACE, use:'furnace', mat:'stone' });
reg(T.CHEST, { name:'Rương', colors:['#a87848','#8a5a2e','#6a3a1a'], hardness:2.5, tool:'axe', drop:T.CHEST, use:'chest', mat:'wood' });
reg(T.TORCH, { name:'Đuốc', colors:['#e08020','#ffd060','#8a5a2e'], hardness:0.1, solid:false, drop:T.TORCH, light:12, transparent:true, mat:'wood' });

const ITEMS = {};
const regI = (id, def) => ITEMS[id] = { id, ...def };
regI('stick', { name:'Gậy', color:'#a87848', stack:64 });
regI('coal', { name:'Than', color:'#1a1a1a', stack:64, fuel:1600 });
regI('iron_ore', { name:'Sắt thô', color:'#d0906a', stack:64 });
regI('iron_ingot', { name:'Sắt thỏi', color:'#d8d8d8', stack:64 });
regI('gold_ore', { name:'Vàng thô', color:'#f4c830', stack:64 });
regI('gold_ingot', { name:'Vàng thỏi', color:'#f4c830', stack:64 });
regI('diamond', { name:'Kim cương', color:'#4aede0', stack:64 });
regI('apple', { name:'Táo', color:'#e03b3b', stack:64, food:4 });
regI('bread', { name:'Bánh mì', color:'#b88040', stack:64, food:5 });
regI('pick_wood', { name:'Cúp gỗ', color:'#a87848', stack:1, tool:'pickaxe', tier:1, speed:2, dur:60 });
regI('pick_stone', { name:'Cúp đá', color:'#9a9a9a', stack:1, tool:'pickaxe', tier:2, speed:4, dur:132 });
regI('pick_iron', { name:'Cúp sắt', color:'#d8d8d8', stack:1, tool:'pickaxe', tier:3, speed:6, dur:251 });
regI('pick_diamond', { name:'Cúp KC', color:'#4aede0', stack:1, tool:'pickaxe', tier:4, speed:8, dur:1562 });
regI('sword_wood', { name:'Kiếm gỗ', color:'#c9905a', stack:1, tool:'sword', tier:1, dmg:4, dur:60 });
regI('sword_stone', { name:'Kiếm đá', color:'#b8b8b8', stack:1, tool:'sword', tier:2, dmg:5, dur:132 });
regI('sword_iron', { name:'Kiếm sắt', color:'#f0f0f0', stack:1, tool:'sword', tier:3, dmg:6, dur:251 });
regI('sword_diamond', { name:'Kiếm KC', color:'#8afff5', stack:1, tool:'sword', tier:4, dmg:7, dur:1562 });
regI('axe_wood', { name:'Rìu gỗ', color:'#a87848', stack:1, tool:'axe', tier:1, speed:2, dur:60 });
regI('shovel_wood', { name:'Xẻng gỗ', color:'#a87848', stack:1, tool:'shovel', tier:1, speed:2, dur:60 });

/* ============ WORLD ============ */
const WORLD_W = 128, WORLD_H = 128;
const world = new Uint8Array(WORLD_W * WORLD_H);
const wGet = (x, y) => (x<0||y<0||x>=WORLD_W||y>=WORLD_H) ? T.BEDROCK : world[y*WORLD_W + x];
const wSet = (x, y, id) => { if (x>=0&&y>=0&&x<WORLD_W&&y<WORLD_H) world[y*WORLD_W + x] = id; };
const wSolid = (x, y) => { const t = wGet(x,y); const d = TILES[t]; return !d || d.solid !== false; };

/* Torch light map */
const lightMap = new Uint8Array(WORLD_W * WORLD_H);
function computeLight(){
  lightMap.fill(0);
  const queue = [];
  for (let y=0;y<WORLD_H;y++) for (let x=0;x<WORLD_W;x++){
    if (wGet(x,y) === T.TORCH){
      lightMap[y*WORLD_W+x] = 14;
      queue.push(x,y,14);
    }
  }
  let head = 0;
  const NEI = [[1,0],[-1,0],[0,1],[0,-1]];
  while (head < queue.length){
    const x = queue[head++], y = queue[head++], v = queue[head++];
    if (v <= 1) continue;
    for (const [dx,dy] of NEI){
      const nx = x+dx, ny = y+dy;
      if (nx<0||ny<0||nx>=WORLD_W||ny>=WORLD_H) continue;
      const t = wGet(nx,ny);
      const td = TILES[t];
      if (td && td.solid !== false && !td.light) continue;
      const nv = v - 1;
      if (nv > lightMap[ny*WORLD_W+nx]){
        lightMap[ny*WORLD_W+nx] = nv;
        queue.push(nx,ny,nv);
      }
    }
  }
}

/* World gen */
function hash2(x,y){
  const n = Math.sin(x*127.1 + y*311.7) * 43758.5453;
  return n - Math.floor(n);
}
function valueNoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2(xi,yi), b = hash2(xi+1,yi), c = hash2(xi,yi+1), d = hash2(xi+1,yi+1);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}
const SEA = 34;
function terrainH(x,y){
  let h = SEA;
  h += valueNoise(x/40, y/40) * 18;
  h += valueNoise(x/15, y/15) * 6;
  h += valueNoise(x/6, y/6) * 2;
  return Math.floor(h);
}
function generateWorld(){
  for (let y=0;y<WORLD_H;y++) for (let x=0;x<WORLD_W;x++){
    const h = terrainH(x,y);
    let id = T.AIR;
    if (h <= SEA+1 && h >= SEA-1) id = T.SAND;
    else if (h > SEA) id = T.GRASS;
    else if (h < SEA-2) id = T.DIRT;
    else id = T.GRASS;
    // ores biomes
    if (id === T.GRASS && Math.random() < 0.02){
      const r = Math.random();
      if (r < 0.5) id = T.STONE;
      else if (r < 0.75) id = T.COAL_ORE;
      else if (r < 0.9) id = T.IRON_ORE;
    }
    wSet(x,y,id);
  }
  // Rocks/cobble patches
  for (let i=0;i<200;i++){
    const cx = Math.floor(Math.random()*WORLD_W);
    const cy = Math.floor(Math.random()*WORLD_H);
    const r = 1 + Math.floor(Math.random()*3);
    for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
      if (Math.hypot(dx,dy) > r) continue;
      if (Math.random() < 0.6) wSet(cx+dx, cy+dy, T.STONE);
    }
  }
  // Sand patches
  for (let i=0;i<40;i++){
    const cx = Math.floor(Math.random()*WORLD_W);
    const cy = Math.floor(Math.random()*WORLD_H);
    const r = 2 + Math.floor(Math.random()*4);
    for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
      if (Math.hypot(dx,dy) > r) continue;
      wSet(cx+dx, cy+dy, T.SAND);
    }
  }
  // Trees
  for (let i=0;i<400;i++){
    const cx = Math.floor(Math.random()*WORLD_W);
    const cy = Math.floor(Math.random()*WORLD_H);
    if (wGet(cx,cy) !== T.GRASS) continue;
    // Check 3x3 grass
    let ok = true;
    for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++)
      if (wGet(cx+dx,cy+dy) !== T.GRASS) ok = false;
    if (!ok) continue;
    placeTree(cx,cy);
  }
}
function placeTree(x,y){
  wSet(x,y,T.LOG);
  const leaves = [[-1,-2],[0,-2],[1,-2],[-2,-1],[-1,-1],[0,-1],[1,-1],[2,-1],
                  [-2,0],[-1,0],[1,0],[2,0],[-2,1],[-1,1],[0,1],[1,1],[2,1],
                  [-1,2],[0,2],[1,2]];
  for (const [dx,dy] of leaves){
    if (wGet(x+dx, y+dy) === T.GRASS || wGet(x+dx, y+dy) === T.AIR)
      wSet(x+dx, y+dy, T.LEAVES);
  }
  wSet(x, y-1, T.LOG);
}

function getBE(x, y, create){
  const k = bek(x,y);
  let be = blockEntities.get(k);
  if (be) return be;
  if (!create) return null;
  const id = wGet(x,y);
  if (id === T.FURNACE) be = { type:'furnace', x, y, input:null, fuel:null, output:null,

  if (be) blockEntities.set(k, be);
  return be;
}

function isBlockId(id){ return typeof id === 'string' && id.startsWith('block_'); }
function getBlockType(id){ return parseInt(id.slice(6)); }
function defOf(id){
  if (isBlockId(id)) return TILES[getBlockType(id)];
  return ITEMS[id];
}
function nameOf(id){ const d = defOf(id); return d ? d.name : id; }
function maxStack(id){ const d = defOf(id); return d?.stack ?? 64; }

function addItem(id, n){
  n = n || 1;
  const slots = [...inv.hotbar, ...inv.main];
  const ms = maxStack(id);
  for (const s of slots){
    if (s && s.id === id && s.dur === undefined && s.n < ms){
      const add = Math.min(n, ms - s.n);
      s.n += add; n -= add; if (n <= 0) return 0;
    }
  }
  for (let i=0;i<inv.hotbar.length;i++){
    if (!inv.hotbar[i]){
      const add = Math.min(n, ms);
      inv.hotbar[i] = { id, n: add }; n -= add; if (n <= 0) return 0;
    }
  }
  for (let i=0;i<inv.main.length;i++){
    if (!inv.main[i]){
      const add = Math.min(n, ms);
      inv.main[i] = { id, n: add }; n -= add; if (n <= 0) return 0;
    }
  }
  return n;
}
function newStack(id, n){
  const def = defOf(id);
  const s = { id, n };
  if (def && def.dur) s.dur = def.dur;
  return s;
}

/* ============ RECIPES ============ */
const RECIPES = [
  { shape:[[T.LOG]], out:{ id:'block_'+T.PLANK, n:4 } },
  { shape:[[T.PLANK],[T.PLANK]], out:{ id:'stick', n:4 } },
  { shape:[[T.PLANK,T.PLANK],[T.PLANK,T.PLANK]], out:{ id:'block_'+T.CRAFTING, n:1 } },
  { shape:[[T.COBBLE,T.COBBLE,T.COBBLE],[0,T.STICK,0],[0,T.STICK,0]], out:{ id:'pick_stone', n:1 } },
  { shape:[[T.PLANK,T.PLANK,T.PLANK],[0,'stick',0],[0,'stick',0]], out:{ id:'pick_wood', n:1 } },
  { shape:[[0,'iron_ingot',0],[0,'stick',0],[0,'stick',0]], out:{ id:'pick_iron', n:1 } },
  { shape:[[T.COBBLE,T.COBBLE],[T.COBBLE,T.COBBLE]], out:{ id:'block_'+T.FURNACE, n:1 } },
  { shape:[[T.PLANK,T.PLANK,T.PLANK],[T.PLANK,0,T.PLANK],[T.PLANK,T.PLANK,T.PLANK]], out:{ id:'block_'+T.CHEST, n:1 } },
  { shape:[[T.SAND,T.SAND,T.SAND],[T.SAND,T.SAND,T.SAND],[T.SAND,T.SAND,T.SAND]], out:{ id:'block_'+T.GLASS, n:1 } },
  { shape:[['coal'],['stick']], out:{ id:'block_'+T.TORCH, n:4 } },
];

function checkRecipe(grid){
  // grid: array of {type, id} where type=0 empty, type=1 block, type=2 item
  for (const rec of RECIPES){
    const shape = rec.shape;
    // Find bounding box of non-empty in grid
    let minR=99, maxR=-1, minC=99, maxC=-1;
    for (let r=0;r<3;r++) for (let c=0;c<3;c++){
      if (grid[r*3+c]){
        if (r<minR) minR=r; if (r>maxR) maxR=r;
        if (c<minC) minC=c; if (c>maxC) maxC=c;
      }
    }
    const sh = maxR-minR+1, sw = maxC-minC+1;
    if (sh !== shape.length) continue;
    if (sw !== shape[0].length) continue;
    let match = true;
    for (let r=0;r<sh;r++) for (let c=0;c<sw;c++){
      const want = shape[r][c];
      const got = grid[(minR+r)*3 + (minC+c)];
      if (want === 0){
        if (got) { match = false; break; }
      } else if (typeof want === 'number'){
        // Tile ID
        if (!got || got.type !== 'block' || got.tile !== want) { match = false; break; }
      } else if (typeof want === 'string'){
        // Item ID
        if (!got || got.type !== 'item' || got.item !== want) { match = false; break; }
      }
    }
    if (match) return rec;
  }
  return null;
}

const joy = { id:null, x:0, y:0, cx:0, cy:0 };

joyZone.addEventListener('pointerdown', e => {

function moveJoy(cx, cy){
  let dx = cx - joy.cx, dy = cy - joy.cy;
  const d = Math.hypot(dx,dy), max = 52;
  if (d > max){ dx = dx/d*max; dy = dy/d*max; }
  joy.x = dx/max; joy.y = dy/max;
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
}
function endJoy(e){
  if (e.pointerId !== joy.id) return;
  joy.id = null; joy.x = 0; joy.y = 0;
  joyKnob.style.transform = 'translate(0,0)';
}
addEventListener('pointermove', e => {
  if (e.pointerId === joy.id){ e.preventDefault(); moveJoy(e.clientX, e.clientY); }
}, { passive:false });

/* ============ MINING ============ */
let mining = null;
let digSoundT = 0;
const mineBarEl = document.getElementById('mineBar');
const mineFillEl = document.getElementById('mineFill');

function startMining(){
  const hit = getHitTile();
  if (!hit){ mining = null; return; }
  const id = wGet(hit.x, hit.y);
  const def = TILES[id];
  if (!def || def.hardness === Infinity) { mining = null; return; }
  if (def.hardness === 0){ finishMining(hit.x, hit.y); return; }
  if (!mining || mining.x !== hit.x || mining.y !== hit.y){
    mining = { x: hit.x, y: hit.y, id, progress: 0, total: computeMineTime(id) };
  }
  mineBarEl.classList.add('show');
}
function computeMineTime(id){
  const def = TILES[id];
  if (!def) return 1;
  if (def.hardness === 0) return 0;
  if (def.hardness === Infinity) return Infinity;
  const held = inv.hotbar[player.selected];
  const heldDef = held ? defOf(held.id) : null;
  const rightTool = heldDef && heldDef.tool === def.tool;
  const speed = rightTool ? (heldDef.speed||1) : 1;
  const mult = rightTool ? 1.5 : 4;
  return def.hardness * mult / speed;
}
function stopMining(){
  mining = null;
  mineBarEl.classList.remove('show');
}
function updateMining(dt){
  const wantDig = mouse.down || miningTouch;
  if (!wantDig){ stopMining(); return; }
  if (!mining){ startMining(); return; }
  const cur = wGet(mining.x, mining.y);
  if (cur !== mining.id){ stopMining(); return; }
  mining.progress += dt;
  const pct = Math.min(100, mining.progress / mining.total * 100);
  mineFillEl.style.width = pct + '%';

  const now = performance.now();
  if (now - digSoundT > 220){
    digSoundT = now;
    Audio2D.dig(TILES[mining.id].mat || 'stone');
  }
  if (mining.progress >= mining.total) finishMining(mining.x, mining.y);
}
function finishMining(x, y){
  const id = wGet(x, y);
  if (!id) { stopMining(); return; }
  const def = TILES[id];
  if (!def || def.hardness === Infinity) { stopMining(); return; }

  // Drop BE contents
  if (id === T.FURNACE || id === T.CHEST){
    const be = getBE(x, y, false);
    if (be){
      if (be.type === 'furnace'){
        if (be.input) addItem(be.input.id, be.input.n);
        if (be.fuel) addItem(be.fuel.id, be.fuel.n);
        if (be.output) addItem(be.output.id, be.output.n);
      } else if (be.type === 'chest'){
        for (const s of be.items) if (s) addItem(s.id, s.n);
      }
    }
    blockEntities.delete(bek(x,y));
  }

  const held = inv.hotbar[player.selected];
  const heldDef = held ? defOf(held.id) : null;
  const canHarvest = !def.minTier || (heldDef && heldDef.tool === def.tool && (heldDef.tier||0) >= def.minTier);

  Audio2D.breakBlock(def.mat || 'stone');
  wSet(x, y, T.AIR);

  if (canHarvest && def.drop !== undefined){
    let dropId = def.drop;
    if (typeof dropId === 'number') dropId = 'block_' + dropId;
    addItem(dropId, 1);
    Audio2D.pickup();
  } else if (def.minTier){
    toast(`⛏️ Cần ${def.tool === 'pickaxe' ? 'cúp' : def.tool} tier ${def.minTier}+`);
  }

  // Durability
  if (held && heldDef && heldDef.dur && held.dur !== undefined){
    held.dur--;
    if (held.dur <= 0){
      inv.hotbar[player.selected] = null;
      toast(`💥 ${heldDef.name} vỡ!`);
      Audio2D.breakBlock('wood');
    }
  }

  computeLight();
  renderHotbar();
  stopMining();
}

/* ============ PLACE ============ */
function placeAtCursor(){
  const hit = getHitTile();
  if (!hit) return;
  const id = wGet(hit.x, hit.y);
  const def = TILES[id];
  // Interact with BE
  if (def && def.use === 'crafting'){ openGUI('craft'); return; }
  if (def && (def.use === 'furnace' || def.use === 'chest')){ openBlockBE(hit.x, hit.y); return; }

  const held = inv.hotbar[player.selected];
  if (!held || !isBlockId(held.id)) return;
  const blockType = getBlockType(held.id);
  // Can't place over solid block
  const curDef = TILES[id];
  if (curDef && curDef.solid !== false && !curDef.liquid) return;
  // Can't place on player
  const px = player.x/TILE, py = player.y/TILE;
  if (Math.abs(hit.x + 0.5 - px) < 0.9 && Math.abs(hit.y + 0.5 - py) < 0.9) return;

  wSet(hit.x, hit.y, blockType);
  Audio2D.place(TILES[blockType].mat || 'stone');
  held.n--;
  if (held.n <= 0) inv.hotbar[player.selected] = null;

  if (blockType === T.FURNACE || blockType === T.CHEST){
    blockEntities.delete(bek(hit.x, hit.y));
    getBE(hit.x, hit.y, true);
  }
  if (blockType === T.TORCH) computeLight();
  renderHotbar();
}

/* ============ RAYCAST (mouse → tile) ============ */
function getHitTile(){
  const wx = (mouse.x + cam.x) / TILE;
  const wy = (mouse.y + cam.y) / TILE;
  const c = Math.floor(wx), r = Math.floor(wy);
  if (c<0||r<0||c>=WORLD_W||r>=WORLD_H) return null;
  return { x:c, y:r };
}

/* ============ UPDATE PLAYER ============ */
function updatePlayer(dt){
  let dx = 0, dy = 0;
  if (joy.id !== null && Math.hypot(joy.x, joy.y) > 0.15){ dx = joy.x; dy = joy.y; }
  else {
    if (keys['KeyA']||keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD']||keys['ArrowRight']) dx += 1;
    if (keys['KeyW']||keys['ArrowUp']) dy -= 1;
    if (keys['KeyS']||keys['ArrowDown']) dy += 1;
  }
  const mag = Math.hypot(dx, dy);
  if (mag > 1){ dx /= mag; dy /= mag; }
  if (Math.abs(dx) > 0.1) player.facing = dx > 0 ? 1 : -1;

  const speed = player.speed * (player.flying ? 1.6 : 1);
  const vx = dx * speed, vy = dy * speed;

  // Move with collision (separate axes)
  const nr = player.radius;
  let nx = player.x + vx * dt;
  if (!tileCollide(nx - nr, player.y - nr) && !tileCollide(nx + nr, player.y - nr) &&
      !tileCollide(nx - nr, player.y + nr) && !tileCollide(nx + nr, player.y + nr))
    player.x = nx;
  let ny = player.y + vy * dt;
  if (!tileCollide(player.x - nr, ny - nr) && !tileCollide(player.x + nr, ny - nr) &&
      !tileCollide(player.x - nr, ny + nr) && !tileCollide(player.x + nr, ny + nr))
    player.y = ny;

  player.x = Math.max(nr, Math.min(WORLD_W*TILE - nr, player.x));
  player.y = Math.max(nr, Math.min(WORLD_H*TILE - nr, player.y));

  // State
  player.stateT += dt;
  player.animT += dt;
  if (mag > 0.1){
    player.state = 'walk';
    // step sound
    player._stepAcc = (player._stepAcc||0) + speed*dt;
    if (player._stepAcc > 24){
      player._stepAcc = 0;
      const tx = Math.floor(player.x/TILE), ty = Math.floor(player.y/TILE);
      const under = wGet(tx, ty);
      Audio2D.step(TILES[under]?.mat || 'grass');
    }
  } else {
    player.state = 'idle';
    player._stepAcc = 0;
  }
}
function tileCollide(px, py){
  const c = Math.floor(px/TILE), r = Math.floor(py/TILE);
  return wSolid(c, r);
}

/* ============ UPDATE MOBS ============ */
function updateMobs(dt){
  for (let i = mobs.length - 1; i >= 0; i--){
    const m = mobs[i];
    const dx = player.x - m.x, dy = player.y - m.y;
    const d = Math.hypot(dx, dy);
    if (d > 40*TILE){ mobs.splice(i,1); continue; }
    if (m.attackCd > 0) m.attackCd -= dt;
    if (d < 1.2*TILE && m.attackCd <= 0){
      player.hp = Math.max(0, player.hp - m.dmg);
      player.lastDamage = performance.now();
      m.attackCd = 1;
      flashDamage();
      Audio2D.hurt();
      if (m.type === 'creeper'){
        // explode
        for (let ddx=-2;ddx<=2;ddx++) for (let ddy=-2;ddy<=2;ddy++){
          const bx = Math.floor(m.x/TILE)+ddx, by = Math.floor(m.y/TILE)+ddy;
          if (getBlockTypeSafe(bx,by) !== T.BEDROCK) wSet(bx,by,T.AIR);
        }
        mobs.splice(i,1);
        computeLight();
        continue;
      }
    }
    if (d > 0.9*TILE && d < 30*TILE){
      const sp = m.speed * dt / TILE;
      const nx = m.x + dx/d * sp * TILE;
      const ny = m.y + dy/d * sp * TILE;
      if (!tileCollide(nx - m.size, m.y) && !tileCollide(nx + m.size, m.y)) m.x = nx;
      if (!tileCollide(m.x, ny - m.size) && !tileCollide(m.x, ny + m.size)) m.y = ny;
      if (dx > 0.5) m.facing = 1; else if (dx < -0.5) m.facing = -1;
    }
    m.animT += dt;
  }
}
function getBlockTypeSafe(x, y){
  const id = wGet(x, y);
  return id;
}

/* ============ RENDER ============ */
function drawTile(x, y, id, sx, sy){
  const def = TILES[id];
  if (!def){ return; }
  if (def.transparent){
    // Draw simple transparent tile
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = def.colors[0];
    ctx.fillRect(sx, sy, TILE, TILE);
    ctx.globalAlpha = 1;
    ctx.fillStyle = def.colors[1];
    ctx.fillRect(sx, sy, TILE, 2);
    return;
  }
  // Base
  ctx.fillStyle = def.colors[0];
  ctx.fillRect(sx, sy, TILE, TILE);
  // Top highlight
  ctx.fillStyle = def.colors[1];
  ctx.fillRect(sx, sy, TILE, 2);
  // Noise dots (deterministic)
  const h = (x*73856093 ^ y*19349663) >>> 0;
  ctx.fillStyle = def.colors[2];
  for (let i=0;i<3;i++){
    const hh = (h >> (i*5)) & 0xFF;
    const dx = 3 + (hh % (TILE-8));
    const dy = 4 + ((hh >> 4) % (TILE-10));
    ctx.fillRect(sx+dx, sy+dy, 3, 3);
  }
  // Edge
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.fillRect(sx, sy+TILE-1, TILE, 1);
  ctx.fillRect(sx+TILE-1, sy, 1, TILE);
}

function drawBackground(){
  // Sky/ground color depending on night
  const nightFactor = getNightFactor();
  ctx.fillStyle = nightFactor > 0.5 ? '#0a0f1a' : '#1a2a1a';
  ctx.fillRect(0, 0, VW, VH);
}

function render(){
  // Compute night factor
  const nightFactor = getNightFactor();

  // Compute visible tile range
  const cx0 = Math.max(0, Math.floor(cam.x / TILE));
  const cy0 = Math.max(0, Math.floor(cam.y / TILE));
  const cx1 = Math.min(WORLD_W, Math.ceil((cam.x + VW) / TILE));
  const cy1 = Math.min(WORLD_H, Math.ceil((cam.y + VH) / TILE));

  // Background
  ctx.fillStyle = nightFactor > 0.6 ? '#0a0a14' : '#0f180f';
  ctx.fillRect(0, 0, VW, VH);

  // Tiles
  for (let y=cy0; y<cy1; y++){
    for (let x=cx0; x<cx1; x++){
      const id = wGet(x, y);
      if (!id) continue;
      const sx = x*TILE - cam.x;
      const sy = y*TILE - cam.y;
      drawTile(x, y, id, sx, sy);
    }
  }

  // Mining crack overlay
  if (mining){
    const sx = mining.x*TILE - cam.x;
    const sy = mining.y*TILE - cam.y;
    const prog = Math.min(1, mining.progress / mining.total);
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineWidth = 2;
    const crackCount = Math.floor(prog * 8);
    const h = (mining.x*73856093 ^ mining.y*19349663) >>> 0;
    for (let i=0;i<crackCount;i++){
      const hh = (h >> (i*3)) & 0xFF;
      const x1 = sx + 4 + (hh % (TILE-8));
      const y1 = sy + 4 + ((hh >> 4) % (TILE-8));
      const x2 = x1 + ((hh >> 2) % 9) - 4;
      const y2 = y1 + ((hh >> 6) % 9) - 4;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }

  // Entities sorted by Y
  const ents = [];
  for (const m of mobs) ents.push({ y: m.y, draw: () => drawMob(m) });
  ents.push({ y: player.y, draw: () => drawPlayer() });
  ents.sort((a,b) => a.y - b.y);
  for (const e of ents) e.draw();

  // Darkness + torch light overlay
  applyLighting(nightFactor);

  // Hover highlight
  const hit = getHitTile();
  if (hit && !guiOpen){
    const sx = hit.x*TILE - cam.x;
    const sy = hit.y*TILE - cam.y;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx+1, sy+1, TILE-2, TILE-2);
  }

  // Time display
  const t = getClockString();
  document.getElementById('time').textContent = `${nightFactor > 0.6 ? '🌙' : '☀'} ${t} · Ngày ${dayCount}`;
  document.getElementById('coords').innerHTML = `XYZ: <b>${(player.x/TILE).toFixed(1)} ${(player.y/TILE).toFixed(1)}</b>`;
}

function applyLighting(nightFactor){
  if (nightFactor < 0.05) return;
  ctx.save();
  // Dark overlay
  ctx.fillStyle = `rgba(5, 8, 25, ${nightFactor * 0.85})`;
  ctx.fillRect(0, 0, VW, VH);
  // Cut light from torches
  ctx.globalCompositeOperation = 'lighter';
  for (let y=0; y<WORLD_H; y++){
    for (let x=0; x<WORLD_W; x++){
      const lv = lightMap[y*WORLD_W+x];
      if (lv <= 0) continue;
      const sx = x*TILE + TILE/2 - cam.x;
      const sy = y*TILE + TILE/2 - cam.y;
      if (sx < -200 || sx > VW+200 || sy < -200 || sy > VH+200) continue;
      const r = lv * 22;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      const alpha = (lv / 14) * 0.75;
      g.addColorStop(0, `rgba(255, 200, 100, ${alpha})`);
      g.addColorStop(1, 'rgba(255, 200, 100, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    }
  }
  // Player light aura
  const px = player.x - cam.x, py = player.y - cam.y;
  const pg = ctx.createRadialGradient(px, py, 0, px, py, 100);
  pg.addColorStop(0, `rgba(150, 200, 255, ${nightFactor * 0.7})`);
  pg.addColorStop(1, 'rgba(150, 200, 255, 0)');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(px, py, 100, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

/* ============ DRAW PLAYER ============ */
function drawPlayer(){
  const sx = player.x - cam.x, sy = player.y - cam.y;
  const t = player.animT;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(sx, sy+14, 12, 4, 0, 0, Math.PI*2); ctx.fill();

  const bounce = player.state === 'walk' ? Math.sin(t*12)*1.5 : Math.sin(t*3)*0.6;
  const legSwing = player.state === 'walk' ? Math.sin(t*12)*3 : 0;

  // Legs
  ctx.fillStyle = '#2a3a5a';
  ctx.fillRect(sx-6+legSwing, sy+2, 4, 10-bounce);
  ctx.fillRect(sx+2-legSwing, sy+2, 4, 10-bounce);
  // Boots
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(sx-6+legSwing, sy+11, 4, 3);
  ctx.fillRect(sx+2-legSwing, sy+11, 4, 3);

  // Body
  ctx.fillStyle = '#3a5a9a';
  ctx.fillRect(sx-8, sy-14+bounce, 16, 18);
  // Shirt detail
  ctx.fillStyle = '#2a4a7a';
  ctx.fillRect(sx-8, sy-4+bounce, 16, 3);

  // Arms
  ctx.fillStyle = '#3a5a9a';
  const armSwing = player.state === 'walk' ? Math.sin(t*12+Math.PI)*3 : 0;
  ctx.fillRect(sx-11, sy-12+bounce+armSwing, 3, 12);
  ctx.fillRect(sx+8, sy-12+bounce-armSwing, 3, 12);
  // Hands
  ctx.fillStyle = '#f0c8a0';
  ctx.fillRect(sx-11, sy+armSwing+bounce, 3, 3);
  ctx.fillRect(sx+8, sy-armSwing+bounce, 3, 3);

  // Head
  ctx.fillStyle = '#f0c8a0';
  ctx.fillRect(sx-7, sy-26+bounce, 14, 12);
  // Hair
  ctx.fillStyle = '#3a2010';
  ctx.fillRect(sx-7, sy-26+bounce, 14, 4);
  ctx.fillRect(sx-7, sy-26+bounce, 3, 8);
  ctx.fillRect(sx+4, sy-26+bounce, 3, 8);

  // Eyes (facing direction)
  ctx.fillStyle = '#1a1a1a';
  if (player.facing > 0){
    ctx.fillRect(sx+2, sy-22+bounce, 2, 2);
    ctx.fillRect(sx+5, sy-22+bounce, 2, 2);
  } else {
    ctx.fillRect(sx-4, sy-22+bounce, 2, 2);
    ctx.fillRect(sx-7, sy-22+bounce, 2, 2);
  }

  // Held item (block)
  const held = inv.hotbar[player.selected];
  if (held && isBlockId(held.id)){
    const bt = getBlockType(held.id);
    const bd = TILES[bt];
    if (bd){
      const ix = sx + (player.facing > 0 ? 12 : -20);
      const iy = sy - 8 + bounce;
      ctx.fillStyle = bd.colors[0];
      ctx.fillRect(ix, iy, 10, 10);
      ctx.fillStyle = bd.colors[1];
      ctx.fillRect(ix, iy, 10, 2);
    }
  }
}

/* ============ DRAW MOB ============ */
function drawMob(m){
  const sx = m.x - cam.x, sy = m.y - cam.y;
  if (sx < -50 || sx > VW+50 || sy < -50 || sy > VH+50) return;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(sx, sy+10, 10, 3, 0, 0, Math.PI*2); ctx.fill();

  const legSwing = Math.sin(m.animT*8)*2;

  // Legs
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(sx-5+legSwing, sy, 3, 8);
  ctx.fillRect(sx+2-legSwing, sy, 3, 8);

  // Body
  ctx.fillStyle = m.color;
  ctx.fillRect(sx-6, sy-12, 12, 14);

  // Arms forward
  ctx.fillRect(sx-9, sy-10, 3, 10);
  ctx.fillRect(sx+6, sy-10, 3, 10);

  // Head
  ctx.fillStyle = m.color;
  ctx.fillRect(sx-5, sy-20, 10, 8);

  // Eyes
  ctx.fillStyle = '#ff2020';
  if (m.facing > 0){
    ctx.fillRect(sx-1, sy-17, 2, 2);
    ctx.fillRect(sx+2, sy-17, 2, 2);
  } else {
    ctx.fillRect(sx-3, sy-17, 2, 2);
    ctx.fillRect(sx-6, sy-17, 2, 2);
  }

  // HP bar
  if (m.hp < m.maxHp){
    const w = 18, h = 2;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(sx-w/2-1, sy-26, w+2, h+2);
    ctx.fillStyle = '#e8503a';
    ctx.fillRect(sx-w/2, sy-25, w * (m.hp/m.maxHp), h);
  }
}

/* ============ UPDATE CAMERA ============ */
function updateCam(){
  const targetX = player.x - VW/2;
  const targetY = player.y - VH/2;
  cam.x += (targetX - cam.x) * 0.15;
  cam.y += (targetY - cam.y) * 0.15;
  cam.x = Math.max(0, Math.min(WORLD_W*TILE - VW, cam.x));
  cam.y = Math.max(0, Math.min(WORLD_H*TILE - VH, cam.y));
}

/* ============ DAY/NIGHT ============ */
let worldTime = 0.25;
const DAY_DURATION = 300;
let dayCount = 1;
let lastNight = false;
function updateDayNight(dt){
  worldTime += dt / DAY_DURATION;
  if (worldTime >= 1){ worldTime -= 1; dayCount++; }
  const night = getNightFactor() > 0.6;
  if (night && !lastNight){
    // Spawn mobs
    const count = 3 + Math.floor(Math.random()*3);
    for (let i=0;i<count;i++) spawnMob(['zombie','creeper','skeleton'][Math.floor(Math.random()*3)]);
  }
  lastNight = night;
}
function getNightFactor(){
  // 0 = noon, 1 = midnight
  const t = worldTime * Math.PI * 2;
  return (1 - Math.cos(t)) / 2;
}
function getClockString(){
  const h = Math.floor(worldTime * 24);
  const m = Math.floor((worldTime * 24 - h) * 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

/* ============ HUD ============ */
const hotbarEl = document.getElementById('hotbar');
function renderHotbar(){
  hotbarEl.innerHTML = '';
  for (let i=0;i<9;i++){
    const slot = document.createElement('div');
    slot.className = 'hslot' + (i === player.selected ? ' active' : '');
    slot.dataset.idx = i;
    const item = inv.hotbar[i];
    if (item){
      const ic = document.createElement('div');
      ic.className = 'ic';
      ic.style.background = getItemColor(item.id);
      slot.appendChild(ic);
      if (item.n > 1){
        const c = document.createElement('span');
        c.className = 'cnt'; c.textContent = item.n;
        slot.appendChild(c);
      }
      const def = defOf(item.id);
      if (def && def.dur && item.dur !== undefined){
        const d = document.createElement('div');
        d.className = 'dur';
        const fill = document.createElement('div');
        fill.className = 'dur-fill';
        const pct = item.dur / def.dur;
        fill.style.width = (pct*100)+'%';
        fill.style.background = pct < 0.2 ? '#e53935' : pct < 0.5 ? '#ffc107' : '#4caf50';
        d.appendChild(fill);
        slot.appendChild(d);
      }
    }
    slot.addEventListener('click', () => { player.selected = i; renderHotbar(); Audio2D.click(); });
    hotbarEl.appendChild(slot);
  }
}
function getItemColor(id){
  if (isBlockId(id)){
    const t = TILES[getBlockType(id)];
    if (t) return `linear-gradient(135deg, ${t.colors[0]} 60%, ${t.colors[2]} 60%)`;
  }
  const it = ITEMS[id];
  if (it){
    if (it.tool){
      return `linear-gradient(180deg, transparent 20%, ${it.color} 20%, ${it.color} 80%, transparent 80%)`;
    }
    return it.color || '#888';
  }
  return '#888';
}
function renderHearts(){

  for (let i=0;i<10;i++){

      : half
      ? `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 14C4 10 1 7 1 4.5 1 2.5 2.5 1 4.5 1 6 1 7 2 8 3 9 2 10 1 11.5 1 13.5 1 15 2.5 15 4.5 15 7 12 10 8 14Z' fill='%23333'/><path d='M8 3C9 2 10 1 11.5 1 13.5 1 15 2.5 15 4.5 15 7 12 10 8 14Z' fill='%23e03b3b'/></svg>")`
      : `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 14C4 10 1 7 1 4.5 1 2.5 2.5 1 4.5 1 6 1 7 2 8 3 9 2 10 1 11.5 1 13.5 1 15 2.5 15 4.5 15 7 12 10 8 14Z' fill='%23333' opacity='.6'/></svg>")`;
    h.style.backgroundSize = 'contain';
    h.style.backgroundRepeat = 'no-repeat';
    el.appendChild(h);
  }
}
function flashDamage(){
  const t = document.getElementById('time');
  t.style.color = '#ff5050';
  setTimeout(() => t.style.color = '#ffd54a', 150);
}
let toastTimer = null;
function toast(msg){

/* ============ GUI ============ */
let guiOpen = false, guiMode = 'inv', activeBE = null;
let craftGrid = new Array(9).fill(null);
let cursorStack = null;
const guiEl = document.getElementById('gui');
const guiWin = document.getElementById('guiWin');
const cursorEl = document.getElementById('cursor');

function openGUI(mode){
  guiMode = mode;
  activeBE = null;
  craftGrid = new Array(9).fill(null);
  guiOpen = true;
  guiEl.classList.add('open');
  renderGUI();
}
function openBlockBE(x, y){
  const be = getBE(x, y, true);
  if (!be) return;
  activeBE = be;
  guiMode = be.type;
  craftGrid = new Array(9).fill(null);
  guiOpen = true;
  guiEl.classList.add('open');
  Audio2D.openChest();
  renderGUI();
}
function closeGUI(){
  if (guiMode === 'chest' || guiMode === 'furnace') Audio2D.closeChest();
  guiOpen = false;
  guiEl.classList.remove('open');
  // Return craft grid items
  for (const s of craftGrid){
    if (s) addItem(s.id, s.n);
  }

  if (cursorStack){
    addItem(cursorStack.id, cursorStack.n);
    cursorStack = null;
  }

}
function updateCursor(){
  if (cursorStack){
    cursorEl.style.display = 'block';
    cursorEl.style.background = getItemColor(cursorStack.id);
    cursorEl.innerHTML = cursorStack.n > 1 ? `<span class="cnt">${cursorStack.n}</span>` : '';
  } else {
    cursorEl.style.display = 'none';
    cursorEl.innerHTML = '';
  }
}
addEventListener('mousemove', e => {
  if (cursorStack){
    cursorEl.style.left = e.clientX + 'px';
    cursorEl.style.top = e.clientY + 'px';
  }
});

function slotHTML(item, extraClass){
  extraClass = extraClass || '';
  if (!item) return `<div class="slot ${extraClass}"></div>`;
  const def = defOf(item.id);
  if (!def) return `<div class="slot ${extraClass}"></div>`;
  const cnt = item.n > 1 ? `<span class="cnt">${item.n}</span>` : '';
  let durHTML = '';
  if (def.dur && item.dur !== undefined){
    const pct = item.dur / def.dur;
    const col = pct < 0.2 ? '#e53935' : pct < 0.5 ? '#ffc107' : '#4caf50';
    durHTML = `<div class="dur"><div class="dur-fill" style="width:${(pct*100).toFixed(0)}%;background:${col}"></div></div>`;
  }
  return `<div class="slot ${extraClass}"><div class="ic" style="background:${getItemColor(item.id)}"></div>${cnt}${durHTML}</div>`;
}

function buildInvHTML(){
  let html = '';
  html += `<div class="section-title">TÚI ĐỒ</div>`;
  html += `<div class="grid g9" data-area="main">`;
  for (let i=0;i<27;i++) html += slotHTML(inv.main[i]);
  html += `</div>`;
  html += `<div class="section-title">HOTBAR</div>`;
  html += `<div class="grid g9" data-area="hotbar">`;
  for (let i=0;i<9;i++) html += slotHTML(inv.hotbar[i]);
  html += `</div>`;
  return html;
}

function getCraftResult(){
  const grid = new Array(9).fill(null);
  for (let i=0;i<9;i++){
    if (craftGrid[i]){
      const s = craftGrid[i];
      if (isBlockId(s.id)) grid[i] = { type:'block', tile: getBlockType(s.id), n: s.n };
      else grid[i] = { type:'item', item: s.id, n: s.n };
    }
  }
  const rec = checkRecipe(grid);
  if (!rec) return null;
  return newStack(rec.out.id, rec.out.n);
}

function renderGUI(){
  let html = '';
  let title = 'TÚI ĐỒ';
  if (guiMode === 'chest'){
    title = 'RƯƠNG';
    html += `<div class="section-title">RƯƠNG (${activeBE.items.filter(x=>x).length}/27)</div>`;
    html += `<div class="grid g9" data-area="chest">`;
    for (let i=0;i<27;i++) html += slotHTML(activeBE.items[i]);
    html += `</div>`;
    html += buildInvHTML();
  }
  else if (guiMode === 'furnace'){
    title = 'LÒ NUNG';
    const be = activeBE;
    const recipe = be.input && (be.input.id === 'iron_ore' || be.input.id === 'gold_ore' ||
                                be.input.id === 'block_'+T.SAND || be.input.id === 'block_'+T.COBBLE ||
                                be.input.id === 'block_'+T.COAL_ORE);
    const cookPct = recipe ? Math.min(100, Math.round(be.cookTime / 200 * 100)) : 0;
    const burnPct = be.maxBurnTime > 0 ? Math.max(0, Math.round(be.burnTime / be.maxBurnTime * 100)) : 0;
    html += `<div style="display:flex;gap:20px;align-items:center;justify-content:center;padding:10px 0">`;
    html += `<div style="display:flex;flex-direction:column;gap:8px;align-items:center">`;
    html += `<div data-area="furnace-input">${slotHTML(be.input)}</div>`;
    html += `<div style="width:42px;height:6px;background:#444;border:1px solid #111;position:relative">
      <div style="position:absolute;left:0;bottom:0;width:${burnPct}%;height:100%;background:linear-gradient(90deg,#ff6020,#ffd060)"></div>
    </div>`;
    html += `<div style="text-align:center;font-size:18px">${be.lit ? '🔥' : '·'}</div>`;
    html += `<div data-area="furnace-fuel">${slotHTML(be.fuel)}</div>`;
    html += `</div>`;
    html += `<div style="font-size:26px;color:#333">→</div>`;
    html += `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">`;
    html += `<div style="width:60px;height:6px;background:#444;border:1px solid #111;position:relative">
      <div style="position:absolute;left:0;top:0;width:${cookPct}%;height:100%;background:#fff"></div>
    </div>`;
    html += `</div>`;
    html += `<div data-area="furnace-output">${slotHTML(be.output, 'result')}</div>`;
    html += `</div>`;
    html += buildInvHTML();
  }
  else {
    // inv or craft
    if (guiMode === 'craft') title = 'BÀN CHẾ TẠO';
    html += `<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">`;
    // Craft grid
    if (guiMode === 'craft'){
      html += `<div><div class="section-title">CHẾ TẠO 3×3</div>
        <div class="grid g3" data-area="craft">`;
      for (let i=0;i<9;i++) html += slotHTML(craftGrid[i]);
      html += `</div></div>`;
    } else {
      html += `<div><div class="section-title">CHẾ TẠO 2×2</div>
        <div class="grid g2" data-area="craft" data-size="2">`;
      for (let i=0;i<4;i++) html += slotHTML(craftGrid[i]);
      html += `</div></div>`;
    }
    const result = getCraftResult();
    html += `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:20px">
      <div style="font-size:22px;color:#555">→</div>
      <div class="section-title">KẾT QUẢ</div>
      <div data-area="craft-result">${slotHTML(result, 'result')}</div>
    </div>`;
    html += `</div>`;
    html += buildInvHTML();
  }
  html += `<div style="text-align:right;margin-top:12px"><button id="guiClose" style="padding:8px 18px;background:#a8a8a8;border:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);font-family:inherit;font-size:12px;color:#333;cursor:pointer">Đóng (E)</button></div>`;

  guiWin.innerHTML = `<h2>${title}</h2>` + html;
  attachGUIEvents();
}

function attachGUIEvents(){
  guiWin.querySelectorAll('.slot').forEach(el => {
    el.addEventListener('contextmenu', e => e.preventDefault());
    el.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const area = el.parentElement.dataset.area;
      const idx = [...el.parentElement.children].indexOf(el);
      const isResult = area === 'craft-result';
      if (e.button === 2){
        if (isResult){ handleResultClick(); return; }
        handleRightClick(area, idx);
        return;
      }
      if (e.shiftKey && !isResult){
        handleShiftClick(area, idx);
        return;
      }
      if (isResult){ handleResultClick(); return; }
      handleLeftClick(area, idx);
    });
  });
  const closeBtn = document.getElementById('guiClose');
  if (closeBtn) closeBtn.addEventListener('click', closeGUI);
}

function getSlotStack(area, idx){
  if (area === 'main') return inv.main[idx];
  if (area === 'hotbar') return inv.hotbar[idx];
  if (area === 'chest') return activeBE.items[idx];
  if (area === 'furnace-input') return activeBE.input;
  if (area === 'furnace-fuel') return activeBE.fuel;
  if (area === 'furnace-output') return activeBE.output;
  if (area === 'craft') return craftGrid[idx];
  return null;
}
function setSlotStack(area, idx, val){
  if (area === 'main') inv.main[idx] = val;
  else if (area === 'hotbar') inv.hotbar[idx] = val;
  else if (area === 'chest') activeBE.items[idx] = val;
  else if (area === 'furnace-input') activeBE.input = val;
  else if (area === 'furnace-fuel') activeBE.fuel = val;
  else if (area === 'furnace-output') activeBE.output = val;
  else if (area === 'craft') craftGrid[idx] = val;
}
function handleLeftClick(area, idx){
  const cur = getSlotStack(area, idx);
  if (cursorStack){
    if (cur && cur.id === cursorStack.id && cur.dur === undefined && cursorStack.dur === undefined){
      const ms = maxStack(cur.id);
      const add = Math.min(cursorStack.n, ms - cur.n);
      cur.n += add; cursorStack.n -= add;
      if (cursorStack.n <= 0) cursorStack = null;
    } else {
      setSlotStack(area, idx, cursorStack);
      cursorStack = cur;
    }
  } else {
    if (cur){ cursorStack = cur; setSlotStack(area, idx, null); }
  }
  updateCursor();
  renderGUI();
  renderHotbar();
}
function handleRightClick(area, idx){
  const cur = getSlotStack(area, idx);
  if (cursorStack){
    if (!cur){
      const s = newStack(cursorStack.id, 1);
      if (cursorStack.dur !== undefined) s.dur = cursorStack.dur;
      setSlotStack(area, idx, s);
      cursorStack.n--;
      if (cursorStack.n <= 0) cursorStack = null;
    } else if (cur.id === cursorStack.id && cur.n < maxStack(cur.id)){
      cur.n++;
      cursorStack.n--;
      if (cursorStack.n <= 0) cursorStack = null;
    }
  } else if (cur){
    const half = Math.ceil(cur.n / 2);
    const s = newStack(cur.id, half);
    if (cur.dur !== undefined) s.dur = cur.dur;
    cursorStack = s;
    cur.n -= half;
    if (cur.n <= 0) setSlotStack(area, idx, null);
  }
  updateCursor();
  renderGUI();
  renderHotbar();
}
function handleShiftClick(area, idx){
  const item = getSlotStack(area, idx);
  if (!item) return;
  let targets;
  if (area === 'chest') targets = [inv.hotbar, inv.main];
  else if (area === 'main' || area === 'hotbar' || area === 'craft') targets = activeBE ? [activeBE.items] : [];
  else if (area === 'furnace-input' || area === 'furnace-fuel') targets = [inv.hotbar, inv.main];
  else targets = [];

  let remaining = item.n;
  for (const t of targets){
    if (remaining <= 0) break;
    const ms = maxStack(item.id);
    for (let i=0;i<t.length;i++){
      if (remaining <= 0) break;
      const s = t[i];
      if (s && s.id === item.id && s.dur === undefined && item.dur === undefined){
        const add = Math.min(remaining, ms - s.n);
        s.n += add; remaining -= add;
      }
    }
    for (let i=0;i<t.length;i++){
      if (remaining <= 0) break;
      if (!t[i]){
        const add = Math.min(remaining, ms);
        const ns = { id: item.id, n: add };
        if (item.dur !== undefined) ns.dur = item.dur;
        t[i] = ns;
        remaining -= add;
      }
    }
  }
  if (remaining < item.n){
    if (remaining <= 0) setSlotStack(area, idx, null);
    else item.n = remaining;
    Audio2D.pickup();
  }
  updateCursor();
  renderGUI();
  renderHotbar();
}
function handleResultClick(){
  const res = getCraftResult();
  if (!res) return;
  // Consume ingredients
  for (let i=0;i<craftGrid.length;i++){
    if (craftGrid[i]){
      craftGrid[i].n--;
      if (craftGrid[i].n <= 0) craftGrid[i] = null;
    }
  }
  if (cursorStack && cursorStack.id === res.id){
    cursorStack.n += res.n;
  } else if (!cursorStack){
    cursorStack = res;
  } else {
    addItem(res.id, res.n);
  }
  Audio2D.craft();
  updateCursor();
  renderGUI();
  renderHotbar();
}

/* ============ FURNACE TICK ============ */
const SMELT = {
  'iron_ore': { out:'iron_ingot', time:200 },
  'gold_ore': { out:'gold_ingot', time:200 },
  'block_'+T.SAND: { out:'block_'+T.GLASS, time:200 },
  'block_'+T.COBBLE: { out:'block_'+T.STONE, time:200 },
  'block_'+T.COAL_ORE: { out:'coal', time:200 }
};
const FUEL = { 'coal':1600, 'block_'+T.LOG:300, 'block_'+T.PLANK:300, 'stick':100 };

function tickFurnaces(dt){
  const ticks = dt * 20;
  for (const be of blockEntities.values()){
    if (be.type !== 'furnace') continue;
    const recipe = be.input ? SMELT[be.input.id] : null;
    const canCook = recipe && (!be.output || (be.output.id === recipe.out && be.output.n < 64));
    if (be.burnTime > 0) be.burnTime = Math.max(0, be.burnTime - ticks);
    if (be.burnTime <= 0 && canCook && be.fuel && FUEL[be.fuel.id]){
      be.maxBurnTime = FUEL[be.fuel.id];
      be.burnTime = be.maxBurnTime;
      be.fuel.n--;
      if (be.fuel.n <= 0) be.fuel = null;
    }
    if (be.burnTime > 0 && canCook){
      be.cookTime += ticks;
      if (be.cookTime >= recipe.time){
        be.cookTime = 0;
        be.input.n--;
        if (be.input.n <= 0) be.input = null;
        if (be.output) be.output.n++;
        else be.output = { id: recipe.out, n: 1 };
      }
    } else {
      be.cookTime = Math.max(0, be.cookTime - ticks * 2);
    }
    const lit = be.burnTime > 0;
    if (lit !== be.lit) be.lit = lit;
  }
}

/* ============ MAIN LOOP ============ */
let lastT = performance.now();
function loop(now){
  try {
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    if (gameStarted && !guiOpen){
      updatePlayer(dt);
      updateMining(dt);
      updateMobs(dt);
      updateDayNight(dt);
      tickFurnaces(dt);
    }
    updateCam();
    render();
    renderHearts();

    if (guiMode === 'furnace' && guiOpen && Math.random() < dt * 1.2){
      renderGUI();
    }
  } catch(e){ console.error(e); }
  requestAnimationFrame(loop);
}

/* ============ INIT ============ */
initInv();
generateWorld();
computeLight();
renderHotbar();
renderHearts();
// Set player near center on grass
for (let r=0;r<30;r++){
  const cx = WORLD_W/2 + r, cy = WORLD_H/2;
  if (wGet(cx,cy) === T.GRASS){ player.x = cx*TILE + TILE/2; player.y = cy*TILE + TILE/2; break; }
}
cam.x = player.x - VW/2;
cam.y = player.y - VH/2;

// Seed some crafting stations
(function seed(){
  const px = Math.floor(player.x/TILE), py = Math.floor(player.y/TILE);
  for (let i=0;i<6;i++){
    const cx = px + 3 + i, cy = py;
    if (wGet(cx,cy) === T.GRASS){
      wSet(cx,cy, i === 0 ? T.CRAFTING : i === 1 ? T.FURNACE : i === 2 ? T.CHEST : i === 3 ? T.TORCH : T.COBBLE);
      if (i === 1){ const be = getBE(cx,cy,true); if (be){ be.input = { id:'iron_ore', n:5 }; be.fuel = { id:'coal', n:3 }; } }
      if (i === 2){ const be = getBE(cx,cy,true); if (be){ be.items[0] = { id:'apple', n:5 }; be.items[1] = { id:'coal', n:10 }; } }
    }
  }
  computeLight();
})();

const ovEl = document.getElementById('overlay');
ovEl.addEventListener('click', () => {
  Audio2D.init();
  ovEl.classList.add('hidden');
  gameStarted = true;
});
document.getElementById('ovtext').textContent = isTouch ? 'Chạm để vào game' : 'Nhấn để vào game';
requestAnimationFrame(loop);
</script>
