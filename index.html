<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>2D Player Game</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #10131a;
        font-family: Arial, sans-serif;
    }

    #game {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #151a24;
        image-rendering: pixelated;
        touch-action: none;
    }

    /* =========================
       MOBILE CONTROLS
       ========================= */

    #controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
    }

    .button {
        position: absolute;
        width: 72px;
        height: 72px;

        border-radius: 50%;
        border: 2px solid rgba(255,255,255,.25);

        background: rgba(30, 35, 50, .65);
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 28px;
        font-weight: bold;

        pointer-events: auto;
        touch-action: none;

        box-shadow:
            0 5px 15px rgba(0,0,0,.35),
            inset 0 0 10px rgba(255,255,255,.05);
    }

    .button:active,
    .button.active {
        transform: scale(.92);
        background: rgba(60, 75, 110, .9);
    }

    #left {
        left: 25px;
        bottom: 35px;
    }

    #right {
        left: 110px;
        bottom: 35px;
    }

    #jump {
        right: 120px;
        bottom: 35px;
    }

    #attack {
        right: 30px;
        bottom: 35px;

        width: 82px;
        height: 82px;

        background: rgba(40, 50, 90, .75);
    }

    #info {
        position: fixed;
        left: 50%;
        top: 15px;

        transform: translateX(-50%);

        color: white;
        font-size: 14px;

        padding: 8px 14px;
        border-radius: 10px;

        background: rgba(0,0,0,.4);
        pointer-events: none;

        text-align: center;
    }

    @media (min-width: 900px) {
        .button {
            opacity: .45;
        }

        #info {
            font-size: 15px;
        }
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="info">
    A / D hoặc ← / → để di chuyển · W / Space để nhảy · J để đánh
</div>

<div id="controls">

    <div class="button" id="left">
        ←
    </div>

    <div class="button" id="right">
        →
    </div>

    <div class="button" id="jump">
        ↑
    </div>

    <div class="button" id="attack">
        ⚔
    </div>

</div>

<script>
/* =========================================================
   CANVAS
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

let W = 0;
let H = 0;

function resize() {
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    W = window.innerWidth;
    H = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   PLAYER SPRITESHEET
   ========================================================= */

const playerImage = new Image();

/*
    assets/player.png

    1536 x 1024

    8 columns
    5 rows

    Frame:
    1536 / 8 = 192
    1024 / 5 ≈ 204.8

    Dùng frame 192 x 205.
*/

playerImage.src = "assets/player.png";

const FRAME_W = 192;
const FRAME_H = 205;


/* =========================================================
   ANIMATION
   ========================================================= */

/*
    Sprite sheet:

    ROW 0 = IDLE
    ROW 1 = RUN
    ROW 2 = JUMP / AIR
    ROW 3 = ATTACK
    ROW 4 = FALL / DOWN
*/

const animations = {

    idle: {
        row: 0,
        frames: 7,
        speed: 130
    },

    run: {
        row: 1,
        frames: 8,
        speed: 85
    },

    jump: {
        row: 2,
        frames: 8,
        speed: 90
    },

    attack: {
        row: 3,
        frames: 8,
        speed: 70
    },

    fall: {
        row: 4,
        frames: 8,
        speed: 110
    }

};


/* =========================================================
   PLAYER
   ========================================================= */

const player = {

    x: 500,
    y: 350,

    width: 80,
    height: 110,

    velocityX: 0,
    velocityY: 0,

    speed: 5.5,

    jumpPower: 13,

    gravity: 0.65,

    grounded: false,

    facing: 1,

    animation: "idle",

    frame: 0,

    frameTimer: 0,

    attacking: false,

    attackTimer: 0,

    attackDuration: 560
};


/* =========================================================
   WORLD
   ========================================================= */

const world = {

    width: 5000,

    groundY: 650
};


/* =========================================================
   CAMERA
   ========================================================= */

const camera = {

    x: 0,
    y: 0
};


/* =========================================================
   INPUT
   ========================================================= */

const keys = {};

window.addEventListener("keydown", e => {

    keys[e.code] = true;

    if (
        e.code === "ArrowLeft" ||
        e.code === "ArrowRight" ||
        e.code === "ArrowUp" ||
        e.code === "Space"
    ) {
        e.preventDefault();
    }

    if (
        e.code === "Space" ||
        e.code === "KeyW" ||
        e.code === "ArrowUp"
    ) {
        jump();
    }

    if (e.code === "KeyJ" || e.code === "KeyK") {
        attack();
    }
});


window.addEventListener("keyup", e => {
    keys[e.code] = false;
});


/* =========================================================
   TOUCH INPUT
   ========================================================= */

function setupButton(id, down, up) {

    const button = document.getElementById(id);

    button.addEventListener("pointerdown", e => {

        e.preventDefault();

        button.classList.add("active");

        down();

    });

    button.addEventListener("pointerup", e => {

        e.preventDefault();

        button.classList.remove("active");

        up();

    });

    button.addEventListener("pointercancel", () => {

        button.classList.remove("active");

        up();

    });

    button.addEventListener("pointerleave", () => {

        button.classList.remove("active");

        up();

    });
}


setupButton(
    "left",
    () => keys["TouchLeft"] = true,
    () => keys["TouchLeft"] = false
);


setupButton(
    "right",
    () => keys["TouchRight"] = true,
    () => keys["TouchRight"] = false
);


setupButton(
    "jump",
    () => jump(),
    () => {}
);


setupButton(
    "attack",
    () => attack(),
    () => {}
);


/* =========================================================
   JUMP
   ========================================================= */

function jump() {

    if (!player.grounded) {
        return;
    }

    player.velocityY = -player.jumpPower;

    player.grounded = false;
}


/* =========================================================
   ATTACK
   ========================================================= */

function attack() {

    if (player.attacking) {
        return;
    }

    player.attacking = true;

    player.attackTimer = 0;

    player.frame = 0;

    player.frameTimer = 0;

    player.animation = "attack";
}


/* =========================================================
   UPDATE PLAYER
   ========================================================= */

function updatePlayer(delta) {

    let moving = false;


    /* -------------------------
       LEFT
       ------------------------- */

    if (
        keys["ArrowLeft"] ||
        keys["KeyA"] ||
        keys["TouchLeft"]
    ) {

        player.velocityX = -player.speed;

        player.facing = -1;

        moving = true;
    }


    /* -------------------------
       RIGHT
       ------------------------- */

    if (
        keys["ArrowRight"] ||
        keys["KeyD"] ||
        keys["TouchRight"]
    ) {

        player.velocityX = player.speed;

        player.facing = 1;

        moving = true;
    }


    /* -------------------------
       STOP
       ------------------------- */

    if (!moving) {

        player.velocityX *= 0.75;

        if (Math.abs(player.velocityX) < 0.1) {
            player.velocityX = 0;
        }
    }


    /* -------------------------
       POSITION
       ------------------------- */

    player.x += player.velocityX;


    /* -------------------------
       GRAVITY
       ------------------------- */

    player.velocityY += player.gravity;

    player.y += player.velocityY;


    /* -------------------------
       GROUND
       ------------------------- */

    const playerBottom =
        player.y + player.height / 2;

    if (playerBottom >= world.groundY) {

        player.y =
            world.groundY -
            player.height / 2;

        player.velocityY = 0;

        player.grounded = true;

    } else {

        player.grounded = false;
    }


    /* -------------------------
       WORLD LIMIT
       ------------------------- */

    if (player.x < 50) {
        player.x = 50;
    }

    if (player.x > world.width - 50) {
        player.x = world.width - 50;
    }


    /* -------------------------
       ATTACK
       ------------------------- */

    if (player.attacking) {

        player.attackTimer += delta;

        if (
            player.attackTimer >=
            player.attackDuration
        ) {

            player.attacking = false;

            player.animation = "idle";

            player.frame = 0;

            player.frameTimer = 0;
        }

        return;
    }


    /* -------------------------
       ANIMATION
       ------------------------- */

    if (!player.grounded) {

        player.animation = "jump";

    } else if (moving) {

        player.animation = "run";

    } else {

        player.animation = "idle";
    }
}


/* =========================================================
   UPDATE ANIMATION
   ========================================================= */

function updateAnimation(delta) {

    const anim =
        animations[player.animation];

    if (!anim) {
        return;
    }

    player.frameTimer += delta;

    if (
        player.frameTimer >=
        anim.speed
    ) {

        player.frameTimer = 0;

        player.frame++;

        if (
            player.frame >=
            anim.frames
        ) {

            player.frame = 0;
        }
    }
}


/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground() {

    /* Sky */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#111827"
    );

    gradient.addColorStop(
        1,
        "#273449"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Moon */

    ctx.fillStyle =
        "rgba(255,255,255,.15)";

    ctx.beginPath();

    ctx.arc(
        W - 120,
        100,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Mountains */

    ctx.fillStyle =
        "#18202d";

    for (
        let x = -camera.x % 500 - 500;
        x < W + 500;
        x += 500
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            world.groundY
        );

        ctx.lineTo(
            x + 250,
            350
        );

        ctx.lineTo(
            x + 500,
            world.groundY
        );

        ctx.closePath();

        ctx.fill();
    }
}


/* =========================================================
   DRAW GROUND
   ========================================================= */

function drawWorld() {

    const groundScreenY =
        world.groundY -
        camera.y;


    /* Ground */

    ctx.fillStyle =
        "#151a20";

    ctx.fillRect(
        0,
        groundScreenY,
        W,
        H - groundScreenY
    );


    /* Ground top */

    ctx.fillStyle =
        "#384553";

    ctx.fillRect(
        0,
        groundScreenY,
        W,
        8
    );


    /* Grid */

    ctx.strokeStyle =
        "rgba(255,255,255,.04)";

    ctx.lineWidth = 1;


    const gridSize = 64;


    for (
        let x =
            -camera.x %
            gridSize;

        x < W;

        x += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            groundScreenY
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }


    for (
        let y =
            groundScreenY %
            gridSize;

        y < H;

        y += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }


    /* Simple platforms */

    drawPlatform(
        350,
        world.groundY - 130,
        300,
        20
    );

    drawPlatform(
        1050,
        world.groundY - 190,
        300,
        20
    );

    drawPlatform(
        1750,
        world.groundY - 140,
        350,
        20
    );

    drawPlatform(
        2800,
        world.groundY - 200,
        350,
        20
    );
}


function drawPlatform(x, y, width, height) {

    const sx =
        x - camera.x;

    const sy =
        y - camera.y;


    ctx.fillStyle =
        "#303b48";

    ctx.fillRect(
        sx,
        sy,
        width,
        height
    );


    ctx.fillStyle =
        "#586879";

    ctx.fillRect(
        sx,
        sy,
        width,
        5
    );
}


/* =========================================================
   DRAW PLAYER
   ========================================================= */

function drawPlayer() {

    if (!playerImage.complete) {
        return;
    }


    const anim =
        animations[player.animation];


    const sourceX =
        player.frame *
        FRAME_W;


    const sourceY =
        anim.row *
        FRAME_H;


    const screenX =
        player.x -
        camera.x;


    const screenY =
        player.y -
        camera.y;


    /*
        Sprite được vẽ lớn hơn frame gốc
        để nhân vật dễ nhìn.
    */

    const drawWidth = 150;
    const drawHeight = 160;


    ctx.save();


    /*
        Flip nhân vật khi quay trái.
    */

    if (player.facing === -1) {

        ctx.translate(
            screenX,
            screenY
        );

        ctx.scale(-1, 1);

        ctx.translate(
            -screenX,
            -screenY
        );
    }


    /*
        Bóng nhân vật
    */

    ctx.save();

    ctx.globalAlpha = .25;

    ctx.fillStyle = "#000";

    ctx.beginPath();

    ctx.ellipse(
        screenX,
        world.groundY - camera.y + 3,
        45,
        12,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();


    /*
        Vẽ frame sprite
    */

    ctx.drawImage(

        playerImage,

        sourceX,
        sourceY,

        FRAME_W,
        FRAME_H,

        screenX - drawWidth / 2,
        screenY - drawHeight / 2 - 10,

        drawWidth,
        drawHeight
    );


    /*
        Hitbox debug có thể bật nếu cần.
    */

    ctx.restore();


    /*
        Thanh trạng thái nhỏ trên player
    */

    if (player.attacking) {

        ctx.fillStyle =
            "rgba(80,160,255,.8)";

        ctx.fillRect(
            screenX - 35,
            screenY - 95,
            70,
            4
        );
    }
}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera() {

    const targetX =
        player.x -
        W / 2;


    camera.x +=
        (targetX - camera.x) *
        0.12;


    if (camera.x < 0) {
        camera.x = 0;
    }


    const maxCamera =
        world.width - W;

    if (camera.x > maxCamera) {

        camera.x =
            Math.max(
                0,
                maxCamera
            );
    }
}


/* =========================================================
   HUD
   ========================================================= */

function drawHUD() {

    ctx.save();

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fillRect(
        15,
        15,
        150,
        50
    );


    ctx.fillStyle =
        "white";

    ctx.font =
        "14px Arial";

    ctx.fillText(
        "2D GAME",
        28,
        37
    );

    ctx.fillText(
        "X: " +
        Math.floor(player.x),
        28,
        56
    );


    ctx.restore();
}


/* =========================================================
   GAME LOOP
   ========================================================= */

let lastTime = 0;


function gameLoop(time) {

    const delta =
        Math.min(
            time - lastTime,
            50
        );

    lastTime = time;


    /* UPDATE */

    updatePlayer(delta);

    updateAnimation(delta);

    updateCamera();


    /* DRAW */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();

    drawWorld();

    drawPlayer();

    drawHUD();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   START
   ========================================================= */

playerImage.onload = () => {

    requestAnimationFrame(
        gameLoop
    );
};


playerImage.onerror = () => {

    console.error(
        "Không tìm thấy assets/player.png"
    );

    alert(
        "Không tìm thấy assets/player.png"
    );
};
</script>

</body>
  </html>
