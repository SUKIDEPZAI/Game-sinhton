<script>
"use strict";
window.addEventListener('error', e => console.error('[ERROR]', e.error || e.message));
window.addEventListener('unhandledrejection', e => console.error('[PROMISE]', e.reason));

const BACKEND = { host:'game-sinhton.onrender.com', port:443, peerPath:'/peerjs/myapp', secure:true };
const buzz = ms => { if (navigator.vibrate) try{ navigator.vibrate(ms||6); }catch(e){} };

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random, SEED = 0;
function initRNG(seed){ SEED = seed>>>0; rng = mulberry32(SEED); }

/* 👶 BABY SIZE */
const DEST_HEIGHT = 55;
const FOOT_OFFSET = 8;

const ATTACK_DURATION = 10 / 16;
const HURT_DURATION = 8 / 8;
const JUMP_DURATION = 0.65;

/* ============================================================
   METADATA v3 DECODER
   ============================================================ */
function decodeMetadata(img){
  try {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = 1;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(img, 0, img.height - 1, img.width, 1, 0, 0, img.width, 1);
    const d = cx.getImageData(0, 0, img.width, 1).data;
    if (d[0] !== 0x44 || d[1] !== 0x48 || d[2] !== 0x55 || d[3] !== 0x4E) return null;
    const len = d[6] | (d[7] << 8) | (d[8] << 16) | (d[9] << 24);
    if (len <= 0 || len > 300000) return null;
    const bytes = [];
    for (let i = 0; i < len; i++){
      const pos = 10 + i;
      const p = Math.floor(pos/3), ch = pos%3;
      if (p*4+ch >= d.length) break;
      bytes.push(d[p*4+ch]);
    }
    return JSON.parse(new TextDecoder().decode(new Uint8Array(bytes)));
  } catch(e){ return null; }
}

/* ============================================================
   AUTO-DETECT
   ============================================================ */
function autoDetectFrameLines(canvas, expectedFrames){
  const W = canvas.width, H = canvas.height;
  const cx = canvas.getContext('2d', { willReadFrequently: true });
  const data = cx.getImageData(0, 0, W, H).data;
  const empty = new Uint8Array(W);
  for (let x = 0; x < W; x++){
    let has = 0;
    for (let y = 0; y < H; y++){
      if (data[(y*W+x)*4+3] > 5){ has = 1; break; }
    }
    empty[x] = has ? 0 : 1;
  }
  const gaps = [];
  let i = 0;
  while (i < W && empty[i]) i++;
  while (i < W){
    while (i < W && !empty[i]) i++;
    const start = i;
    while (i < W && empty[i]) i++;
    const end = i;
    if (end - start >= 2) gaps.push({ start, end, size: end - start });
  }
  const need = expectedFrames ? expectedFrames - 1 : gaps.length;
  let chosen;
  if (expectedFrames && gaps.length >= need){
    const sorted = [...gaps].sort((a,b) => b.size - a.size);
    chosen = sorted.slice(0, need).sort((a,b) => a.start - b.start);
  } else chosen = gaps;
  const lines = [0];
  for (const g of chosen) lines.push(Math.round((g.start + g.end) / 2));
  lines.push(W);
  return lines.length >= 3 ? lines : null;
}
function detectBBox(canvas, x1, y1, x2, y2){
  const W = canvas.width;
  const cx = canvas.getContext('2d', { willReadFrequently: true });
  const d = cx.getImageData(x1, y1, x2-x1, y2-y1).data;
  const w = x2-x1, h = y2-y1;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      if (d[(y*w+x)*4+3] > 10){
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  return { x: x1+minX, y: y1+minY, w: maxX-minX+1, h: maxY-minY+1 };
}

/* ============================================================
   MODEL MANAGER
   ============================================================ */
const Models = {
  data: new Map(),
  addSprite(modelName, animName, sprite){
    if (!this.data.has(modelName)) this.data.set(modelName, { animations: new Map() });
    this.data.get(modelName).animations.set(animName, sprite);
  },
  get(modelName, animName){
    const m = this.data.get(modelName);
    if (!m) return null;
    return m.animations.get(animName) || null;
  }
};

/* ============================================================
   LOAD PROJECT
   ============================================================ */
async function loadProject(){
  try {
    const res = await fetch('sprites.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('sprites.json not found');
    const project = await res.json();
    if (project.format !== 'dh-studio-project' || !project.models){
      throw new Error('Invalid format');
    }
    const promises = [];
    for (const modelName in project.models){
      const model = project.models[modelName];
      for (const animName in model.animations){
        const cfg = model.animations[animName];
        const src = `assets/${cfg.fileName}.png`;
        promises.push(loadSprite(src, modelName, animName, cfg));
      }
    }
    await Promise.all(promises);
    console.log('✓ Project loaded: ' + Models.data.size + ' models');
    updateLoadStatus('ok');
  } catch(e){
    console.warn('Fallback:', e.message);
    await loadFallbackSprites();
  }
}

function loadSprite(src, modelName, animName, cfg){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const meta = decodeMetadata(img);
      let spriteH, vLines, anchors, stableAnchor, anchorMode, fps, loop, hasMeta = false;

      if (meta && meta.vLines && meta.vLines.length >= 2){
        spriteH = meta.spriteH || (img.height - 1);
        vLines = meta.vLines;
        anchors = meta.anchors ? meta.anchors.map(a =>
          Array.isArray(a) ? { x: a[0], y: a[1] } : (a ? { x: a.x, y: a.y } : null)
        ) : [];
        stableAnchor = meta.stableAnchor
          ? { x: meta.stableAnchor[0], y: meta.stableAnchor[1] }
          : null;
        anchorMode = meta.anchorMode || 'stable-x';
        fps = meta.fps || cfg.fps || 10;
        loop = meta.loop !== undefined ? meta.loop : (cfg.loop !== false);
        hasMeta = true;
      } else {
        spriteH = cfg.spriteH || img.height;
        vLines = cfg.vLines && cfg.vLines.length >= 2 ? cfg.vLines : null;
        anchors = (cfg.anchors || []).map(a =>
          Array.isArray(a) ? { x: a[0], y: a[1] } : (a ? { x: a.x, y: a.y } : null)
        );
        stableAnchor = cfg.stableAnchor
          ? { x: cfg.stableAnchor[0], y: cfg.stableAnchor[1] }
          : null;
        anchorMode = cfg.anchorMode || 'stable-x';
        fps = cfg.fps || 10;
        loop = cfg.loop !== false;
      }

      const cnv = document.createElement('canvas');
      cnv.width = img.width;
      cnv.height = spriteH;
      const cc = cnv.getContext('2d', { willReadFrequently: true });
      cc.imageSmoothingEnabled = false;
      cc.drawImage(img, 0, 0, img.width, spriteH, 0, 0, img.width, spriteH);

      if (!vLines || vLines.length < 3){
        let detected = autoDetectFrameLines(cnv, null);
        if (!detected || detected.length < 3){
          const n = cfg.frames || 10;
          detected = autoDetectFrameLines(cnv, n);
        }
        if (detected && detected.length >= 3){
          vLines = detected;
        } else {
          const n = cfg.frames || 1;
          vLines = [0];
          for (let i = 1; i < n; i++) vLines.push(Math.round(i * img.width / n));
          vLines.push(img.width);
        }
      }

      const sprite = {
        model: modelName, anim: animName,
        renderImg: cnv, canvas: cnv,
        spriteH, vLines,
        hLines: [0, spriteH],
        anchors, stableAnchor, anchorMode,
        fps, loop,
        frames: vLines.length - 1, hasMeta
      };

      if (!anchors.length || anchors.every(a => !a) || !stableAnchor){
        autoComputeAnchors(sprite);
      }

      Models.addSprite(modelName, animName, sprite);
      console.log(`  ✓ ${modelName}/${animName}: ${sprite.frames}f @ ${fps}fps [${anchorMode}] ${hasMeta ? '[meta]' : '[auto]'}`);
      resolve();
    };
    img.onerror = () => { console.warn(`  ✗ ${src} not found`); resolve(); };
    img.src = src;
  });
}

function autoComputeAnchors(sprite){
  const s = sprite;
  s.anchors = [];
  for (let i = 0; i < s.frames; i++){
    const bbox = detectBBox(s.canvas, s.vLines[i], 0, s.vLines[i+1], s.spriteH);
    if (bbox){
      s.anchors.push({
        x: bbox.x + bbox.w / 2,
        y: bbox.y + bbox.h
      });
    } else s.anchors.push(null);
  }
  let sumLocalX = 0, sumY = 0, count = 0;
  for (let i = 0; i < s.anchors.length; i++){
    if (!s.anchors[i]) continue;
    sumLocalX += s.anchors[i].x - s.vLines[i];
    sumY += s.anchors[i].y;
    count++;
  }
  if (count > 0){
    s.stableAnchor = { x: Math.round(sumLocalX/count), y: Math.round(sumY/count) };
  } else {
    s.stableAnchor = null;
  }
  if (!s.anchorMode) s.anchorMode = 'stable-x';
}

async function loadFallbackSprites(){
  const defaults = [
    { model: 'player', anim: 'idle', file: 'player_idle' },
    { model: 'player', anim: 'run', file: 'player_run' },
    { model: 'player', anim: 'jump', file: 'player_jump' },
    { model: 'player', anim: 'attack', file: 'player_attack' },
    { model: 'player', anim: 'sit', file: 'player_sit' },
    { model: 'player', anim: 'hurt', file: 'player_death' }
  ];
  const promises = defaults.map(d => loadSprite(
    `assets/${d.file}.png`, d.model, d.anim,
    { fileName: d.file, fps: 10, loop: true, vLines: null, anchors: [], spriteH: 0, frames: 10 }
  ));
  await Promise.all(promises);
  updateLoadStatus('fallback');
}

function updateLoadStatus(mode){
  const el = document.getElementById('loadStatus');
  const total = Models.data.size;
  if (total === 0){
    el.classList.remove('hidden');
    el.innerHTML = `<b><span class="err">⚠ KHÔNG LOAD ĐƯỢC SPRITE</span></b>`;
    return;
  }
  el.classList.remove('hidden');
  let html = `<b><span class="ok">✓ Đã load ${total} models</span></b>`;
  if (mode === 'fallback') html += ` <span class="meta">[fallback]</span>`;
  html += '<br>';
  for (const [modelName, model] of Models.data){
    html += `📦 ${modelName}: ` + [...model.animations.keys()].join(', ');
    html += '<br>';
  }
  el.innerHTML = html;
  setTimeout(() => el.classList.add('hidden'), 6000);
}

function getPlayerSprite(anim){
  let s = Models.get('player', anim);
  if (!s && anim !== 'idle') s = Models.get('player', 'idle');
  if (!s){
    for (const [mn, m] of Models.data){
      s = m.animations.get(anim) || m.animations.get('idle');
      if (s) break;
    }
  }
  return s;
}

/* ============================================================
   AUDIO
   ============================================================ */
const Audio2D = (() => {
  let ctx = null, enabled = true;
  let masterGain, musicGain, sfxGain, noiseBuf = null;
  let musicPlaying = false, currentDayPhase = -1;
  function init(){
    if (ctx){ if (ctx.state==='suspended') ctx.resume(); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain(); musicGain = ctx.createGain(); sfxGain = ctx.createGain();
      musicGain.connect(masterGain); sfxGain.connect(masterGain); masterGain.connect(ctx.destination);
      masterGain.gain.value=0.7; musicGain.gain.value=0.35; sfxGain.gain.value=0.8;
      const len = Math.floor(ctx.sampleRate*2);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    } catch(e){ enabled = false; }
  }
  function noise(dur, ftype, freq, gain, q){
    if (!enabled) return; init(); if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type=ftype||'lowpass';
    f.frequency.value=freq||1000; if (q) f.Q.value=q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain||0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start(t); src.stop(t+dur+0.02);
  }
  function tone(freq, dur, gain, type, freqEnd){
    if (!enabled) return; init(); if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type=type||'sine';
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd!==undefined) o.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd), t+dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain||0.3, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(sfxGain);
    o.start(t); o.stop(t+dur+0.02);
  }
  function startMusic(){
    if (!enabled) return; init(); if (!ctx || musicPlaying) return;
    musicPlaying = true; playMusicNotes();
  }
  function playMusicNotes(){
    if (!musicPlaying || !enabled || !ctx) return;
    const isNight = currentDayPhase === 1;
    const scale = isNight ? [220,261.63,293.66,329.63,392,440] : [261.63,293.66,329.63,392,440,523.25];
    const root = isNight ? 110 : 130.81;
    const t = ctx.currentTime;
    const o1 = ctx.createOscillator(); o1.type='triangle'; o1.frequency.value=root;
    const g1 = ctx.createGain();
    g1.gain.setValueAtTime(0, t);
    g1.gain.linearRampToValueAtTime(0.06, t+1.5);
    g1.gain.linearRampToValueAtTime(0, t+5);
    o1.connect(g1); g1.connect(musicGain);
    o1.start(t); o1.stop(t+5.2);
    const n = 2 + Math.floor(Math.random()*3);
    for (let i=0;i<n;i++){
      const delay = Math.random()*3;
      const freq = scale[Math.floor(Math.random()*scale.length)];
      const dur = 1.2 + Math.random()*1.8;
      setTimeout(() => {
        if (!musicPlaying || !enabled || !ctx) return;
        const tt = ctx.currentTime;
        const o = ctx.createOscillator();
        o.type = currentDayPhase === 1 ? 'sine' : 'triangle';
        o.frequency.value = freq;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, tt);
        g.gain.linearRampToValueAtTime(0.045, tt+0.15);
        g.gain.exponentialRampToValueAtTime(0.0001, tt+dur);
        o.connect(g); g.connect(musicGain);
        o.start(tt); o.stop(tt+dur+0.05);
      }, delay*1000);
    }
    setTimeout(() => playMusicNotes(), 4500 + Math.random()*2000);
  }
  function setNight(isNight){
    const phase = isNight ? 1 : 0;
    if (phase === currentDayPhase) return;
    currentDayPhase = phase;
  }
  const sfx = {
    step(){ noise(0.05,'bandpass',400+Math.random()*200,0.08,1.5); },
    swordHit(){ noise(0.08,'bandpass',1800,0.20,3); tone(900,0.08,0.15,'square',400); },
    swordSwing(){ noise(0.10,'highpass',2400,0.10,2); },
    jump(){ tone(440,0.10,0.10,'sine',800); },
    hurt(){ tone(280,0.14,0.22,'sawtooth',140); noise(0.10,'lowpass',500,0.12); },
    kill(){ tone(180,0.4,0.3,'sawtooth',60); setTimeout(()=>tone(140,0.3,0.2,'square',50),100); },
    click(){ tone(1200,0.02,0.08,'square'); }
  };
  return {
    init, setNight, startMusic,
    setMasterVolume: v => { init(); if (masterGain) masterGain.gain.value = Math.max(0,Math.min(1,v)); },
    setMusicVolume: v => { init(); if (musicGain) musicGain.gain.value = Math.max(0,Math.min(1,v)); },
    setSfxVolume: v => { init(); if (sfxGain) sfxGain.gain.value = Math.max(0,Math.min(1,v)); },
    sfx
  };
})();

const joy = { id:null, x:0, y:0, cx:0, cy:0 };
const moveJoystick = document.getElementById('moveJoystick');
const moveKnob = document.getElementById('moveKnob');

moveJoystick.addEventListener('pointerdown', e => {
  if (joy.id !== null) return;
  e.preventDefault();
  joy.id = e.pointerId;
  const r = moveJoystick.getBoundingClientRect();
  joy.cx = r.left + r.width/2;
  joy.cy = r.top + r.height/2;
  updateMoveJoystick(e.clientX, e.clientY);
  try { moveJoystick.setPointerCapture(e.pointerId); } catch(err){}
});

function updateMoveJoystick(cx, cy){
  let dx = cx - joy.cx, dy = cy - joy.cy;
  const max = 52;
  const d = Math.hypot(dx, dy);
  if (d > max){ dx = dx/d*max; dy = dy/d*max; }
  joy.x = dx/max;
  joy.y = dy/max;
  moveKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function endMoveJoystick(e){
  if (e.pointerId !== joy.id) return;
  joy.id = null;
  joy.x = 0;
  joy.y = 0;
  moveKnob.style.transform = 'translate(-50%,-50%)';
}

addEventListener('pointermove', e => {
  if (e.pointerId === joy.id){
    e.preventDefault();
    updateMoveJoystick(e.clientX, e.clientY);
  }
}, { passive:false });
addEventListener('pointerup', endMoveJoystick);
addEventListener('pointercancel', endMoveJoystick);

/* ============================================================
   ACTIONS
   ============================================================ */
function tryJump(){
  if (!gameStarted || paused) return;
  if (player.jumpT > 0) return;
  player.sitting = false;
  player.jumpT = JUMP_DURATION;
  Audio2D.sfx.jump();
}
function trySit(){
  if (!gameStarted || paused) return;
  if (player.jumpT > 0) return;
  if (player.attackT > 0) return;
  player.sitting = !player.sitting;
  Audio2D.sfx.click();
}
let lastAttackT = 0;
function tryAttack(){
  if (!gameStarted || paused) return;
  if (player.sitting) player.sitting = false;
  const now = performance.now();
  if (now - lastAttackT < ATTACK_DURATION * 1000) return;
  lastAttackT = now;
  player.attackT = ATTACK_DURATION;
  Audio2D.sfx.swordSwing();
  if (!net.active) return;
  const hitX = player.x + Math.cos(aim.angle) * 50;
  const hitY = player.y + Math.sin(aim.angle) * 50;
  const range = 72;
  let target = null, minD = range;
  for (const [id, p] of net.players){
    const d = Math.hypot(p.x - hitX, p.y - hitY);
    if (d < minD){ minD = d; target = { id, p }; }
  }
  if (target){
    const held = inv.hotbar[player.selected];
    const heldDef = held ? defOf(held.id) : null;
    const dmg = (heldDef && heldDef.tool === 'sword') ? (heldDef.dmg || 1) : 1;
    net.send({ t:'hit', target: target.id, from: net.myId, fromName: net.name, dmg });
    burstHitVisual(target.p.x, target.p.y);
    Audio2D.sfx.swordHit();
    toast(`⚔️ Đánh ${target.p.name} -${dmg} HP`);
  }
}
function burstHitVisual(x, y){
  for (let i=0;i<10;i++){
    const a = Math.random()*Math.PI*2;
    const s = 60 + Math.random()*100;
    G.particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 0.3+Math.random()*0.2, maxLife: 0.5,
      color: Math.random()<0.6?'#ff4040':'#ffcc40', size: 2+Math.random()*3 });
  }
}

/* ============================================================
   UPDATE PLAYER
   ============================================================ */
function updatePlayer(dt){
  let dx = 0, dy = 0;
  if (joy.id !== null && Math.hypot(joy.x, joy.y) > 0.15){ dx = joy.x; dy = joy.y; }
  else {
    if (keys['KeyA']||keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD']||keys['ArrowRight']) dx += 1;
    if (keys['KeyW']||keys['ArrowUp']) dy -= 1;
    if (keys['KeyS']||keys['ArrowDown']) dy += 1;
  }
  const mag = Math.hypot(dx, dy);
  if (mag > 1){ dx /= mag; dy /= mag; }
  if (player.sitting && mag > 0.15) player.sitting = false;
  if (player.sitting){ dx = 0; dy = 0; }

  if (aim.joyId !== null){
    /* Mobile: dùng joystick aim */
  } else {
    /* PC: mũi tên xoay theo chuột */
    const wx = mouse.x + cam.x;
    const wy = mouse.y + cam.y;
    aim.angle = Math.atan2(wy - player.y, wx - player.x);
  }
  const cosA = Math.cos(aim.angle);
  if (Math.abs(cosA) > 0.15) player.facing = cosA > 0 ? 1 : -1;

  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  const nr = player.radius;
  player.x = Math.max(nr, Math.min(WORLD_W*TILE - nr, player.x));
  player.y = Math.max(nr, Math.min(WORLD_H*TILE - nr, player.y));

  player.animT += dt;
  if (player.attackT > 0) player.attackT -= dt;
  if (player.hurtT > 0) player.hurtT -= dt;
  if (player.jumpT > 0){
    player.jumpT = Math.max(0, player.jumpT - dt);
    const prog = 1 - player.jumpT / JUMP_DURATION;
    player.jumpY = -Math.sin(prog * Math.PI) * 24;
  } else player.jumpY = 0;

  if (aim.autoAttack && player.attackT <= 0) tryAttack();
  if (attackTouch && player.attackT <= 0) tryAttack();

  let target = 'idle';
  if (player.attackT > 0)     target = 'attack';
  else if (player.hurtT > 0)  target = 'hurt';
  else if (player.jumpT > 0)  target = 'jump';
  else if (player.sitting)    target = 'sit';
  else if (mag > 0.1)         target = 'run';
  if (target !== player.currentAnim){
    player.currentAnim = target;
    player.animTime = 0;
  }
  player.animTime += dt;

  if (mag > 0.1){
    player._stepAcc += player.speed*dt;
    if (player._stepAcc > 26){ player._stepAcc = 0; Audio2D.sfx.step(); }
  } else player._stepAcc = 0;
}
function respawnPlayer(){
  player.hp = player.maxHp;
  toast('💀 Bạn đã bị hạ. Hồi sinh!');
  player.x = WORLD_W*TILE/2; player.y = WORLD_H*TILE/2;
  player.jumpT = 0; player.jumpY = 0;
  player.attackT = 0; player.hurtT = 0;
  player.sitting = false;
  cam.x = player.x - VW/2; cam.y = player.y - VH/2;
  if (net.active) net.broadcastPos();
  updateHpBar();
}

/* ============================================================
   NETWORK
   ============================================================ */
const PEER_OPTS = {
  host: BACKEND.host, port: BACKEND.port, path: BACKEND.peerPath,
  secure: BACKEND.secure, debug: 0,
  config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]}
};
const net = {
  active: false, mode: null, peer: null, hostConn: null,
  clients: new Map(), myId: null, name: 'Hunter', roomCode: null,
  players: new Map(), onWorldReady: null,
  startHost(name){
    this.name = name || 'Host'; this.mode = 'host'; this.players.clear();
    const code = genRoomCode(); this.roomCode = code;
    return new Promise((resolve, reject) => {
      try { this.peer = new Peer('dragonhunter-' + code, PEER_OPTS); }
      catch(e){ reject(e); return; }
      const timer = setTimeout(() => reject(new Error('Hết thời gian')), 20000);
      this.peer.on('open', id => {
        clearTimeout(timer);
        this.myId = id; this.active = true;
        this.peer.on('connection', conn => this._acceptClient(conn));
        resolve(code);
      });
      this.peer.on('error', e => { clearTimeout(timer); reject(e); });
    });
  },
  startClient(name, code){
    this.name = name || 'Hunter'; this.mode = 'client';
    this.players.clear(); this.roomCode = code;
    return new Promise((resolve, reject) => {
      try { this.peer = new Peer(PEER_OPTS); }
      catch(e){ reject(e); return; }
      const timer = setTimeout(() => reject(new Error('Hết thời gian')), 20000);
      this.peer.on('open', id => {
        this.myId = id;
        const conn = this.peer.connect('dragonhunter-' + code, { reliable: true });
        this.hostConn = conn;
        conn.on('open', () => { clearTimeout(timer); this.active = true; resolve(); });
        conn.on('data', d => this._onData(d, conn));
        conn.on('close', () => { toast('❌ Mất kết nối'); this.disconnect(); if (gameStarted) backToMenu(); });
        conn.on('error', e => { clearTimeout(timer); reject(e); });
      });
      this.peer.on('error', e => {
        clearTimeout(timer);
        if (String(e).includes('is taken')) reject(new Error('Không tìm thấy phòng'));
        else reject(e);
      });
    });
  },
  _acceptClient(conn){
    conn.on('open', () => {
      this.clients.set(conn.peer, conn);
      try {
        conn.send({ t:'world', seed: SEED, data: u8ToB64(world) });
        for (const [id, p] of this.players){
          conn.send({ t:'pos', id, name: p.name, x: p.x, y: p.y, facing: p.facing, hp: p.hp });
        }
        conn.send({ t:'pos', id: this.myId, name: this.name,
                    x: player.x, y: player.y, facing: player.facing, hp: player.hp });
      } catch(e){}
      toast('⚔️ Đối thủ mới!');
      updateNetHud();
    });
    conn.on('data', d => this._onData(d, conn));
    conn.on('close', () => {
      this.clients.delete(conn.peer); this.players.delete(conn.peer);
      toast('👋 Đối thủ rời'); updateNetHud();
    });
  },
  _onData(d, conn){
    if (d.t === 'world'){
      initRNG(d.seed); world.set(b64ToU8(d.data));
      resetPlayerPosition();
      if (this.onWorldReady) this.onWorldReady();
    } else if (d.t === 'pos'){
      this.players.set(d.id, {
        name: d.name, x: d.x, y: d.y, facing: d.facing, hp: d.hp,
        lastSeen: performance.now(), animT: 0
      });
      if (this.mode === 'host' && conn){
        for (const [id, c] of this.clients){
          if (c === conn) continue;
          try { c.send(d); } catch(e){}
        }
      }
      updateNetHud();
    } else if (d.t === 'hit'){
      if (d.target === this.myId){
        player.hp = Math.max(0, player.hp - d.dmg);
        player.hurtT = HURT_DURATION;
        flashDamage(); Audio2D.sfx.hurt(); updateHpBar();
        toast(`⚔️ ${d.fromName} gây ${d.dmg}!`);
        if (player.hp <= 0){ Audio2D.sfx.kill(); respawnPlayer(); }
        else this.broadcastPos();
      }
      if (this.mode === 'host' && conn){
        for (const [id, c] of this.clients){
          if (c === conn) continue;
          try { c.send(d); } catch(e){}
        }
      }
    }
  },
  broadcastPos(){
    if (!this.active) return;
    this.send({ t:'pos', id: this.myId, name: this.name,
                x: player.x, y: player.y, facing: player.facing, hp: player.hp });
  },
  send(msg){
    if (!this.active) return;
    try {
      if (this.mode === 'host'){ for (const c of this.clients.values()) c.send(msg); }
      else if (this.hostConn){ this.hostConn.send(msg); }
    } catch(e){}
  },
  disconnect(){
    this.active = false;
    this.players.clear(); this.clients.clear();
    this.hostConn = null;
    if (this.peer){ try { this.peer.destroy(); } catch(e){} }
    this.peer = null; this.myId = null;
    updateNetHud();
  }
};
function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function u8ToB64(u8){
  let s = ''; const chunk = 0x8000;
  for (let i=0;i<u8.length;i+=chunk) s += String.fromCharCode.apply(null, u8.subarray(i, i+chunk));
  return btoa(s);
}
function b64ToU8(s){
  const bin = atob(s);
  const u8 = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
let netSyncTimer = null;
function startNetSync(){
  if (netSyncTimer) return;
  netSyncTimer = setInterval(() => {
    if (net.active && gameStarted && !paused) net.broadcastPos();
    const now = performance.now();
    for (const [id, p] of net.players) if (now - p.lastSeen > 5000) net.players.delete(id);
    updateNetHud();
  }, 100);
}
function updateNetHud(){
  const el = document.getElementById('netInfo');
  if (!net.active){ el.classList.remove('show'); return; }
  el.classList.add('show');
  document.getElementById('netCode').textContent = net.roomCode || '-----';
  document.getElementById('netCount').textContent = 1 + net.players.size;
}

/* ============================================================
   RENDER
   ============================================================ */
function drawTile(x, y, id, sx, sy){
  const def = TILES[id];
  if (!def) return;
  ctx.fillStyle = def.colors[0]; ctx.fillRect(sx, sy, TILE, TILE);
  const h = (x*73856093 ^ y*19349663) >>> 0;
  ctx.fillStyle = def.colors[2];
  for (let i=0;i<3;i++){
    const hh = (h >> (i*5)) & 0xFF;
    ctx.fillRect(sx + 3 + (hh % (TILE-8)), sy + 4 + ((hh >> 4) % (TILE-10)), 3, 3);
  }
}
function getNightFactor(){
  const t = worldTime * Math.PI * 2;
  return (1 - Math.cos(t)) / 2;
}

/* ============================================================
   DRAW SPRITE — hỗ trợ stable / stable-x / per-frame
   ============================================================ */
function drawSpriteAt(sprite, idx, cx, cy, facing){
  if (!sprite || !sprite.renderImg) return;
  const s = sprite;

  let srcX, srcW;
  if (s.vLines && s.vLines[idx+1] !== undefined){
    srcX = s.vLines[idx];
    srcW = s.vLines[idx+1] - s.vLines[idx];
  } else {
    const fw = s.canvas.width / s.frames;
    srcX = Math.round(idx * fw);
    srcW = Math.round(fw);
  }
  const srcH = s.spriteH;

  const scale = DEST_HEIGHT / srcH;
  const drawW = Math.round(srcW * scale);
  const drawH = Math.round(srcH * scale);

  /* Tính anchorX (local trong frame) và anchorY (tuyệt đối) */
  let anchorX, anchorY;

  if (s.anchorMode === 'stable' && s.stableAnchor){
    anchorX = s.stableAnchor.x;
    anchorY = s.stableAnchor.y;
  } else if (s.anchorMode === 'stable-x' && s.stableAnchor){
    anchorX = s.stableAnchor.x;
    const a = s.anchors && s.anchors[idx];
    anchorY = (a && a.y != null) ? a.y : s.stableAnchor.y;
  } else {
    /* per-frame */
    const a = s.anchors && s.anchors[idx];
    if (a && a.x != null && a.y != null){
      anchorX = a.x - srcX;
      anchorY = a.y;
    } else if (s.stableAnchor){
      anchorX = s.stableAnchor.x;
      anchorY = s.stableAnchor.y;
    } else {
      anchorX = srcW / 2;
      anchorY = srcH;
    }
  }
  anchorY = Math.max(0, Math.min(srcH, anchorY));

  const drawX = Math.round(cx - anchorX * scale);
  const drawY = Math.round(cy - anchorY * scale);

  ctx.save();
  if (facing < 0){
    ctx.translate(cx, 0);
    ctx.scale(-1, 1);
    const flippedLocalX = srcW - anchorX;
    const dX = Math.round(-flippedLocalX * scale);
    ctx.drawImage(s.renderImg, srcX, 0, srcW, srcH, dX, drawY, drawW, drawH);
  } else {
    ctx.drawImage(s.renderImg, srcX, 0, srcW, srcH, drawX, drawY, drawW, drawH);
  }
  ctx.restore();
}

function drawPlayer(){
  const sx = Math.round(player.x - cam.x);
  const syGround = Math.round(player.y - cam.y + FOOT_OFFSET);
  const sySprite = syGround + player.jumpY;

  const shadowScale = 1 - Math.abs(player.jumpY) / 70;
  ctx.fillStyle = `rgba(0,0,0,${0.4 * shadowScale})`;
  ctx.beginPath();
  ctx.ellipse(sx, syGround, 8 * shadowScale, 3 * shadowScale, 0, 0, Math.PI*2);
  ctx.fill();

  const sprite = getPlayerSprite(player.currentAnim);
  if (!sprite){
    drawFallbackBody(sx, sySprite, player.animT, player.currentAnim, player.facing, LOCAL_COLORS);
    return;
  }

  const rawIdx = Math.floor(player.animTime * sprite.fps);
  const total = sprite.frames || (sprite.vLines ? sprite.vLines.length - 1 : 8);
  let idx;
  if (sprite.loop) idx = ((rawIdx % total) + total) % total;
  else idx = Math.max(0, Math.min(total - 1, rawIdx));

  drawSpriteAt(sprite, idx, sx, sySprite, player.facing);
}

const LOCAL_COLORS = { body:'#3a5a9a', skin:'#f0c8a0' };
function drawFallbackBody(sx, sy, animT, animName, facing, colors){
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(sx, sy+8, 8, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = colors.body;
  ctx.fillRect(sx-6, sy-10, 12, 13);
  ctx.fillStyle = colors.skin;
  ctx.fillRect(sx-5, sy-18, 10, 8);
}

const REMOTE_PALETTE = [
  { body:'#d04a5a' }, { body:'#4a6ad0' }, { body:'#6ad04a' },
  { body:'#d0b04a' }, { body:'#b04ad0' }
];
function hashCode(s){ let h = 0; for (let i=0;i<s.length;i++) h = ((h<<5) - h) + s.charCodeAt(i) | 0; return h; }
function drawRemotePlayer(p){
  const sx = p.x - cam.x, sy = p.y - cam.y;
  if (sx < -80 || sx > VW+80 || sy < -80 || sy > VH+80) return;
  const pal = REMOTE_PALETTE[Math.abs(hashCode(p.name)) % REMOTE_PALETTE.length];

  const sprite = getPlayerSprite('idle');
  if (sprite){
    drawSpriteAt(sprite, 0, sx, sy + FOOT_OFFSET, p.facing);
  } else {
    ctx.fillStyle = pal.body;
    ctx.fillRect(sx-6, sy-10, 12, 13);
    ctx.fillStyle = '#f0c8a0';
    ctx.fillRect(sx-5, sy-18, 10, 8);
  }

  ctx.font = 'bold 10px Consolas, monospace';
  ctx.textAlign = 'center';
  const w = ctx.measureText(p.name).width + 8;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(sx - w/2, sy - 36, w, 13);
  ctx.fillStyle = '#88ffd8';
  ctx.fillText(p.name, sx, sy - 26);
  const hpPct = Math.max(0, Math.min(1, (p.hp ?? 20) / 20));
  const bw = 24;
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(sx - bw/2 - 1, sy - 22, bw + 2, 5);
  ctx.fillStyle = hpPct > 0.5 ? '#4ade4a' : hpPct > 0.25 ? '#ffcc40' : '#e8503a';
  ctx.fillRect(sx - bw/2, sy - 21, bw * hpPct, 3);
  ctx.textAlign = 'left';
}

/* ============================================================
   AIM ARROW — mũi tên đẹp dưới chân, xoay theo chuột PC
   ============================================================ */
function drawAimArrow(){
  if (!gameStarted || paused) return;

  const sx = Math.round(player.x - cam.x);
  const sy = Math.round(player.y - cam.y + FOOT_OFFSET + 4);
  const a = aim.angle;
  const cosA = Math.cos(a), sinA = Math.sin(a);
  const px = -sinA, py = cosA;   /* vector vuông góc */

  const dist = (aim.joyId !== null)
    ? 40 + Math.hypot(aim.joyX, aim.joyY) * 26
    : 58;
  const startOffset = 3;

  const x0 = sx + cosA * startOffset;
  const y0 = sy + sinA * startOffset;
  const x1 = sx + cosA * dist;
  const y1 = sy + sinA * dist;

  /* Đầu mũi tên */
  const headLen = 16;
  const headW = 11;
  const hbx = x1 - cosA * headLen;
  const hby = y1 - sinA * headLen;
  const hw1x = hbx + px * headW;
  const hw1y = hby + py * headW;
  const hw2x = hbx - px * headW;
  const hw2y = hby - py * headW;

  /* Thân mũi tên */
  const bodyW = 5;
  const bx1x = x0 + px * bodyW;
  const bx1y = y0 + py * bodyW;
  const bx2x = x0 - px * bodyW;
  const bx2y = y0 - py * bodyW;
  const bx3x = hbx + px * bodyW * 0.7;
  const bx3y = hby + py * bodyW * 0.7;
  const bx4x = hbx - px * bodyW * 0.7;
  const bx4y = hby - py * bodyW * 0.7;

  ctx.save();

  /* 1. Đổ bóng */
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.moveTo(bx1x + 2, bx1y + 3);
  ctx.lineTo(bx3x + 2, bx3y + 3);
  ctx.lineTo(hw1x + 2, hw1y + 3);
  ctx.lineTo(x1 + 2, y1 + 3);
  ctx.lineTo(hw2x + 2, hw2y + 3);
  ctx.lineTo(bx4x + 2, bx4y + 3);
  ctx.lineTo(bx2x + 2, bx2y + 3);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  /* 2. Viền đen */
  ctx.fillStyle = '#000000';
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 3.5;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(bx1x, bx1y);
  ctx.lineTo(bx3x, bx3y);
  ctx.lineTo(hw1x, hw1y);
  ctx.lineTo(x1, y1);
  ctx.lineTo(hw2x, hw2y);
  ctx.lineTo(bx4x, bx4y);
  ctx.lineTo(bx2x, bx2y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  /* 3. Thân gradient trắng */
  const grad = ctx.createLinearGradient(x0, y0, x1, y1);
  grad.addColorStop(0,   '#889878');
  grad.addColorStop(0.35,'#ffffff');
  grad.addColorStop(0.75,'#f0f4e8');
  grad.addColorStop(1,   '#d0dcc8');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(bx1x, bx1y);
  ctx.lineTo(bx3x, bx3y);
  ctx.lineTo(hw1x, hw1y);
  ctx.lineTo(x1, y1);
  ctx.lineTo(hw2x, hw2y);
  ctx.lineTo(bx4x, bx4y);
  ctx.lineTo(bx2x, bx2y);
  ctx.closePath();
  ctx.fill();

  /* 4. Highlight cánh trên */
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(hw1x, hw1y);
  ctx.lineTo(hbx, hby);
  ctx.closePath();
  ctx.fill();

  /* 5. Shadow cánh dưới */
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.moveTo(hbx, hby);
  ctx.lineTo(hw2x, hw2y);
  ctx.lineTo(x1, y1);
  ctx.closePath();
  ctx.fill();

  /* 6. Glow khi đang aim mobile */
  if (aim.joyId !== null){
    const t = performance.now() / 150;
    const pulse = 1 + Math.sin(t) * 0.2;
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#88ff60';
    ctx.beginPath();
    ctx.arc(x1, y1, 8 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* 7. Vòng đỏ auto-attack */
  if (aim.autoAttack){
    ctx.strokeStyle = '#ff5050';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(x1, y1, 13, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function render(){
  const nightFactor = getNightFactor();
  const cx0 = Math.max(0, Math.floor(cam.x / TILE));
  const cy0 = Math.max(0, Math.floor(cam.y / TILE));
  const cx1 = Math.min(WORLD_W, Math.ceil((cam.x + VW) / TILE));
  const cy1 = Math.min(WORLD_H, Math.ceil((cam.y + VH) / TILE));
  ctx.fillStyle = nightFactor > 0.6 ? '#0a0a14' : '#0f180f';
  ctx.fillRect(0, 0, VW, VH);
  for (let y=cy0; y<cy1; y++) for (let x=cx0; x<cx1; x++){
    drawTile(x, y, wGet(x, y), x*TILE - cam.x, y*TILE - cam.y);
  }
  const ents = [];
  for (const [id, p] of net.players) ents.push({ y: p.y, draw: () => drawRemotePlayer(p) });
  ents.push({ y: player.y, draw: () => drawPlayer() });
  ents.sort((a,b) => a.y - b.y);
  for (const e of ents) e.draw();

  drawAimArrow();

  for (const p of G.particles){
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - cam.x - p.size/2, p.y - cam.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  if (nightFactor > 0.05){
    ctx.fillStyle = `rgba(5, 8, 25, ${nightFactor * 0.75})`;
    ctx.fillRect(0, 0, VW, VH);
  }
  document.getElementById('time').textContent =
    `${nightFactor > 0.6 ? '🌙' : '☀'} ${getClockString()} · Ngày ${dayCount}`;
  document.getElementById('coords').innerHTML =
    `XYZ: <b>${(player.x/TILE).toFixed(1)} ${(player.y/TILE).toFixed(1)}</b>`;
}

function updateCam(){
  const targetX = player.x - VW/2;
  const targetY = player.y - VH/2;
  cam.x += (targetX - cam.x) * 0.15;
  cam.y += (targetY - cam.y) * 0.15;
  cam.x = Math.max(0, Math.min(WORLD_W*TILE - VW, cam.x));
  cam.y = Math.max(0, Math.min(WORLD_H*TILE - VH, cam.y));
}

let worldTime = 0.25;
const DAY_DURATION = 1200;
let dayCount = 1;
function updateDayNight(dt){
  worldTime += dt / DAY_DURATION;
  if (worldTime >= 1){ worldTime -= 1; dayCount++; }
  Audio2D.setNight(getNightFactor() > 0.6);
}
function getClockString(){
  const h = Math.floor(worldTime * 24);
  const m = Math.floor((worldTime * 24 - h) * 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

/* ============================================================
   HUD
   ============================================================ */
const hotbarEl = document.getElementById('hotbar');
function renderHotbar(){
  hotbarEl.innerHTML = '';
  for (let i=0;i<9;i++){
    const slot = document.createElement('div');
    slot.className = 'hslot' + (i === player.selected ? ' active' : '');
    const item = inv.hotbar[i];
    if (item){
      const def = defOf(item.id);
      const ic = document.createElement('div');
      ic.className = 'ic';
      ic.style.background = `linear-gradient(180deg, transparent 20%, ${def.color} 20%, ${def.color} 80%, transparent 80%)`;
      slot.appendChild(ic);
      const lbl = document.createElement('span');
      lbl.className = 'lbl'; lbl.textContent = (i+1);
      slot.appendChild(lbl);
    }
    slot.addEventListener('click', () => { player.selected = i; renderHotbar(); Audio2D.sfx.click(); });
    hotbarEl.appendChild(slot);
  }
}
function updateHpBar(){
  const pct = Math.max(0, player.hp / player.maxHp * 100);
  document.getElementById('hpFillInner').style.width = pct + '%';
  document.getElementById('hpText').textContent = Math.max(0, player.hp) + '/' + player.maxHp;
}
function flashDamage(){
  const bar = document.getElementById('hpBar');
  bar.style.boxShadow = '0 0 20px 4px #ff3030';
  setTimeout(() => { bar.style.boxShadow = '0 2px 0 rgba(0,0,0,.5)'; }, 200);
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ============================================================
   MENU
   ============================================================ */
window.Game = {
  startSingleplayer: () => startSingleplayer(),
  showMP: () => showMenuPage('mp'),
  showSettings: () => {
    if (gameStarted){ paused = true; document.getElementById('pause').classList.add('hidden'); }
    document.getElementById('menu').classList.remove('hidden');
    showMenuPage('settings');
  },
  backMain: () => {
    showMenuPage('main');
    if (gameStarted){ document.getElementById('menu').classList.add('hidden'); paused = false; }
  },
  hostRoom: () => hostRoom(),
  showJoin: () => showJoin(),
  joinRoom: () => joinRoom(),
  resumeGame: () => togglePause(),
  pauseSettings: () => {
    paused = false;
    document.getElementById('pause').classList.add('hidden');
    backToMenu(); showMenuPage('settings');
  },
  quitToMenu: () => backToMenu(),
};
const menuPages = {
  main: document.getElementById('menuMain'),
  mp: document.getElementById('menuMP'),
  settings: document.getElementById('menuSettings')
};
function showMenuPage(name){
  if (!menuPages[name]) return;
  for (const k in menuPages) menuPages[k].classList.toggle('hidden', k !== name);
}
async function hostRoom(){
  document.getElementById('hostPanel').classList.remove('hidden');
  document.getElementById('joinPanel').classList.add('hidden');
  const name = document.getElementById('hostName').value.trim() || 'Host';
  const status = document.getElementById('hostStatus');
  const codeEl = document.getElementById('roomCodeDisplay');
  status.textContent = 'Đang kết nối...';
  try {
    const code = await net.startHost(name);
    codeEl.textContent = code;
    codeEl.classList.remove('hidden');
    status.textContent = '✓ Chờ đối thủ...';
    initRNG(Date.now() & 0x7fffffff);
    world.fill(0); generateWorld();
    resetPlayerPosition(); initInv();
    setTimeout(() => startGame('host'), 800);
  } catch(e){ status.textContent = '❌ Lỗi: ' + (e.message || e); }
}
function showJoin(){
  document.getElementById('hostPanel').classList.add('hidden');
  document.getElementById('joinPanel').classList.remove('hidden');
  setTimeout(() => document.getElementById('joinCode').focus(), 100);
}
async function joinRoom(){
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const name = document.getElementById('joinName').value.trim() || 'Hunter';
  const status = document.getElementById('joinStatus');
  if (code.length < 4){ status.textContent = '❌ Mã không hợp lệ'; return; }
  status.textContent = 'Đang kết nối...';
  try {
    net.onWorldReady = () => { initInv(); startGame('client'); };
    await net.startClient(name, code);
    status.textContent = '✓ Đã kết nối...';
  } catch(e){ status.textContent = '❌ ' + (e.message || e); }
}
function bindSlider(id, valId, cb){
  const s = document.getElementById(id), v = document.getElementById(valId);
  if (!s) return;
  s.addEventListener('input', e => { v.textContent = e.target.value; cb(+e.target.value/100); });
  v.textContent = s.value; cb(+s.value/100);
}
bindSlider('setMaster', 'valMaster', v => Audio2D.setMasterVolume(v));
bindSlider('setMusic', 'valMusic', v => Audio2D.setMusicVolume(v));
bindSlider('setSfx', 'valSfx', v => Audio2D.setSfxVolume(v));
function toggleSettings(){
  if (gameStarted){
    paused = true;
    document.getElementById('pause').classList.add('hidden');
    document.getElementById('menu').classList.remove('hidden');
    showMenuPage('settings');
  } else showMenuPage('settings');
}

/* ============================================================
   GAME LIFECYCLE
   ============================================================ */
function startSingleplayer(){
  net.disconnect();
  initRNG(Date.now() & 0x7fffffff);
  world.fill(0); generateWorld();
  resetPlayerPosition(); initInv();
  startGame('sp');
}
function startGame(mode){
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('settingsBtn').classList.add('show');
  gameStarted = true; paused = false;
  Audio2D.init(); Audio2D.startMusic();
  renderHotbar(); updateHpBar();
  startNetSync(); updateNetHud();
  toast(mode === 'sp' ? '🎮 Chơi đơn' :
        mode === 'host' ? '🏠 Phòng: ' + net.roomCode : '⚔️ Đã vào phòng');
}
function togglePause(){
  if (!gameStarted) return;
  paused = !paused;
  document.getElementById('pause').classList.toggle('hidden', !paused);
  document.getElementById('settingsBtn').classList.toggle('show', !paused);
}
function backToMenu(){
  gameStarted = false; paused = false;
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('settingsBtn').classList.remove('show');
  net.disconnect();
  document.getElementById('menu').classList.remove('hidden');
  showMenuPage('main');
  if (netSyncTimer){ clearInterval(netSyncTimer); netSyncTimer = null; }
}
function resetPlayerPosition(){
  player.hp = player.maxHp;
  player.x = WORLD_W*TILE/2; player.y = WORLD_H*TILE/2;
  player.jumpT = 0; player.jumpY = 0;
  player.attackT = 0; player.hurtT = 0;
  player.sitting = false;
  player.currentAnim = 'idle'; player.animTime = 0;
  cam.x = player.x - VW/2; cam.y = player.y - VH/2;
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const G = { particles: [] };
let lastT = performance.now();
function loop(now){
  try {
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    if (gameStarted && !paused){
      updatePlayer(dt); updateDayNight(dt);
    }
    for (const p of G.particles){
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
    }
    G.particles = G.particles.filter(p => p.life > 0);
    if (gameStarted){
      updateCam(); render(); updateHpBar();
    }
  } catch(e){ console.error(e); }
  requestAnimationFrame(loop);
}
mouse.x = VW/2; mouse.y = VH/2;

loadProject().then(() => {
  showMenuPage('main');
  requestAnimationFrame(loop);
});
</script>
